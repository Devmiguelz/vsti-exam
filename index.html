/* ============================================================
   ESTADO — localStorage
   ============================================================ */
const TODAY = new Date().toISOString().split('T')[0];
let ST = {};

function loadST() {
  try { ST = JSON.parse(localStorage.getItem('vsti_v1') || '{}'); } catch(e){ ST = {}; }
  ST.srs        = ST.srs        || {};
  ST.read       = ST.read       || {};
  ST.quizHist   = ST.quizHist   || [];
  ST.setup      = ST.setup      || null;
  ST.lastStudy  = ST.lastStudy  || null;
  ST.streak     = ST.streak     || 0;
  ST.drills        = ST.drills        || {};
  ST.drills.match  = ST.drills.match  || {};
  ST.drills.order  = ST.drills.order  || {};
  ST.examLog       = ST.examLog       || [];
}

function saveST() {
  localStorage.setItem('vsti_v1', JSON.stringify(ST));
}

// Marca un ejercicio de "drill" (emparejar/ordenar) como completado — no afecta el % de quiz.
function markDrillDone(kind, modId, exIdx) {
  ST.drills[kind][modId] = ST.drills[kind][modId] || [];
  if (!ST.drills[kind][modId].includes(exIdx)) ST.drills[kind][modId].push(exIdx);
  saveST();
}

function drillDoneCount(kind, modId) {
  return (ST.drills[kind][modId] || []).length;
}

function exportST() {
  const a = document.createElement('a');
  a.href = 'data:application/json,' + encodeURIComponent(JSON.stringify(ST, null, 2));
  a.download = 'progreso_vsti.json';
  a.click();
}

function importST() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = e => {
    const fr = new FileReader();
    fr.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        ST = { ...ST, ...data };
        saveST();
        go('home');
        alert('Progreso importado correctamente.');
      } catch(err) { alert('Archivo inválido.'); }
    };
    fr.readAsText(e.target.files[0]);
  };
  inp.click();
}

/* ============================================================
   ALGORITMO SM-2
   ============================================================ */
function getCard(id) {
  return ST.srs[id] || { ease: 2.5, interval: 0, reps: 0, dueDate: TODAY };
}

function reviewCard(id, rating) {
  // rating: 0=Otra vez, 1=Difícil, 2=Fácil
  let { ease, interval, reps } = getCard(id);
  if (rating === 0) {
    reps = 0; interval = 1;
  } else if (rating === 1) {
    ease = Math.max(1.3, ease - 0.15);
    reps = Math.max(1, reps + 1);
    interval = reps <= 1 ? 1 : reps === 2 ? 3 : Math.max(1, Math.round(interval * 1.2));
  } else {
    reps += 1;
    interval = reps === 1 ? 1 : reps === 2 ? 6 : Math.round(interval * ease);
    ease = Math.min(3.0, ease + 0.1);
  }
  const due = new Date(); due.setDate(due.getDate() + interval);
  ST.srs[id] = { ease: +ease.toFixed(2), interval, reps, dueDate: due.toISOString().split('T')[0] };
  saveST();
}

function cardsForMod(modId) {
  return FC.filter(c => !modId || modId === 'all' || c.mod === modId);
}

function dueCards(modId) {
  // Solo cuentan tarjetas ya repasadas al menos una vez; las nuevas se
  // manejan aparte en newCards() — si no, cada tarjeta nueva contaba como
  // "vencida" Y "nueva" a la vez, duplicándola en la sesión y dando la
  // impresión de que la calificación anterior no se había guardado.
  return cardsForMod(modId).filter(c => ST.srs[c.id] && getCard(c.id).dueDate <= TODAY);
}

function newCards(modId) {
  return cardsForMod(modId).filter(c => !ST.srs[c.id]);
}

function buildSession(modId) {
  const due = dueCards(modId);
  const nc  = newCards(modId).slice(0, Math.max(0, 15 - due.length));
  return shuffle([...due, ...nc]);
}

function maturityPct(modId) {
  const cards = cardsForMod(modId);
  if (!cards.length) return 0;
  const mature = cards.filter(c => (ST.srs[c.id]?.interval || 0) >= 7).length;
  return Math.round(mature / cards.length * 100);
}

// Solo cuentan las actividades calificadas (quiz, verdadero/falso, completar) — emparejar y ordenar
// son ejercicios de práctica libre y se rastrean aparte (ver ST.drills), no inflan este porcentaje.
function histForMod(modId, type) {
  return ST.quizHist.filter(h => h.mod === modId && (type ? h.type === type || (type==='quiz' && !h.type) : (h.type !== 'match' && h.type !== 'order')));
}

function quizPctForMod(modId) {
  const hist = histForMod(modId);
  if (!hist.length) return 0;
  return Math.round(hist.filter(h => h.ok).length / hist.length * 100);
}

function domainPct(modId) {
  const srs  = maturityPct(modId);
  const quiz = quizPctForMod(modId);
  return quiz ? Math.round(srs * 0.5 + quiz * 0.5) : srs;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function totalDue() { return dueCards('all').length; }
function totalNew() { return newCards('all').length; }

let _curScreen = '';
function go(screen, arg) {
  _curScreen = screen;
  window.scrollTo(0, 0);
  const app = document.getElementById('app');
  const btns = document.querySelectorAll('.nav-btn');
  btns.forEach(b => b.classList.remove('active'));
  const nbMap = { home:'nb-home', modules:'nb-modules', module:'nb-modules',
                  cards:'nb-cards', quiz:'nb-quiz', results:'nb-quiz', setup:'nb-home',
                  history:'nb-history', 'exam-review':'nb-history' };
  const nb = document.getElementById(nbMap[screen]);
  if (nb) nb.classList.add('active');

  if (screen === 'home')    { app.innerHTML = renderHome(); }
  else if (screen === 'setup')   { app.innerHTML = renderSetup(); }
  else if (screen === 'modules') { app.innerHTML = renderModules(); }
  else if (screen === 'module')  { app.innerHTML = renderModule(arg); }
  else if (screen === 'read')    { app.innerHTML = renderRead(arg); }
  else if (screen === 'video')   { app.innerHTML = renderVideo(arg); }
  else if (screen === 'cards')   { startCards(arg); }
  else if (screen === 'match')   { startMatch(arg); }
  else if (screen === 'order')   { startOrder(arg, 0); }
  else if (screen === 'tf')      { startTF(arg); }
  else if (screen === 'fill')    { startFill(arg); }
  else if (screen === 'quiz')        { startQuiz(arg); }
  else if (screen === 'history')     { app.innerHTML = renderHistory(); }
  else if (screen === 'exam-review') { app.innerHTML = renderExamReview(arg); }
  initIcons();
}

/* ============================================================
   RADAR SVG
   ============================================================ */
function drawRadar(values, size) {
  // values: {mo:0..100, cfg:.., ...}
  const sz = size || 280, cx = sz/2, cy = sz/2, maxR = sz/2 - 50;
  const keys = MOD_KEYS;
  const n = keys.length;
  const angle = i => (-90 + i * (360 / n)) * Math.PI / 180;
  const ns = 'http://www.w3.org/2000/svg';

  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', sz); svg.setAttribute('height', sz);
  svg.setAttribute('viewBox', `0 0 ${sz} ${sz}`);

  // rings
  [20,40,60,80,100].forEach(s => {
    const r = s / 100 * maxR;
    const pts = keys.map((k,i) => { const a = angle(i); return `${cx + r*Math.cos(a)},${cy + r*Math.sin(a)}`; }).join(' ');
    const poly = document.createElementNS(ns,'polygon');
    poly.setAttribute('points', pts);
    poly.setAttribute('fill','none');
    poly.setAttribute('stroke', s===100 ? '#D8D7D1' : '#EBEAE5');
    poly.setAttribute('stroke-width','1');
    svg.appendChild(poly);
  });

  // axes + labels
  keys.forEach((k, i) => {
    const a = angle(i);
    const x2 = cx + maxR * Math.cos(a), y2 = cy + maxR * Math.sin(a);
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1',cx); line.setAttribute('y1',cy);
    line.setAttribute('x2',x2); line.setAttribute('y2',y2);
    line.setAttribute('stroke','#D8D7D1'); line.setAttribute('stroke-width','1');
    svg.appendChild(line);

    const lx = cx + (maxR + 30) * Math.cos(a);
    const ly = cy + (maxR + 30) * Math.sin(a);
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', lx); text.setAttribute('y', ly);
    text.setAttribute('text-anchor','middle'); text.setAttribute('dominant-baseline','middle');
    text.setAttribute('font-size', sz < 300 ? '9' : '10.5');
    text.setAttribute('font-family','-apple-system,sans-serif');
    text.setAttribute('fill', M[k].color); text.setAttribute('font-weight','600');
    const words = M[k].short.split(' ');
    const mid = Math.ceil(words.length / 2);
    const t1 = document.createElementNS(ns,'tspan'); t1.setAttribute('x',lx); t1.setAttribute('dy','-5'); t1.textContent = words.slice(0,mid).join(' ');
    const t2 = document.createElementNS(ns,'tspan'); t2.setAttribute('x',lx); t2.setAttribute('dy','13'); t2.textContent = words.slice(mid).join(' ');
    text.appendChild(t1); if(words.slice(mid).join('')) text.appendChild(t2);
    svg.appendChild(text);
  });

  // data polygon
  const dataPts = keys.map((k,i) => {
    const a = angle(i); const r = (values[k] || 0) / 100 * maxR;
    return { x: cx + r*Math.cos(a), y: cy + r*Math.sin(a) };
  });
  const poly = document.createElementNS(ns,'polygon');
  poly.setAttribute('points', dataPts.map(p=>`${p.x},${p.y}`).join(' '));
  poly.setAttribute('fill','rgba(169,132,63,0.25)'); poly.setAttribute('stroke','#A9843F'); poly.setAttribute('stroke-width','2');
  svg.appendChild(poly);
  dataPts.forEach(p => {
    const c = document.createElementNS(ns,'circle');
    c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); c.setAttribute('r','4');
    c.setAttribute('fill','#A9843F'); svg.appendChild(c);
  });
  return svg.outerHTML;
}

  if (!confirm(`¿Reiniciar todo el progreso de "${M[modId].name}"? Esta acción no se puede deshacer.`)) return;
  FC.filter(c => c.mod === modId).forEach(c => delete ST.srs[c.id]);

  delete ST.drills.match[modId];
  delete ST.drills.order[modId];
  saveST();
  alert(`Progreso de "${M[modId].name}" reiniciado.`);
  go('setup');
}

function resetAll() {
  if (!confirm('¿Reiniciar TODO tu progreso (flashcards, lectura, quiz, juegos y racha)? Tu fecha de examen configurada se mantiene. Esta acción no se puede deshacer.')) return;

  loadST();

    <div style="font-size:11px;color:var(--soft);margin-top:14px">Requiere sesión activa en Microsoft 365 / Bancolombia</div>
  </div>
  <button class="btn btn-outline btn-full" style="margin-top:12px" onclick="go('module','${id}')">${icon('arrow-left')} Volver al módulo</button>
  `;
}

/* ============================================================
   PANTALLA: FLASHCARDS (sesión SRS)
   ============================================================ */
let _fcSession = [], _fcIdx = 0, _fcFlipped = false, _fcMod = '';
let _fcCorrect = 0, _fcTotal = 0;

function startCards(modId) {
  _fcMod = modId;
  _fcSession = buildSession(modId);
  _fcIdx = 0; _fcFlipped = false; _fcCorrect = 0; _fcTotal = _fcSession.length;
  if (!_fcTotal) {
    document.getElementById('app').innerHTML = `
      <button class="back-btn" onclick="go('modules')">${icon('arrow-left')} Módulos</button>
      <div class="empty-state" style="margin-top:60px">
        <div style="font-size:48px">🎉</div>
        <div style="font-size:18px;font-weight:700;color:var(--navy);margin:12px 0">¡Todo al día!</div>
        <p style="font-size:14px;color:var(--soft)">No tienes tarjetas vencidas ni nuevas por ahora.<br>Vuelve mañana para continuar tu racha.</p>
        <button class="btn btn-outline" style="margin-top:20px" onclick="go('quiz','${modId}')">Practicar con el quiz</button>
      </div>`;
    return;
  }
  renderFCScreen();
}

function renderFCScreen() {
  const app = document.getElementById('app');
  if (_fcIdx >= _fcSession.length) {
    app.innerHTML = renderFCResults();
    return;
  }
  const card = _fcSession[_fcIdx];
  const cs = getCard(card.id);
  const mod = M[card.mod];
  app.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <button class="back-btn" onclick="go('modules')">${icon('arrow-left')} Salir</button>
    <span class="mod-pill" style="background:${mod.color}">${icon(mod.li)} ${mod.short}</span>
  </div>
  <div class="fc-counter">${_fcIdx + 1} / ${_fcSession.length} · ${_fcIdx - (_fcTotal - _fcSession.length)} nuevas respondidas</div>
  <div class="fc-shell">
    <div class="fc-card" id="fcCard" onclick="flipCard()">
      <div class="fc-front">${card.f}</div>
      ${_fcFlipped ? `<div class="fc-divider"></div><div class="fc-back">${card.b}</div>` : '<div class="fc-hint">Toca para revelar la respuesta</div>'}
    </div>
    ${_fcFlipped ? `
    <div class="rating-btns">
      <button class="rating-btn rating-again" onclick="rateCard(0)">${icon('rotate-ccw')} Otra vez</button>
      <button class="rating-btn rating-hard" onclick="rateCard(1)">${icon('help-circle')} Difícil</button>
      <button class="rating-btn rating-easy" onclick="rateCard(2)">${icon('check')} Fácil</button>
    </div>
    <div style="text-align:center;font-size:11px;color:var(--soft);margin-top:8px">
      Intervalo actual: ${cs.interval} día${cs.interval!==1?'s':''} · Repeticiones: ${cs.reps}
    </div>` : ''}
  </div>`;
  initIcons();
}

function flipCard() {
  if (_fcFlipped) return;
  _fcFlipped = true;
  renderFCScreen();
}

function rateCard(rating) {
  const card = _fcSession[_fcIdx];
  reviewCard(card.id, rating);
  // Update streak
  if (ST.lastStudy !== TODAY) {
    ST.streak = (ST.lastStudy === yesterday()) ? ST.streak + 1 : 1;
    ST.lastStudy = TODAY;
    saveST();
  }
  _fcIdx++;
  _fcFlipped = false;
  renderFCScreen();
}

function renderFCResults() {
  const mod = _fcMod && _fcMod !== 'all' ? M[_fcMod] : null;
  const dueNow = dueCards(_fcMod).length;
  return `
  <div class="card" style="text-align:center;padding:36px 24px">
    <div style="font-size:48px">⭐</div>
    <div style="font-size:22px;font-weight:700;color:var(--navy);margin:10px 0" class="serif">¡Sesión completada!</div>
    <div style="font-size:15px;color:var(--soft);margin-bottom:20px">Repasaste <b>${_fcTotal}</b> tarjeta${_fcTotal!==1?'s':''}</div>
    ${dueNow > 0 ? `<div style="font-size:13px;color:var(--bad);margin-bottom:16px">${dueNow} tarjeta${dueNow!==1?'s':''} siguen pendientes</div>` : `<div style="font-size:13px;color:var(--good);margin-bottom:16px">${icon('check-circle')} Sin tarjetas pendientes por hoy</div>`}
    <div class="btn-row" style="justify-content:center">
      ${dueNow > 0 ? `<button class="btn btn-primary" onclick="startCards('${_fcMod}')">Continuar repasando</button>` : ''}
      <button class="btn btn-outline" onclick="go(${mod ? `'module','${_fcMod}'` : `'home'`})">Volver</button>
    </div>
  </div>`;
}

function yesterday() {
  const d = new Date(); d.setDate(d.getDate() - 1);
  return d.toISOString().split('T')[0];
}

/* ============================================================
   PANTALLA: EJERCICIOS DE EMPAREJAR
   ============================================================ */
let _mMod = '', _mExIdx = 0;
let _mLeft = [], _mRight = [], _mDoneL = [], _mDoneR = [];
let _mSel = null, _mOk = 0;

function startMatch(modId, exIdx) {
  _mMod = modId; _mExIdx = exIdx || 0;
  _mOk = 0; _mSel = null;
  const ex = MATCH[modId][_mExIdx];
  _mLeft  = shuffle(ex.pairs.map((_,i) => i));
  _mRight = shuffle(ex.pairs.map((_,i) => i));
  _mDoneL = []; _mDoneR = [];
  renderMatch();
}

function renderMatch() {
  const mod = M[_mMod];
  const ex  = MATCH[_mMod][_mExIdx];
  const total = ex.pairs.length;
  const dots = MATCH[_mMod].map((_, i) => {
    const cls = i < _mExIdx ? 'ex-dot done' : i === _mExIdx ? 'ex-dot cur' : 'ex-dot';
    return `<div class="${cls}"></div>`;
  }).join('');

  const leftItems = _mLeft.map((pairIdx, pos) => {
    const done = _mDoneL.includes(pos);
    const sel  = _mSel === pos;
    const cls  = done ? 'match-item correct' : sel ? 'match-item selected' : 'match-item';
    return `<div class="${cls}" id="ml${pos}" onclick="selectLeft(${pos})">${ex.pairs[pairIdx].l}</div>`;
  }).join('');

  const rightItems = _mRight.map((pairIdx, pos) => {
    const done = _mDoneR.includes(pos);
    const cls  = done ? 'match-item correct' : 'match-item';
    return `<div class="${cls}" id="mr${pos}" onclick="selectRight(${pos})">${ex.pairs[pairIdx].r}</div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <button class="back-btn" onclick="go('module','${_mMod}')">${icon('arrow-left')} ${mod.name}</button>
    <div class="ex-dots">${dots}</div>
  </div>
  <div class="card" style="border-top:3px solid ${mod.color}">
    <div style="font-size:13px;color:var(--soft);margin-bottom:4px">Ejercicio ${_mExIdx+1} de ${MATCH[_mMod].length}</div>
    <div style="font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px">${ex.title}</div>
    <div style="font-size:12px;color:var(--soft)">Toca un término de la izquierda y luego su definición correcta a la derecha</div>
    <div class="match-score">Aciertos: <b>${_mOk}</b> / ${total}</div>
    <div class="match-grid">
      <div style="display:flex;flex-direction:column;gap:8px">${leftItems}</div>
      <div style="display:flex;flex-direction:column;gap:8px">${rightItems}</div>
    </div>
    ${_mOk === total ? `
    <div style="text-align:center;margin-top:16px">
      <div style="font-size:32px">🎉</div>
      <div style="font-size:16px;font-weight:700;color:var(--good);margin:6px 0">¡Perfecto!</div>
      ${_mExIdx + 1 < MATCH[_mMod].length
        ? `<button class="btn btn-primary" onclick="startMatch('${_mMod}', ${_mExIdx+1})">Siguiente ejercicio ${icon('arrow-right')}</button>`
        : `<div class="btn-row" style="justify-content:center">
             <button class="btn btn-brass" onclick="startMatch('${_mMod}', 0)">Repetir ejercicios</button>
             <button class="btn btn-outline" onclick="go('module','${_mMod}')">Volver al módulo</button>
           </div>`
      }
    </div>` : ''}
  </div>`;
  initIcons();
}

function selectLeft(pos) {
  if (_mDoneL.includes(pos)) return;
  _mSel = (_mSel === pos) ? null : pos;
  renderMatch();
}

function selectRight(pos) {
  if (_mDoneR.includes(pos) || _mSel === null) return;
  const leftPair  = _mLeft[_mSel];
  const rightPair = _mRight[pos];
  if (leftPair === rightPair) {
    _mDoneL.push(_mSel);
    _mDoneR.push(pos);
    _mOk++;
    _mSel = null;

    // Al completar el ejercicio, se marca como "drill" hecho — no cuenta para el % de quiz.
    if (_mOk === MATCH[_mMod][_mExIdx].pairs.length) markDrillDone('match', _mMod, _mExIdx);
    renderMatch();
  } else {
    // Wrong — flash animation
    const el = document.getElementById('mr' + pos);
    if (el) { el.classList.add('wrong'); setTimeout(() => renderMatch(), 400); }
  }
}

/* ============================================================
   PANTALLA: ORDENAR PASOS
   ============================================================ */
let _ordMod = '', _ordExIdx = 0, _ordShuffled = [], _ordPicked = [], _ordChecked = false, _ordCorrect = false;

function startOrder(modId, exIdx) {
  _ordMod = modId; _ordExIdx = exIdx || 0;
  _ordChecked = false; _ordCorrect = false; _ordPicked = [];
  const ex = ORDER[_ordMod][_ordExIdx];
  _ordShuffled = shuffle(ex.items.map((_, i) => i));
  renderOrder();
}

function renderOrder() {
  const mod = M[_ordMod];
  const ex = ORDER[_ordMod][_ordExIdx];
  const dots = ORDER[_ordMod].map((_, i) => {
    const cls = i < _ordExIdx ? 'ex-dot done' : i === _ordExIdx ? 'ex-dot cur' : 'ex-dot';
    return `<div class="${cls}"></div>`;
  }).join('');

  const availOrder = _ordShuffled.filter(i => !_ordPicked.includes(i));
  const availHtml = availOrder.length
    ? availOrder.map(i => `<div class="match-item" onclick="pickOrder(${i})">${ex.items[i]}</div>`).join('')
    : `<div style="font-size:13px;color:var(--soft);text-align:center;padding:12px">Todos los elementos ubicados</div>`;

  const pickedHtml = _ordPicked.length
    ? _ordPicked.map((i, pos) => {
        let cls = 'match-item selected';
        if (_ordChecked) cls = 'match-item ' + (i === pos ? 'correct' : 'wrong');
        const click = _ordChecked ? '' : `onclick="unpickOrder(${pos})"`;
        return `<div class="${cls}" ${click}>${pos + 1}. ${ex.items[i]}</div>`;
      }).join('')
    : `<div style="font-size:13px;color:var(--soft);text-align:center;padding:12px">Toca los elementos en el orden correcto</div>`;

  const allPicked = _ordPicked.length === ex.items.length;

  document.getElementById('app').innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <button class="back-btn" onclick="go('module','${_ordMod}')">${icon('arrow-left')} ${mod.name}</button>
    <div class="ex-dots">${dots}</div>
  </div>
  <div class="card" style="border-top:3px solid ${mod.color}">
    <div style="font-size:13px;color:var(--soft);margin-bottom:4px">Ejercicio ${_ordExIdx + 1} de ${ORDER[_ordMod].length}</div>
    <div style="font-size:16px;font-weight:700;color:var(--navy);margin-bottom:12px">${ex.title}</div>
    <div style="font-size:12px;color:var(--soft);margin-bottom:6px">Tu secuencia</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">${pickedHtml}</div>
    <div style="font-size:12px;color:var(--soft);margin-bottom:6px">Elementos disponibles</div>
    <div style="display:flex;flex-direction:column;gap:8px">${availHtml}</div>
    ${_ordChecked
      ? (_ordCorrect
          ? `<div style="text-align:center;margin-top:16px">
               <div style="font-size:32px">🎉</div>
               <div style="font-size:16px;font-weight:700;color:var(--good);margin:6px 0">¡Orden correcto!</div>
               ${_ordExIdx + 1 < ORDER[_ordMod].length
                  ? `<button class="btn btn-primary" onclick="startOrder('${_ordMod}', ${_ordExIdx + 1})">Siguiente ejercicio ${icon('arrow-right')}</button>`
                  : `<div class="btn-row" style="justify-content:center">
                       <button class="btn btn-brass" onclick="startOrder('${_ordMod}', 0)">Repetir ejercicios</button>
                       <button class="btn btn-outline" onclick="go('module','${_ordMod}')">Volver al módulo</button>
                     </div>`}
             </div>`
          : `<div style="text-align:center;margin-top:16px">
               <div style="font-size:14px;color:var(--bad);font-weight:600;margin-bottom:10px">Algunos elementos no están en el orden correcto.</div>
               <button class="btn btn-outline" onclick="startOrder('${_ordMod}', ${_ordExIdx})">Reintentar</button>
             </div>`)
      : (allPicked ? `<button class="btn btn-primary btn-full" style="margin-top:16px" onclick="checkOrder()">Verificar orden</button>` : '')}
  </div>`;
  initIcons();
}

function pickOrder(i) {
  if (_ordChecked) return;
  _ordPicked.push(i);
  renderOrder();
}

function unpickOrder(pos) {
  if (_ordChecked) return;
  _ordPicked.splice(pos, 1);
  renderOrder();
}

function checkOrder() {
  _ordChecked = true;
  _ordCorrect = _ordPicked.every((v, i) => v === i);
  if (_ordCorrect) markDrillDone('order', _ordMod, _ordExIdx);
  renderOrder();
}

/* ============================================================
   PANTALLA: VERDADERO O FALSO
   ============================================================ */
let _tfSession = [], _tfIdx = 0, _tfMod = '', _tfAnswered = false, _tfScores = {};

function startTF(modId) {
  _tfMod = modId;
  const pool = modId === 'all'
    ? shuffle(MOD_KEYS.flatMap(k => TF[k].map(t => ({ ...t, mod: k }))))
    : shuffle(TF[modId].map(t => ({ ...t, mod: modId })));
  _tfSession = pool;
  _tfIdx = 0; _tfAnswered = false;
  _tfScores = {}; MOD_KEYS.forEach(k => _tfScores[k] = { ok: 0, total: 0 });
  renderTFScreen();
}

function renderTFScreen() {
  const app = document.getElementById('app');
  if (_tfIdx >= _tfSession.length) { renderTFResults(); return; }
  const item = _tfSession[_tfIdx];
  const mod = M[item.mod];
  const pct = _tfSession.length ? Math.round(_tfIdx / _tfSession.length * 100) : 0;
  app.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <button class="back-btn" onclick="go('modules')">${icon('arrow-left')} Salir</button>
    <span class="mod-pill" style="background:${mod.color}">${icon(mod.li)} ${mod.short}</span>
  </div>
  <div class="prog-track"><div class="prog-fill-quiz" style="width:${pct}%"></div></div>
  <div style="font-size:12px;color:var(--soft);margin-bottom:12px">Afirmación ${_tfIdx + 1} de ${_tfSession.length}</div>
  <div class="qtext serif">${item.s}</div>
  <div class="opts">
    <div class="opt" id="tfTrue" onclick="answerTF(true)"><span class="mark">V</span><span class="otext">Verdadero</span></div>
    <div class="opt" id="tfFalse" onclick="answerTF(false)"><span class="mark">F</span><span class="otext">Falso</span></div>
  </div>
  <div class="explain-box" id="tfExplain"><span class="verdict" id="tfVerdict"></span><span id="tfExplainText"></span></div>
  <div style="display:flex;justify-content:flex-end;margin-top:20px;min-height:40px">
    <button class="btn btn-primary hidden" id="tfNext" onclick="nextTF()">${_tfIdx === _tfSession.length - 1 ? 'Ver resultados' : `Siguiente ${icon('arrow-right')}`}</button>
  </div>`;
  initIcons();
}

function answerTF(val) {
  if (_tfAnswered) return;
  _tfAnswered = true;
  const item = _tfSession[_tfIdx];
  const ok = val === item.a;
  _tfScores[item.mod].total++;
  if (ok) _tfScores[item.mod].ok++;
  ST.quizHist.push({ mod: item.mod, ok, date: TODAY, type: 'tf' });
  saveST();

  const trueEl = document.getElementById('tfTrue'), falseEl = document.getElementById('tfFalse');
  [trueEl, falseEl].forEach(e => e.classList.add('locked'));
  const correctEl = item.a ? trueEl : falseEl;
  correctEl.classList.add('correct');
  if (!ok) (val ? trueEl : falseEl).classList.add('wrong');

  const box = document.getElementById('tfExplain');
  box.classList.add('show', ok ? 'ok' : 'bad');
  document.getElementById('tfVerdict').innerHTML = ok ? `${icon('check-circle')} Correcto — ` : `${icon('x-circle')} Incorrecto — `;
  initIcons();
  document.getElementById('tfExplainText').textContent = item.e;
  document.getElementById('tfNext').classList.remove('hidden');
}

function nextTF() {
  _tfIdx++;
  _tfAnswered = false;
  renderTFScreen();
}

function renderTFResults() {
  const app = document.getElementById('app');
  let totalOk = 0, totalQ = 0;
  MOD_KEYS.forEach(k => { totalOk += _tfScores[k].ok; totalQ += _tfScores[k].total; });
  const pct = totalQ ? Math.round(totalOk / totalQ * 100) : 0;

  const breakdown = MOD_KEYS
    .filter(k => _tfScores[k].total > 0)
    .map(k => {
      const p = Math.round(_tfScores[k].ok / _tfScores[k].total * 100);
      return `<div style="padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:14px;font-weight:600;color:var(--navy)">${icon(M[k].li)} ${M[k].name}</span>
        <span style="font-size:13px;color:var(--soft)">${_tfScores[k].ok}/${_tfScores[k].total} · ${p}%</span>
      </div>`;
    }).join('');

  app.innerHTML = `
  <div class="card" style="text-align:center;padding:32px 24px">
    <div style="font-size:48px">✅</div>
    <div style="font-size:22px;font-weight:700;color:var(--navy);margin:10px 0" class="serif">Verdadero o Falso</div>
    <div style="font-size:44px;font-weight:700;color:var(--navy);margin:6px 0" class="serif">${totalOk}<span style="font-size:20px;color:var(--soft)">/${totalQ} · ${pct}%</span></div>
    ${breakdown}
    <div class="btn-row" style="justify-content:center;margin-top:16px">
      <button class="btn btn-primary" onclick="startTF('${_tfMod}')">Repetir</button>
      <button class="btn btn-outline" onclick="go(${_tfMod !== 'all' ? `'module','${_tfMod}'` : `'home'`})">Volver</button>
    </div>
  </div>`;
  initIcons();
}

/* ============================================================
   PANTALLA: COMPLETA LA PALABRA
   ============================================================ */
let _fiSession = [], _fiIdx = 0, _fiMod = '', _fiAnswered = false, _fiScores = {};

function startFill(modId) {
  _fiMod = modId;
  const pool = modId === 'all'
    ? shuffle(MOD_KEYS.flatMap(k => FILL[k].map(f => ({ ...f, mod: k }))))

    return { ...f, shuffled: shuffle(opts) };
  });

  _fiScores = {}; MOD_KEYS.forEach(k => _fiScores[k] = { ok: 0, total: 0 });

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">

  <div style="display:flex;justify-content:flex-end;margin-top:20px;min-height:40px">
    <button class="btn btn-primary hidden" id="fiNext" onclick="nextFill()">${_fiIdx === _fiSession.length - 1 ? 'Ver resultados' : `Siguiente ${icon('arrow-right')}`}</button>
  </div>`;
  initIcons();
}

function answerFill(i) {
  if (_fiAnswered) return;
  _fiAnswered = true;
  const item = _fiSession[_fiIdx];
  const chosen = item.shuffled[i];
  _fiScores[item.mod].total++;
  if (chosen.correct) _fiScores[item.mod].ok++;
  ST.quizHist.push({ mod: item.mod, ok: chosen.correct, date: TODAY, type: 'fill' });
  saveST();

  for (let j = 0; j < item.shuffled.length; j++) {
    const el = document.getElementById('fiOpt' + j);
    el.classList.add('locked');
    if (item.shuffled[j].correct) el.classList.add('correct');
    else if (j === i) el.classList.add('wrong');
    else el.classList.add('dim');

  const box = document.getElementById('fiExplain');
  box.classList.add('show', chosen.correct ? 'ok' : 'bad');
  document.getElementById('fiVerdict').innerHTML = chosen.correct ? `${icon('check-circle')} Correcto — ` : `${icon('x-circle')} Incorrecto — `;
  initIcons();
  document.getElementById('fiExplainText').textContent = item.e;
  document.getElementById('fiNext').classList.remove('hidden');
}

function nextFill() {

  _fiAnswered = false;
  renderFillScreen();
}

function renderFillResults() {

  const pct = totalQ ? Math.round(totalOk / totalQ * 100) : 0;

    .map(k => {
      const p = Math.round(_fiScores[k].ok / _fiScores[k].total * 100);
      return `<div style="padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:14px;font-weight:600;color:var(--navy)">${icon(M[k].li)} ${M[k].name}</span>
        <span style="font-size:13px;color:var(--soft)">${_fiScores[k].ok}/${_fiScores[k].total} · ${p}%</span>
      </div>`;
    }).join('');

  app.innerHTML = `
  <div class="card" style="text-align:center;padding:32px 24px">
    <div style="font-size:48px">✏️</div>
    <div style="font-size:22px;font-weight:700;color:var(--navy);margin:10px 0" class="serif">Completa la palabra</div>
    <div style="font-size:44px;font-weight:700;color:var(--navy);margin:6px 0" class="serif">${totalOk}<span style="font-size:20px;color:var(--soft)">/${totalQ} · ${pct}%</span></div>
    ${breakdown}
    <div class="btn-row" style="justify-content:center;margin-top:16px">
      <button class="btn btn-primary" onclick="startFill('${_fiMod}')">Repetir</button>
      <button class="btn btn-outline" onclick="go(${_fiMod !== 'all' ? `'module','${_fiMod}'` : `'home'`})">Volver</button>
    </div>
  </div>`;
  initIcons();
}

/* ============================================================
   PANTALLA: QUIZ (simulacro)
   ============================================================ */
let _qSession = [], _qIdx = 0, _qScores = {}, _qAnswered = false, _qMod = '', _qLog = [];

function startQuiz(modId) {
  _qMod = modId;
  const pool = modId === 'all'
    ? shuffle(BANK)
    : BANK.filter(q => q.mod === modId);
  _qSession = pool.map(q => {
    const opts = q.o.map((text,i) => ({ text, correct: i === q.c }));
    return { ...q, shuffled: shuffle(opts) };
  });
  _qIdx = 0; _qAnswered = false; _qLog = [];
  _qScores = {};
  MOD_KEYS.forEach(k => _qScores[k] = { ok: 0, total: 0 });
  renderQuizScreen();
}

function renderQuizScreen() {
  const app = document.getElementById('app');
  if (_qIdx >= _qSession.length) {
    renderQuizResults();
    return;
  }
  const q = _qSession[_qIdx];
  const mod = M[q.mod];
  const pct = _qSession.length ? Math.round(_qIdx / _qSession.length * 100) : 0;
  app.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <button class="back-btn" onclick="go('modules')">${icon('arrow-left')} Salir</button>
    <span class="mod-pill" style="background:${mod.color}">${icon(mod.li)} ${mod.short}</span>
  </div>
  <div class="prog-track"><div class="prog-fill-quiz" style="width:${pct}%"></div></div>
  <div style="font-size:12px;color:var(--soft);margin-bottom:12px">Pregunta ${_qIdx+1} de ${_qSession.length}</div>
  <div class="qtext serif">${q.q}</div>
  <div class="opts" id="opts">
    ${q.shuffled.map((opt,i) => `<div class="opt" id="opt${i}" onclick="selectOpt(${i})">
      <span class="mark">${'ABCD'[i]}</span>
      <span class="otext">${opt.text}</span>
    </div>`).join('')}
  </div>
  <div class="explain-box" id="explain">
    <span class="verdict" id="verdict"></span>
    <span id="explainText"></span>
  </div>
  <div style="display:flex;justify-content:flex-end;margin-top:20px;min-height:40px">
    <button class="btn btn-primary hidden" id="btnNext" onclick="nextQ()">
      ${_qIdx === _qSession.length - 1 ? 'Ver resultados' : `Siguiente ${icon('arrow-right')}`}
    </button>
  </div>`;
  initIcons();
}

function selectOpt(i) {
  if (_qAnswered) return;
  _qAnswered = true;
  const q = _qSession[_qIdx];
  const chosen = q.shuffled[i];
  _qScores[q.mod].total++;
  if (chosen.correct) _qScores[q.mod].ok++;

  // Record question detail for exam log
  _qLog.push({
    mod: q.mod,
    q: q.q,
    opts: q.shuffled.map(o => o.text),
    chosenIdx: i,
    correctIdx: q.shuffled.findIndex(o => o.correct),
    ok: chosen.correct,
    e: q.e
  });
  ST.quizHist.push({ mod: q.mod, ok: chosen.correct, date: TODAY });
  saveST();

  // Style options
  for (let j = 0; j < q.shuffled.length; j++) {
    const el = document.getElementById('opt' + j);
    el.classList.add('locked');
    if (q.shuffled[j].correct) el.classList.add('correct');
    else if (j === i) el.classList.add('wrong');
    else el.classList.add('dim');
  }
  const box = document.getElementById('explain');
  box.classList.add('show', chosen.correct ? 'ok' : 'bad');
  document.getElementById('verdict').innerHTML = chosen.correct ? `${icon('check-circle')} Correcta — ` : `${icon('x-circle')} Incorrecta — `;
  initIcons();
  document.getElementById('explainText').textContent = q.e;
  document.getElementById('btnNext').classList.remove('hidden');
  _qAnswered = true;
}

function nextQ() {
  _qIdx++;
  _qAnswered = false;
  renderQuizScreen();
}

function renderQuizResults() {
  const app = document.getElementById('app');
  let totalOk = 0, totalQ = 0;
  MOD_KEYS.forEach(k => { totalOk += _qScores[k].ok; totalQ += _qScores[k].total; });
  const pct = totalQ ? Math.round(totalOk / totalQ * 100) : 0;
  let headline = pct >= 85 ? 'Listo para certificarte' : pct >= 65 ? 'Vas bien, afina detalles' : 'Toca reforzar antes del examen';

  const breakdown = MOD_KEYS
    .filter(k => _qScores[k].total > 0)
    .map(k => {
      const p = Math.round(_qScores[k].ok / _qScores[k].total * 100);
      const msg = p < 60 ? 'Prioridad de repaso. Vuelve al contenido del módulo.' : p < 85 ? 'Vas bien, repasa donde fallaste.' : 'Dominado. Solo un vistazo antes del examen.';
      return `<div style="padding:12px 0;border-top:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
          <span style="font-size:14px;font-weight:700;color:var(--navy)">${icon(M[k].li)} ${M[k].name}</span>
          <span style="font-size:13px;color:var(--soft)">${_qScores[k].ok}/${_qScores[k].total} · ${p}%</span>
        </div>
        <div class="prog-bar"><div class="prog-fill" style="width:${p}%;background:${M[k].color}"></div></div>
        <div style="font-size:12.5px;color:var(--soft);margin-top:4px">${msg}</div>
      </div>`;
    }).join('');

  const scores = {};
  MOD_KEYS.forEach(k => scores[k] = _qScores[k].total ? Math.round(_qScores[k].ok/_qScores[k].total*100) : 0);

  // Save full exam session to log
  const examId = Date.now();
  ST.examLog.unshift({
    id: examId,
    date: TODAY,
    ts: examId,
    mod: _qMod,
    total: totalQ,
    ok: totalOk,
    pct,
    scores: JSON.parse(JSON.stringify(_qScores)),
    questions: _qLog
  });
  if (ST.examLog.length > 60) ST.examLog = ST.examLog.slice(0, 60);
  saveST();

  app.innerHTML = `
  <div class="card">
    <div style="font-size:12px;color:var(--soft);margin-bottom:4px">Resultado del simulacro</div>
    <div style="font-size:22px;font-weight:700;color:var(--navy)" class="serif">${headline}</div>
    <div style="font-size:48px;font-weight:700;color:var(--navy);margin:6px 0" class="serif">${totalOk}<span style="font-size:22px;color:var(--soft)">/${totalQ} · ${pct}%</span></div>
    <div class="radar-wrap" id="radarWrap2"></div>
    ${breakdown}
    <div class="btn-row">
      <button class="btn btn-primary" onclick="startQuiz('${_qMod}')">Repetir quiz</button>
      <button class="btn btn-outline" onclick="go('exam-review','${examId}')">${icon('search')} Revisar preguntas</button>
      <button class="btn btn-outline" onclick="go('history')">${icon('history')} Historial</button>
    </div>
  </div>`;

  const wrap2 = document.getElementById('radarWrap2');
  if (wrap2) wrap2.innerHTML = drawRadar(scores, Math.min(280, window.innerWidth - 60));
  initIcons();
}

/* ============================================================
   PANTALLA: HISTORIAL DE EXÁMENES
   ============================================================ */
function renderHistory() {
  const log = ST.examLog;
  if (!log.length) {
    return `
    <div class="topbar" style="margin-bottom:16px">
      <button class="back-btn" onclick="go('home')">${icon('arrow-left')} Inicio</button>
      <h2 class="serif">Historial</h2>
    </div>
    <div class="empty-state" style="margin-top:60px;text-align:center">
      <div style="margin-bottom:16px;color:var(--soft)"><i data-lucide="file-clock" style="width:52px;height:52px"></i></div>
      <div style="font-size:18px;font-weight:700;color:var(--navy);margin-bottom:8px">Sin exámenes aún</div>
      <p style="font-size:14px;color:var(--soft);margin-bottom:20px">Completa un simulacro para ver tu historial aquí.</p>
      <button class="btn btn-primary" onclick="go('quiz','all')">Ir al simulacro ${icon('arrow-right')}</button>
    </div>`;
  }

  const totalExams = log.length;
  const avgPct = Math.round(log.reduce((s, e) => s + e.pct, 0) / totalExams);
  const best = Math.max(...log.map(e => e.pct));

  const items = log.map((exam, idx) => {
    const dt = new Date(exam.ts);
    const dateStr = dt.toLocaleDateString('es-CO', { weekday:'short', day:'numeric', month:'short' });
    const timeStr = dt.toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit' });
    const modLabel = exam.mod === 'all' ? 'Todos los módulos' : (M[exam.mod]?.name || exam.mod);
    const pass = exam.pct >= 70;
    return `
    <div class="exam-item" onclick="go('exam-review','${exam.id}')">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <span class="exam-badge ${pass ? 'pass' : 'fail'}">${pass ? 'Aprobado' : 'A reforzar'}</span>
          <span style="font-size:12px;color:var(--soft)">${dateStr} · ${timeStr}</span>
        </div>
        <div style="font-size:13px;color:var(--navy);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${modLabel}</div>
        <div style="font-size:12px;color:var(--soft);margin-top:2px">${exam.ok} correctas · ${exam.total - exam.ok} incorrectas de ${exam.total}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">
        <div class="exam-score ${pass ? 'pass' : 'fail'}">${exam.pct}%</div>
        <div style="color:var(--soft)">${icon('chevron-right')}</div>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="topbar" style="margin-bottom:16px">
    <button class="back-btn" onclick="go('home')">${icon('arrow-left')} Inicio</button>
    <h2 class="serif">Historial</h2>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">
    <div class="stat-box"><div class="stat-num">${totalExams}</div><div class="stat-label">Exámenes</div></div>
    <div class="stat-box"><div class="stat-num">${avgPct}%</div><div class="stat-label">Promedio</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--good)">${best}%</div><div class="stat-label">Mejor nota</div></div>
  </div>
  ${items}`;
}

/* ============================================================
   PANTALLA: REVISIÓN DE EXAMEN
   ============================================================ */
function renderExamReview(examId) {
  const exam = ST.examLog.find(e => String(e.id) === String(examId));
  if (!exam) return `<button class="back-btn" onclick="go('history')">${icon('arrow-left')} Historial</button><p style="margin-top:20px">Examen no encontrado.</p>`;

  const dt = new Date(exam.ts);
  const dateStr = dt.toLocaleDateString('es-CO', { weekday:'long', day:'numeric', month:'long' });
  const timeStr = dt.toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit' });
  const modLabel = exam.mod === 'all' ? 'Todos los módulos' : (M[exam.mod]?.name || exam.mod);
  const pass = exam.pct >= 70;

  const filterBtns = `
  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    <button class="btn btn-sm btn-outline qr-filter active" data-filter="all" onclick="filterQR(this,'all')" style="border-color:var(--navy);color:var(--navy)">Todas (${exam.total})</button>
    <button class="btn btn-sm btn-outline qr-filter" data-filter="ok" onclick="filterQR(this,'ok')" style="border-color:var(--good);color:var(--good)">${icon('check-circle')} Correctas (${exam.ok})</button>
    <button class="btn btn-sm btn-outline qr-filter" data-filter="bad" onclick="filterQR(this,'bad')" style="border-color:var(--bad);color:var(--bad)">${icon('x-circle')} Incorrectas (${exam.total - exam.ok})</button>
  </div>`;

  const questions = (exam.questions || []).map((qr, i) => {
    const opts = qr.opts.map((text, oi) => {
      let cls = 'neutral';
      let marker = '';
      if (oi === qr.correctIdx) { cls = 'correct'; marker = icon('check'); }
      else if (oi === qr.chosenIdx && !qr.ok) { cls = 'wrong'; marker = icon('x'); }
      return `<div class="qr-opt ${cls}">${marker}<span>${'ABCD'[oi]}. ${text}</span></div>`;
    }).join('');

    const modName = M[qr.mod]?.name || qr.mod;
    return `
    <div class="qr-item ${qr.ok ? 'ok' : 'bad'}" data-result="${qr.ok ? 'ok' : 'bad'}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
        <span style="font-size:12px;color:var(--soft);font-weight:600">${i+1}. ${modName}</span>
        <span style="font-size:12px;font-weight:700;color:${qr.ok ? 'var(--good)' : 'var(--bad)'}">${qr.ok ? `${icon('check-circle')} Correcta` : `${icon('x-circle')} Incorrecta`}</span>
      </div>
      <div style="font-size:14px;font-weight:600;color:var(--navy);margin-bottom:8px;line-height:1.4">${qr.q}</div>
      ${opts}
      ${qr.e ? `<div class="qr-explain">${icon('info')} ${qr.e}</div>` : ''}
    </div>`;
  }).join('');

  const breakdown = MOD_KEYS
    .filter(k => exam.scores[k]?.total > 0)
    .map(k => {
      const s = exam.scores[k];
      const p = Math.round(s.ok / s.total * 100);
      return `<div style="padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px;color:var(--navy)">${icon(M[k].li)} ${M[k].name}</span>
        <span style="font-size:13px;color:var(--soft)">${s.ok}/${s.total} · ${p}%</span>
      </div>`;
    }).join('');

  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <button class="back-btn" onclick="go('history')">${icon('arrow-left')} Historial</button>
    <button class="btn btn-sm btn-outline" onclick="deleteExam('${exam.id}')" style="color:var(--bad);border-color:var(--bad)">${icon('trash-2')}</button>
  </div>
  <div class="card card-sm" style="margin-bottom:16px">
    <div style="font-size:12px;color:var(--soft);margin-bottom:4px">${dateStr} · ${timeStr} · ${modLabel}</div>
    <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:10px">
      <div style="font-size:40px;font-weight:700;color:${pass ? 'var(--good)' : 'var(--bad)'}" class="serif">${exam.pct}%</div>
      <div style="font-size:14px;color:var(--soft)">${exam.ok} correctas<br>${exam.total - exam.ok} incorrectas</div>
    </div>
    ${breakdown}
  </div>
  ${exam.questions?.length ? filterBtns + `<div id="qrList">${questions}</div>` : '<p style="color:var(--soft);font-size:13px">Este examen no tiene detalle de preguntas guardado.</p>'}`;
}

function filterQR(btn, filter) {
  document.querySelectorAll('.qr-filter').forEach(b => {
    b.classList.remove('active');
    b.style.background = '';
  });
  btn.classList.add('active');
  btn.style.background = filter === 'ok' ? 'var(--good-bg)' : filter === 'bad' ? 'var(--bad-bg)' : 'var(--paper)';
  document.querySelectorAll('#qrList .qr-item').forEach(el => {
    el.style.display = (filter === 'all' || el.dataset.result === filter) ? '' : 'none';
  });
}

function deleteExam(examId) {
  if (!confirm('¿Eliminar este examen del historial?')) return;
  ST.examLog = ST.examLog.filter(e => String(e.id) !== String(examId));
  saveST();
  go('history');
}

/* ============================================================
   PWA — Manifest + Service Worker (funciona desde HTTP/HTTPS)
   ============================================================ */
function setupPWA() {
  // Manifest dinámico
  const manifest = {
    name: 'Estudio · Certificación VSTI',
    short_name: 'VSTI',
    description: 'Plataforma de estudio para los 6 procesos críticos VSTI de Bancolombia',
    start_url: location.href,
    scope: location.href,
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#F4F4F1',
    theme_color: '#16233F',
    icons: [{
      src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='24' fill='%2316233F'/%3E%3Ctext x='96' y='128' font-size='100' text-anchor='middle' fill='%23A9843F'%3E📚%3C/text%3E%3C/svg%3E",
      sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable'
    }]
  };
  const mBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  const link = document.createElement('link');
  link.rel = 'manifest'; link.href = URL.createObjectURL(mBlob);
  document.head.appendChild(link);

  // Service Worker para caché offline
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    const sw = `
const C='vsti-cache-v1',U='${location.href}';
self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.add(U)));self.skipWaiting();});
self.addEventListener('activate',e=>{e.waitUntil(clients.claim());});
self.addEventListener('fetch',e=>{if(e.request.url===U)e.respondWith(caches.match(U).then(r=>r||fetch(U)));});`;
    const swURL = URL.createObjectURL(new Blob([sw], { type: 'application/javascript' }));
    navigator.serviceWorker.register(swURL).catch(() => {});
  }
}

// Banner de instalación en home si aún no está instalado
let _deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); _deferredPrompt = e;
});

function showInstallBanner() {
  return `<div class="pwa-banner" id="pwaBanner">
    <p>📱 <b>Instalar en tu celular</b> para usarlo sin internet y con ícono en la pantalla de inicio.</p>
    <button onclick="installPWA()">Instalar</button>
  </div>`;
}

function installPWA() {
  if (_deferredPrompt) {
    _deferredPrompt.prompt();
    _deferredPrompt.userChoice.then(() => { _deferredPrompt = null; go('home'); });
  } else {
    alert('Para instalar:\n• Android Chrome: menú ⋮ → "Agregar a pantalla de inicio"\n• iPhone Safari: botón compartir → "En la pantalla de inicio"');
  }
}

/* ============================================================
   INIT
   ============================================================ */
loadST();
setupPWA();

if (!ST.setup) {
  go('setup');
} else {
  go('home');
}

// After home renders, draw the radar (needs DOM to be ready)
const _origGo = go;
window.go = function(screen, arg) {
  _origGo(screen, arg);
  if (screen === 'home') {
    // Let DOM settle then draw radar
    requestAnimationFrame(() => afterHomeRender());
  }
};
// Call go again now that we overrode window.go
// (the first go() above used the inner reference, so radar was drawn via direct call)
requestAnimationFrame(() => { if (_curScreen === 'home') afterHomeRender(); });
// Initialize Lucide icons in static nav elements
requestAnimationFrame(() => initIcons());
</script>
