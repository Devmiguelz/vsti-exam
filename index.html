  {mod:'cam',q:'Un coordinador identifica que su cambio afectará a los clientes por más de 30 minutos. ¿Cuál es la acción correcta?',o:['Registrarlo como cambio ágil para evitar el Consejo','Avisar a clientes con mínimo 8 días de anticipación (Circular 028) y presentar al Consejo con 15 días','Ejecutarlo en horario nocturno para reducir el impacto percibido','Solicitar una extensión del plazo a la Superintendencia Financiera'],c:1,e:'La Circular 028 es clara: 8 días de anticipación mínima para comunicar a clientes + 15 días para el Consejo. Incumplirla implica sanciones económicas significativas.'},
  // ─── GESTIÓN DE INCIDENTES — preguntas adicionales ───
  {mod:'inc',q:'Al registrar un incidente en BMC Helix, ¿qué campo, al ser seleccionado, trae automáticamente el campo "Servicio" relacionado?',o:['Categoría operacional','Impacto','Grupo de soporte','CI (Elemento de Configuración)'],c:3,e:'El CI vincula automáticamente el servicio al que pertenece el componente afectado, sin necesidad de buscarlo manualmente.'},
  {mod:'inc',q:'Según el control BC07110344C005, ¿con qué frecuencia el Equipo de Dueño de Producto debe revisar los incidentes para identificar patrones?',o:['Diariamente','Semanalmente','Mensualmente','Trimestralmente'],c:2,e:'La revisión mensual es el control definido para detectar proactivamente incidentes que deberían convertirse en problemas.'},
  {mod:'inc',q:'¿En cuál pestaña de BMC Helix se deben documentar todas las acciones y análisis realizados durante la gestión de un incidente?',o:['Recursos','Relacionamientos','Aprobación','Actividad'],c:3,e:'La pestaña Actividad es el registro cronológico de todas las acciones; es fundamental para la calidad del ticket.'},
  {mod:'inc',q:'¿Cuándo se considera que un incidente fue correctamente resuelto en términos de gestión de causa raíz?',o:['Cuando se cierra antes de la mitad del ANS definido','Cuando el usuario final aprobó la resolución por correo','Cuando la prioridad bajó a Bajo antes del cierre','Cuando la causa raíz es accionable, prevenible y verificable, o se creó un caso Problema'],c:3,e:'La calidad de la causa raíz es el indicador real de una buena gestión; si no se conoce, debe crearse el caso Problema.'},
  {mod:'inc',q:'Si un incidente se repite con alta frecuencia (3-4 veces por semana) y el equipo no crea el caso Problema, ¿qué hace el proceso?',o:['Eleva automáticamente la prioridad a crítico','Cierra los duplicados y genera una sola notificación','Escala al área de Continuidad de Negocio','Crea directamente el caso Problema'],c:3,e:'El proceso tiene controles automáticos: la repetibilidad excesiva desencadena la creación del caso Problema si el equipo no actuó.'},
  // ─── GESTIÓN DE INCIDENTES — ANS, notificaciones y operación ───
  {mod:'inc',q:'¿Cuál es el ANS para un incidente crítico en la dirección de Transformación y Soporte (desarrollo)?',o:['4 horas','8 horas hábiles','16 horas','10 horas'],c:1,e:'Para Transformación/Soporte: crítico 8h hábiles, medio 3 días, bajo 5 días. Estos ANS son en horario hábil, NO 24/7 como los de infraestructura (4h, 10h, 18h).'},
  {mod:'inc',q:'¿A quién notifica el sistema cuando un ticket consume el 75% del ANS?',o:['Al usuario que reportó el incidente','A los miembros del grupo de soporte asignado','A los gerentes o directivos responsables del área','A la Superintendencia Financiera'],c:2,e:'La escalación es en dos pasos: al 50% notifica a los miembros del grupo; al 75% escala a los managers/directivos. Ambas notificaciones son automáticas desde Hilix.'},
  {mod:'inc',q:'¿Cuáles son los dos buzones clave para las notificaciones del proceso de incidentes?',o:['Outlook del grupo y el chat de Teams','BancolombiaTSM (notificaciones de tickets) y procesosti1 (gestión del proceso)','El correo personal del técnico y el del líder','La bandeja de entrada de Hilix y el portal del cliente'],c:1,e:'BancolombiaTSM recibe todas las notificaciones automáticas de los tickets. procesosti1 es el canal del equipo de proceso para comunicaciones de gestión.'},
  {mod:'inc',q:'¿Con qué frecuencia recibe alerta el grupo de soporte cuando tiene un solo integrante activo?',o:['Diariamente','Cada martes','Mensualmente','Solo cuando el incidente ya venció el ANS'],c:1,e:'La alerta de "grupo con un solo integrante activo" se envía cada martes — recordatorio para garantizar cobertura mínima en el equipo.'},
  {mod:'inc',q:'¿Cuándo recibe notificación automática un grupo de soporte por estar sin actividad?',o:['Después de 10 días sin tickets','Después de 30 días sin actividad','Después de 60 días sin tickets asignados','Después de un año fiscal sin actividad'],c:2,e:'Cada 60 días se notifica a grupos sin tickets — señal de que el grupo podría estar mal configurado o ser innecesario.'},
  {mod:'inc',q:'¿Cuál es la meta de cumplimiento de ANS para los incidentes?',o:['60%','80%','90.5%','100%'],c:2,e:'La meta de incidentes (90.5%) es la más alta de las tres métricas del proceso: eventos (80%) y problemas (60%). Refleja el impacto directo en la continuidad del negocio.'},
  {mod:'inc',q:'Un usuario reporta que el servicio está "lento pero disponible". ¿Se debe crear un ticket de incidente?',o:['No, solo se crea incidente si el servicio está completamente caído','Sí, la lentitud es una forma de degradación y también se considera incidente','Solo si el usuario lleva más de 30 minutos esperando','Solo si el CI afectado es de criticidad alta'],c:1,e:'La degradación del servicio (lentitud, intermitencia) también es un incidente. Cualquier afectación en la disponibilidad — no solo las caídas totales — debe gestionarse.'},
  {mod:'inc',q:'¿Cuál es el control BCOT110104C005 en el proceso de incidentes?',o:['La revisión trimestral de CIs en la CMDB','La revisión mensual de incidentes del periodo para identificar patrones y postular casos a Gestión de Problemas','El control SOX de aprobación de cambios','La auditoria semestral del proceso de configuración'],c:1,e:'El control BCOT110104C005 es la revisión mensual obligatoria realizada por el Equipo Dueño de Producto para detectar proactivamente problemas potenciales.'},
  // ─── GESTIÓN DE PROBLEMAS — preguntas adicionales ───
  {mod:'prob',q:'¿Cuál de las siguientes situaciones NO es criterio para postular un incidente como Problema?',o:['El incidente se repite con alta frecuencia','No se ha identificado la causa raíz','El impacto al negocio justifica una investigación profunda','El incidente fue resuelto dentro del ANS definido sin recurrencia'],c:3,e:'Resolver un incidente a tiempo y sin recurrencia es el resultado esperado, no un detonante para abrir un caso Problema.'},
  {mod:'prob',q:'Según la casuística del corte de abril, ¿cuántos Problemas se registraron de un total de 108 incidentes?',o:['42','32','15','8'],c:3,e:'108 incidentes generaron solo 8 casos Problema — la proporción es un indicador de madurez del proceso.'},
  {mod:'prob',q:'¿Cuál fue la segunda causa con mayor número de incidentes en la casuística de Canales Claves del corte de abril?',o:['Alta demanda de recursos (24)','Nequi (15)','Errores Humanos (8)','Ejecución CRQ (32)'],c:3,e:'Proveedor fue primero (42) y Ejecución CRQ fue segundo (32), señalando oportunidades de mejora en la gestión de cambios.'},
  {mod:'prob',q:'¿Qué significa aplicar la técnica de resolución "invertir el problema"?',o:['Asignar el problema al equipo que lo originó','Buscar un tercero externo sin sesgo','Usar IA para agrupar incidentes en mapas de calor','Buscar caminos alternativos preguntándose qué haría que el problema EMPEORE, para luego invertir esa lógica'],c:3,e:'Invertir el problema cambia la perspectiva y a menudo revela soluciones que el enfoque directo no encontraría.'},
  {mod:'prob',q:'¿Qué significa el concepto de "Repetibilidad" en el criterio de postulación a Problema?',o:['Que el mismo usuario reporta el incidente más de dos veces','Que el incidente ocurre en múltiples ambientes','Que el incidente fue reabierto más de una vez','La frecuencia con la que se presenta el incidente — si es alta, es criterio para abrir un caso Problema'],c:3,e:'La repetibilidad captura la frecuencia: si un incidente ocurre 3-4 veces por semana, la gestión de problemas debe intervenir.'},
  // ─── GESTIÓN DE PROBLEMAS — madurez, casos y técnicas ───
  {mod:'prob',q:'¿Cuáles son los 4 niveles de madurez en gestión de problemas y en cuál está Bancolombia?',o:['Básico, Intermedio, Avanzado, Experto — en Avanzado','Inicial, Estandarizado, Gestionado, Optimizado — en Gestionado','Reactividad, Prevención, Optimización, Innovación — en Prevención','PHVA niveles 1-4 — en nivel 3'],c:1,e:'Bancolombia está en el nivel Gestionado (tercer nivel de cuatro): mide, monitorea y corrige sistemáticamente con 84.9% de cumplimiento contra meta del 60%.'},
  {mod:'prob',q:'El equipo SAF (Administración de Factoring) implementó varias mejoras. ¿Cuál de estas NO fue parte de su estrategia?',o:['Mesas de triaje diarias con diagnóstico en dos niveles','Ventanas de restricción propias para pasos a producción','Cerrar todos sus casos problema para limpiar el indicador','Validaciones más rigurosas con responsabilidad directa en aprobaciones'],c:2,e:'El equipo SAF NO cerró problemas para limpiar indicadores — al contrario, creó más casos problema de forma proactiva para diagnosticar causas raíz y evitar reincidencias.'},
  {mod:'prob',q:'¿Qué sucede con el módulo de Gestión Proactiva si los equipos no documentan correctamente sus incidentes?',o:['El módulo igual genera mapas de calor precisos con la información disponible','La IA no tiene datos de calidad y los mapas de calor pierden precisión y valor analítico','El proceso crea los datos automáticamente basado en históricos','El módulo envía una alerta al Federal para auditar al equipo'],c:1,e:'ITSM Insights es tan buena como la calidad de los datos que recibe. Sin categorización correcta (CI, servicio, categoría operacional), los mapas de calor son imprecisos e inútiles.'},
  {mod:'prob',q:'¿Cuál de los siguientes planes de acción SÍ es válido para documentar en un HADA?',o:['Actualizar la documentación del proceso afectado','Crear un checklist de verificación para el próximo reinicio','Implementar automatización en el aprovisionamiento del componente afectado','Definir un modelo de atención de incidentes para el equipo'],c:2,e:'Solo la implementación técnica elimina directamente la causa raíz. Documentación, checklists y modelos de atención son mejora continua — válidos pero no evitan la recurrencia del incidente específico.'},
  {mod:'prob',q:'¿Cuántos casos problema se crearon a partir del análisis de los 108 incidentes de Canales Claves?',o:['42','15','8','32'],c:2,e:'108 incidentes generaron 8 casos problema — un porcentaje bajo que muestra la madurez de saber cuándo crear un caso problema con criterio, no por volumen o por cumplir indicadores.'},
  {mod:'prob',q:'Según la sesión, ¿por qué el plan de acción "vamos a reunirnos para encontrar la causa raíz" es inadecuado?',o:['Porque las reuniones no están permitidas en el proceso','Porque significa que la causa raíz aún no se conoce — y en ese caso lo correcto es crear un caso problema','Porque este plan solo lo puede documentar el equipo Federal','Porque las reuniones deben planificarse con 15 días de anticipación'],c:1,e:'Si el plan es "buscar la causa raíz", significa que aún no se sabe el por qué. En ese punto, el caso problema es el instrumento correcto para investigarla formalmente.'},
  {mod:'prob',q:'¿Cuál fue la segunda causa con mayor número de incidentes en el corte de Canales Claves?',o:['Fallas de proveedor (42 casos)','Ejecución de CRQ (32 casos)','Nequi (15 casos)','Errores humanos (8 casos)'],c:1,e:'El top 3: 1.º Proveedor (42), 2.º Ejecución de CRQ (32), 3.º Nequi (15). El segundo puesto señala que la gestión de cambios impacta directamente en los incidentes.'},
  {mod:'prob',q:'¿Qué diferencia hay entre el módulo de "Gestión Proactiva" y el de "Correlación de Incidentes" en Hilix?',o:['No hay diferencia, son dos nombres para el mismo módulo','Los dos requieren configuración previa y analizan rangos históricos','Gestión Proactiva requiere configuración y analiza periodos; Correlación viene preconfigurada y muestra tendencias en tiempo real','Correlación solo aplica a infraestructura; Proactiva solo a software'],c:2,e:'Diferencia clave: Gestión Proactiva requiere configuración y analiza periodos definidos por el equipo. Correlación viene configurada por defecto y muestra agrupaciones de incidentes en tiempo real.'},

<h3 class="section-title">Presentación del módulo</h3>
<div class="btn-row" style="margin-bottom:12px"><button class="btn btn-outline btn-sm" onclick="openPdf(this,'pdf-mo','docs/01_Modelo_Operativo.pdf')"><i data-lucide="file-text"></i> Ver presentación</button></div>

<h3 class="section-title">¿Qué es un modelo operativo?</h3>
<p class="body-p">Un modelo operativo es, en esencia, la manera en que una organización coordina sus esfuerzos para generar valor. Dentro de Bancolombia, esto se formaliza en la siguiente definición oficial:</p>
<div class="callout key"><div class="callout-title">Definición oficial Bancolombia</div><p>"La manera en que coordinamos áreas, procesos y funciones para entregar valor a nuestros clientes y a la organización." — comparable a una partitura, un GPS o una hoja de ruta organizacional.</p></div>
<h3 class="lesson-title">Los 4 pilares del modelo operativo</h3>
<table class="tbl"><thead><tr><th>Pilar</th><th>Rol dentro del modelo</th></tr></thead><tbody>
<tr><td><b>Personas</b></td><td>Ejecutan y sostienen la operación día a día.</td></tr>
<tr><td><b>Procesos</b></td><td>Dan la línea de ejecución, el "cómo" se opera.</td></tr>
<tr><td><b>Servicios</b></td><td>Lo que finalmente se entrega y consume.</td></tr>
<tr><td><b>Tecnología</b></td><td>Habilita, automatiza y escala la operación.</td></tr>
</tbody></table>

<h3 class="section-title">El ciclo PHVA — por qué el modelo evoluciona</h3>
<p class="body-p">El modelo operativo NO es una entidad fija. Se relaciona directamente con el ciclo <b>Planear – Hacer – Verificar – Actuar</b>:</p>
<table class="tbl"><thead><tr><th>Etapa</th><th>Qué implica</th></tr></thead><tbody>
<tr><td><b>Planear</b></td><td>Planeación fundamental en torno al modelo operativo.</td></tr>
<tr><td><b>Hacer</b></td><td>Se ejecuta lo planeado en el día a día.</td></tr>
<tr><td><b>Verificar</b></td><td>Se valida si lo ejecutado genera el valor esperado.</td></tr>
<tr><td><b>Actuar</b></td><td>Si no se logran los resultados, se corrige el rumbo.</td></tr>
</tbody></table>
<div class="callout rule"><div class="callout-title">Punto clave para el examen</div><p>El modelo operativo debe <b>evaluarse y adaptarse constantemente</b>. Idealmente, se vive tan conectado al día a día que se aplica de forma natural, no memorizado paso a paso.</p></div>

<h3 class="section-title">Los 4 tipos de modelos operativos</h3>
<table class="tbl"><thead><tr><th>#</th><th>Modelo</th><th>Características</th><th>Trade-off</th></tr></thead><tbody>
<tr><td>1</td><td><b>Centralizado</b></td><td>Control central de tecnología, típico de organizaciones clásicas.</td><td>Alto control · Baja alineación con el negocio</td></tr>
<tr><td>2</td><td><b>Distribuido</b></td><td>Unidades tecnológicas independientes con equipo propio embebido.</td><td>Alta alineación al producto · Genera caos, bajo control</td></tr>
<tr><td>3</td><td><b>Federal – State – Local</b></td><td>Modelo actual de Bancolombia: normativo (Federal), habilitador (State) y ejecutor (Local).</td><td>Buen equilibrio: control + alineación al negocio</td></tr>
<tr><td>4</td><td><b>Hub and Spoke</b></td><td>Centralizado en plataformas; entrega capacidades para que otros equipos construyan sobre ellas.</td><td>El centro de la conversación es el producto/plataforma</td></tr>
</tbody></table>

<h3 class="section-title">Federal, State y Local en detalle</h3>
<table class="tbl"><thead><tr><th>Nivel</th><th>Función principal</th><th>Detalle</th></tr></thead><tbody>
<tr><td><b>Federal</b></td><td>Gobierno y normatividad</td><td>Provee lineamientos, prácticas, capacidades y procesos. Son los Centros de Excelencia.</td></tr>
<tr><td><b>State</b></td><td>Habilitación y estandarización</td><td>Habilita productos, estandariza la operación, apoya adopción de lineamientos y garantiza cumplimiento. Entrega capacidades listas para consumir.</td></tr>
<tr><td><b>Local</b></td><td>Ejecución y consumo (BUs)</td><td>Consume los servicios/lineamientos con alta autonomía; ejecuta las acciones que generan el máximo valor. Incluye soporte, cercano al cliente final.</td></tr>
</tbody></table>
<div class="callout warn"><div class="callout-title"><i data-lucide="alert-triangle"></i>Punto de atención para el examen</div><p>Un equipo Local <b>NO puede decidir unilateralmente</b> saltarse un lineamiento Federal. Que el modelo no sea "una camisa de fuerza" significa que es adaptable, pero toda excepción debe <b>coordinarse y aprobarse</b> bajo el ciclo PHVA.</p></div>
<div class="callout data"><div class="callout-title">Dato clave</div><p>Aproximadamente <b>2,534 personas</b> entre las dos vicepresidencias deben certificarse. El examen se lanzó el 17 de julio y queda abierto 1 mes.</p></div>

<h3 class="section-title">Frameworks base: COBIT 5 e ITIL 4</h3>
<p class="body-p">El MOTI (Modelo Operativo de TI de Bancolombia) está sustentado en dos marcos internacionales reconocidos globalmente:</p>
<table class="tbl"><thead><tr><th>Framework</th><th>Aporte al MOTI</th><th>Pregunta que responde</th></tr></thead><tbody>
<tr><td><b>COBIT 5</b></td><td>Gobierno corporativo de TI: define quién decide, cómo se controla y cómo se rinden cuentas.</td><td>¿Quién es responsable y cómo se gobierna?</td></tr>
<tr><td><b>ITIL 4</b></td><td>Gestión de servicios de TI: mejores prácticas para diseñar, entregar y mejorar continuamente los servicios.</td><td>¿Cómo se opera y mejora el servicio?</td></tr>
</tbody></table>
<div class="callout warn"><div class="callout-title"><i data-lucide="alert-triangle"></i>Distinción clave para el examen</div><p>COBIT 5 responde la pregunta del <b>gobierno</b> (quién decide, quién rinde cuentas). ITIL 4 responde la pregunta de la <b>operación</b> (cómo se diseña y entrega el servicio). No son lo mismo — son complementarios.</p></div>
<div class="callout key"><div class="callout-title">Prácticas del MOTI incluyen</div><p>Gestionar la Configuración TI · Gestionar Cambios TI · Gestión de Incidentes · Gestión de Problemas · Habilitar y Mantener Soluciones — todos conectados bajo el mismo Modelo Operativo.</p></div>

<h3 class="section-title">Estructura M.O. Tecnología Bancolombia</h3>
<p class="body-p">Las vicepresidencias <b>VTIN</b> (Transformación e Innovación) y <b>VSTI</b> (Servicios de Tecnología e Infraestructura) materializan el modelo Federal–State–Local de la siguiente forma:</p>
<table class="tbl"><thead><tr><th>Nivel</th><th>Entornos / Áreas</th></tr></thead><tbody>
<tr><td><b>Local</b></td><td>Entorno Canales · Entorno Plataformas de Clientes y Canales · Entorno Negocios Especializados · Entorno Financiación y Consumo · Entorno Funciones Corporativas · Entorno Pagos y Seguros. Son los <b>EVC</b> (Equipos de Valor para el Cliente), con soporte E2E a sus productos y clientes.</td></tr>
<tr><td><b>State</b></td><td>Habilitadores de Producto y Operación · Aceleradores de transformación · Evolución Core de productos · Entorno de Datos e Integración · Plataformas de Datos · Plataformas de Desarrollo · Ingeniería de Plataforma · Fraude y Autenticación · Ciberseguridad.</td></tr>
<tr><td><b>Federal</b></td><td>Administración Integral · Modernización y Gobierno de TI — lineamientos, centros de excelencia y normatividad global.</td></tr>
<tr><td><b>CDEs (transversales)</b></td><td>CDE Infraestructura &amp; Operación · CDE DevExp · CDE Arquitectura y Arquitectura Empresarial — soporte cross a todos los entornos.</td></tr>
</tbody></table>
<div class="callout key"><div class="callout-title">¿Qué son los CDEs?</div><p>Los <b>CDE (Centros de Excelencia)</b> son equipos <b>transversales</b> que dan soporte especializado a todos los niveles y entornos simultáneamente — no pertenecen a un solo entorno:<br>• <b>CDE Infraestructura &amp; Operación:</b> gestión y operación de la infraestructura tecnológica.<br>• <b>CDE DevExp:</b> experiencia de desarrollo, herramientas y plataformas (procesos como HyMS).<br>• <b>CDE Arquitectura Empresarial:</b> diseño y gobierno de arquitectura de TI.</p></div>
<div class="callout data"><div class="callout-title">¿Qué es un EVC?</div><p>Un <b>EVC (Equipo de Valor para el Cliente)</b> es la célula del nivel Local con responsabilidad integral de extremo a extremo (E2E) sobre sus productos y servicios. Tienen soporte completo: desarrollo, operación y relación con el cliente final. Son la expresión más concreta del modelo Federal–State–Local en el día a día.</p></div>

<h3 class="section-title">El modelo de plataforma</h3>
<div class="callout rule"><div class="callout-title">Plataforma = Negocio + Proceso + Tecnología</div><p>Una plataforma en Bancolombia no es solo tecnología; es la integración de tres elementos: el <b>negocio</b> (propósito y valor), el <b>proceso</b> (cómo se opera), y la <b>tecnología</b> (cómo se habilita). Solo cuando los tres están alineados, la plataforma genera valor real y sostenible.</p></div>

<h3 class="section-title">Gobierno del MO — métricas como termómetro</h3>
<div class="callout data"><div class="callout-title">Las métricas como termómetro del PHVA</div><p>Las métricas de los procesos de TI son el instrumento real para la etapa "Verificar" del ciclo PHVA. Miden si la operación funciona y si el modelo está generando valor. Sin métricas, el ciclo PHVA no puede cerrarse correctamente.</p></div>
<div class="callout key"><div class="callout-title">Principio clave del MOTI</div><p>"Cumplir el proceso es lo que asegura que el valor no sea un evento de una sola vez, sino una constante." El MO promueve que los procesos no son camisas de fuerza, pero su evolución debe ser ordenada mediante el ciclo PHVA.</p></div>

<h3 class="section-title">Glosario rápido</h3>
<div class="term-row"><span class="term-word">PHVA</span><span class="term-def">Planear, Hacer, Verificar, Actuar — ciclo de mejora continua del modelo operativo.</span></div>

<h3 class="section-title">Presentación del módulo</h3>
<div class="btn-row" style="margin-bottom:12px"><button class="btn btn-outline btn-sm" onclick="openPdf(this,'pdf-cfg','docs/02_Gestionar_Configuracion_TI.pdf')"><i data-lucide="file-text"></i> Ver presentación</button></div>
<iframe id="pdf-cfg" src="docs/02_Gestionar_Configuracion_TI.pdf" width="100%" height="560" style="display:none;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px" title="Gestión de la Configuración"></iframe>
<h3 class="section-title">¿Qué es el proceso de Gestión de la Configuración?</h3>
<p class="body-p">Es el proceso que gestiona —identifica, registra y controla— todos los componentes de infraestructura tecnológica del Banco. También se conoce como <b>ITCM</b> (IT Configuration Management) o, más comúnmente, como la <b>CMDB</b>.</p>
<div class="callout key"><div class="callout-title">Los 3 pilares del proceso</div><p><b>CI</b> (Elemento de Configuración) + <b>CMDB</b> (repositorio) + <b>Herramienta</b> (BMC Helix / Hilix) = el ecosistema completo de gestión de la configuración.</p></div>

<h3 class="section-title">El Elemento de Configuración (CI)</h3>
<p class="body-p">Un CI es <b>cualquier componente que requiera ser gestionado para habilitar un servicio de TI</b>: servidores, bases de datos, aplicaciones, componentes de red, estaciones de trabajo, cajeros electrónicos, etc.</p>
<div class="callout data"><div class="callout-title">Dato de escala</div><p>La CMDB tiene actualmente alrededor de <b>250,000 elementos de configuración</b> de diferentes tipologías.</p></div>

<h3 class="section-title">Estructura jerárquica de la CMDB</h3>
<table class="tbl"><thead><tr><th>Nivel</th><th>Descripción</th></tr></thead><tbody>
<tr><td><b>Servicio</b></td><td>En la cabeza de la jerarquía. Un servicio puede relacionarse con una o varias aplicaciones.</td></tr>
<tr><td><b>Aplicaciones</b></td><td>Se relacionan con el servicio que soportan.</td></tr>
<tr><td><b>Transacciones</b></td><td>Modelamiento en curso de las transacciones críticas del Banco.</td></tr>
<tr><td><b>Componentes técnicos</b></td><td>El detalle de qué componentes soportan cada transacción.</td></tr>
</tbody></table>

<h3 class="section-title">Relación con otros procesos</h3>
<table class="tbl"><thead><tr><th>Proceso</th><th>Cómo se relaciona con la CMDB</th></tr></thead><tbody>
<tr><td><b>Incidentes y Problemas</b></td><td>El CI es campo obligatorio — permite identificar el impacto real y el equipo responsable.</td></tr>
<tr><td><b>Habilitar y Mantener</b></td><td>El App Code (CI) es el primer dato solicitado. Entrada obligatoria al proceso.</td></tr>
<tr><td><b>Cambios (CRQ)</b></td><td>El CI identifica qué se va a afectar, qué servicios se impactan y qué conflictos pueden existir.</td></tr>
<tr><td><b>Escaneo de vulnerabilidades</b></td><td>Ciberseguridad <b>NO escanea</b> ningún componente que no esté en la CMDB.</td></tr>
<tr><td><b>Continuidad de negocio</b></td><td>Identifica componentes de aplicaciones VIA (vitales) y sus responsables.</td></tr>
</tbody></table>

<h3 class="section-title">Políticas y herramientas clave</h3>
<div class="callout rule"><div class="callout-title">App Code — el atributo obligatorio</div><p>Todo componente en la CMDB tiene un atributo clave y obligatorio: el <b>App Code</b>. A través de este código se identifica el responsable de cada componente.</p></div>
<div class="callout warn"><div class="callout-title"><i data-lucide="alert-triangle"></i>Segregación de funciones</div><p>En Hilix, <b>solo los dueños de cada tipo de componente</b> pueden actualizarlo. No cualquiera puede modificar la CMDB.</p></div>

<h3 class="section-title">Validación periódica</h3>
<table class="tbl"><thead><tr><th>Tipo</th><th>Cómo funciona</th></tr></thead><tbody>
<tr><td><b>Automática (Nube)</b></td><td>El tag obligatorio de App Code en despliegues garantiza el relacionamiento. Se carga 3 veces al día.</td></tr>
<tr><td><b>Manual (On-premise)</b></td><td>Trimestralmente con los dueños de las aplicaciones y los dueños de clase.</td></tr>
</tbody></table>
<div class="callout warn"><div class="callout-title">Errores comunes</div><p>• No actualizar la CMDB después de un cambio de SO. • No actualizar responsables tras cambios de estructura. • Relacionamiento incorrecto o faltante entre CIs. • No validar periódicamente como dueño qué componentes tengo asociados.</p></div>

<h3 class="section-title">Etapas del proceso</h3>
<table class="tbl"><thead><tr><th>Etapa</th><th>Actividades principales</th></tr></thead><tbody>
<tr><td><b>1. Gestión y planificación</b></td><td>Definir estrategia de configuración, establecer herramienta ITSM, evaluar riesgos y oportunidades, definir estándares de arquitectura y lineamientos HyMS.</td></tr>
<tr><td><b>2. Implementar la gestión</b></td><td>Actas de clase, asignar dueños de clase, establecer lineamientos y políticas, definir roles y responsabilidades, administrar la CMDB.</td></tr>
<tr><td><b>3. Mejora continua</b></td><td>Identificar y corregir desviaciones, aseguramiento de la configuración (control), planes de acción ante incumplimientos.</td></tr>
<tr><td><b>Transversal</b></td><td>Modelo operativo, medición y monitoreo permanente en todas las etapas.</td></tr>
</tbody></table>

<h3 class="section-title">Las 4 políticas clave del proceso</h3>
<table class="tbl"><thead><tr><th>#</th><th>Política</th></tr></thead><tbody>
<tr><td><b>1</b></td><td><b>Responsabilidad compartida e integridad de la CMDB</b> — todos son responsables de mantener actualizada la información de sus componentes.</td></tr>
<tr><td><b>2</b></td><td><b>CMDB como fuente oficial y autoritativa del inventario de TI</b> — es LA referencia. No hay otro inventario válido en la organización.</td></tr>
<tr><td><b>3</b></td><td><b>Certificación periódica de modelamiento de aplicaciones y atributos técnicos</b> — control operativo: verificación trimestral con dueños de clase.</td></tr>
<tr><td><b>4</b></td><td><b>Todo cambio, evento, incidente o problema debe tener relacionado un CI activo en la CMDB</b> — sin CI, el ticket no está bien registrado.</td></tr>
</tbody></table>

<h3 class="section-title">Ecosistema de módulos Helix (ITSM)</h3>
<p class="body-p">BMC Helix no es un solo módulo — es un ecosistema de componentes especializados que trabajan en conjunto:</p>
<table class="tbl"><thead><tr><th>Módulo / Componente</th><th>Función</th></tr></thead><tbody>
<tr><td><b>Módulo CMDB</b></td><td>Repositorio central de CIs, atributos y relaciones.</td></tr>
<tr><td><b>Portal Configuración</b></td><td>Interfaz de usuario para consultar y gestionar CIs.</td></tr>
<tr><td><b>Automatización Nube</b></td><td>Carga automática de CIs cloud 3 veces al día via tag App Code.</td></tr>
<tr><td><b>PBI (Power BI)</b></td><td>Dashboards de seguimiento: miden la <b>completitud</b> y <b>exactitud</b> de los CIs — qué tan bien documentados y actualizados están.</td></tr>
<tr><td><b>Módulo Dashboards</b></td><td>Visualización del estado de la CMDB en tiempo real.</td></tr>
<tr><td><b>WO (Work Orders)</b></td><td>Órdenes de trabajo relacionadas con CIs y actividades de mantenimiento.</td></tr>
<tr><td><b>API</b></td><td>Integración de la CMDB con otros sistemas del Banco. <b>Acceso exclusivo para dueños de clase.</b></td></tr>
<tr><td><b>Ofertas</b></td><td>Catálogo con 2 tipos: aplicaciones de negocio y aplicaciones de soporte.</td></tr>
</tbody></table>
<div class="callout warn"><div class="callout-title"><i data-lucide="alert-triangle"></i>Estado del Portal de Configuración</div><p>El <b>Portal de Configuración</b> está actualmente <b>en construcción</b>. Facilitará la certificación trimestral y la documentación de CIs de forma más amigable. Por ahora, la gestión se hace directamente en Hilix.</p></div>
<div class="callout rule"><div class="callout-title">API de la CMDB — acceso restringido</div><p>La API solo está disponible para <b>dueños de clase</b>. Garantiza segregación de funciones: nadie puede integrar sistemas externos con la CMDB sin ser responsable de esa tipología de componente.</p></div>

<h3 class="section-title">¿Qué pasa si no se gestiona correctamente?</h3>
<table class="tbl"><thead><tr><th>Situación</th><th>Consecuencia real</th></tr></thead><tbody>
<tr><td><b>CRQ sin CI</b></td><td>No se sabe qué se está cambiando ni qué servicios pueden verse afectados. Riesgo de impacto no previsto en producción.</td></tr>
<tr><td><b>CI sin responsable</b></td><td>Si hay un incidente con ese componente, nadie sabe a quién escalar. El ticket queda huérfano y el ANS corre.</td></tr>
<tr><td><b>Incidente sin CI</b></td><td>No hay visibilidad del impacto real. Las métricas de disponibilidad de ese servicio quedan incorrectas e incompletas.</td></tr>
</tbody></table>
<div class="callout key"><div class="callout-title">"La CMDB es el cerebro de la operación de TI"</div><p>Mantenerla actualizada no es responsabilidad de un equipo central — <b>es compromiso de todos</b>. Cada equipo es responsable de los CIs asociados a sus aplicaciones y componentes.</p></div>

<h3 class="section-title">Glosario rápido</h3>
<div class="term-row"><span class="term-word">CI</span><span class="term-def">Configuration Item — cualquier componente gestionado para habilitar un servicio de TI.</span></div>
<div class="term-row"><span class="term-word">CMDB</span><span class="term-def">Configuration Management Data Base — repositorio central y autoritativo de CIs, atributos y relaciones.</span></div>
<div class="term-row"><span class="term-word">App Code</span><span class="term-def">Atributo obligatorio que identifica el código de la aplicación y su responsable.</span></div>
<div class="term-row"><span class="term-word">BMC Helix</span><span class="term-def">Herramienta ITCM oficial del Banco (conocida internamente como Hilix).</span></div>
<div class="term-row"><span class="term-word">Dueño de clase</span><span class="term-def">Responsable de una tipología completa de componentes (ej. todos los servidores x86).</span></div>
<div class="term-row"><span class="term-word">Aplicaciones VIA</span><span class="term-def">Aplicaciones vitales para la continuidad del negocio.</span></div>

<h3 class="section-title">Presentación del módulo</h3>
<div class="btn-row" style="margin-bottom:12px"><button class="btn btn-outline btn-sm" onclick="openPdf(this,'pdf-cam','docs/03_Gestionar_Cambios_TI.pdf')"><i data-lucide="file-text"></i> Ver presentación</button></div>
<iframe id="pdf-cam" src="docs/03_Gestionar_Cambios_TI.pdf" width="100%" height="560" style="display:none;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px" title="Gestión de Cambios TI"></iframe>
<h3 class="section-title">¿Por qué es crítico este proceso? — Ley SOX</h3>
<p class="body-p">El proceso de Gestión de Cambios responde a tres razones fundamentales: mantener la imagen del Banco, garantizar disponibilidad de servicios, y cumplir con la <b>Ley SOX (Sarbanes-Oxley)</b> que rige a todas las empresas que cotizan en la Bolsa de Nueva York — como Bancolombia.</p>
<div class="callout rule"><div class="callout-title">Control SOX del proceso</div><p>La <b>aprobación del cambio</b> es el control SOX. Cada año el Banco se certifica ante auditorías internas y externas. La aprobación NO puede ser "a la carrera" — es la certificación formal de que el equipo está listo para producción.</p></div>

<h3 class="section-title">¿Qué es un cambio TI?</h3>
<p class="body-p">Cualquier <b>adición, modificación o eliminación</b> de componentes de software, infraestructura o TI en producción. El foco siempre es el <b>ambiente de producción</b>.</p>
<div class="callout data"><div class="callout-title">Dato de volumen</div><p>El proceso genera entre <b>5,000 y 6,000 cambios mensuales</b> de todos los tipos. Aprox. 52-53% son automáticos.</p></div>

<h3 class="section-title">Tipos de cambio</h3>
<table class="tbl"><thead><tr><th>Tipo</th><th>Características clave</th></tr></thead><tbody>
<tr><td><b>Ágil</b></td><td>No genera afectación. A demanda, sin coordinación. Encuesta de riesgos obligatoria. Cierre manual.</td></tr>
<tr><td><b>Estándar</b></td><td>Plantillas ya certificadas como libres de indisponibilidad. <b>ÚNICO tipo exento</b> de encuesta de riesgos.</td></tr>
<tr><td><b>Programado</b></td><td>Va al Consejo de Cambios. Genera afectación. Requiere fecha y coordinación. Encuesta de riesgos obligatoria.</td></tr>
<tr><td><b>Emergencia</b></td><td>Resuelve incidente o riesgo inminente. <b>ÚNICO tipo que se puede ejecutar y legalizar después.</b> Requiere coordinación con GIOTI.</td></tr>
</tbody></table>

<h3 class="section-title">La Circular 028 — norma regulatoria clave</h3>
<div class="callout warn"><div class="callout-title"><i data-lucide="alert-triangle"></i>Circular 028 — Superintendencia Financiera</div><p>Si un servicio de cara al cliente tendrá indisponibilidad de <b>30 minutos o más</b>: comunicar a los clientes con <b>mínimo 8 días calendario de anticipación</b> y presentar al Consejo con <b>15 días de anticipación</b>. Incumplir implica sanciones económicas significativas.</p></div>

<h3 class="section-title">El Consejo de Cambios</h3>
<table class="tbl"><thead><tr><th>Día</th><th>Actividad</th></tr></thead><tbody>
<tr><td><b>Lunes y miércoles (tarde)</b></td><td>Se genera el Acta. Los cambios deben estar creados y APROBADOS antes del mediodía.</td></tr>
<tr><td><b>Martes y jueves (9:00 a.m.)</b></td><td>Se realiza el Consejo: se revisan, discuten y aprueban o rechazan los cambios.</td></tr>
<tr><td><b>Martes y jueves (tarde)</b></td><td>Se envían las notas del Acta en firme, reflejadas en Hilix.</td></tr>
</tbody></table>

<h3 class="section-title">Roles y controles en Hilix</h3>
<table class="tbl"><thead><tr><th>Rol</th><th>Función</th></tr></thead><tbody>
<tr><td><b>Coordinador</b></td><td>Responsable de principio a fin: crea el cambio, asigna tareas y está pendiente del cierre.</td></tr>
<tr><td><b>Gestor</b></td><td>Técnicamente el mismo rol que coordinador dentro de Hilix.</td></tr>
<tr><td><b>Aprobador</b></td><td>Tiene los 3 roles y da el visto bueno formal — el <b>control SOX</b>.</td></tr>
</tbody></table>
<table class="tbl"><thead><tr><th>Control</th><th>Descripción</th></tr></thead><tbody>
<tr><td><b>Control SOX</b></td><td>Aprobación formal del cambio antes de producción.</td></tr>
<tr><td><b>Control operativo</b></td><td>Cierre y validación del cambio ejecutado (con éxito / sin éxito / con problemas).</td></tr>
</tbody></table>
<div class="callout warn"><div class="callout-title"><i data-lucide="alert-triangle"></i>Reglas de oro para cambios automáticos</div><p>• NUNCA se modifican manualmente en Hilix (excepto Git LFS).<br>• Si no se cerró correctamente: crear ticket a Procesos TI DevEx, NUNCA intervenir manualmente.</p></div>

<h3 class="section-title">Origen y contexto de la Ley SOX</h3>
<table class="tbl"><thead><tr><th>Dato</th><th>Detalle</th></tr></thead><tbody>
<tr><td><b>Año</b></td><td>2002 — aprobada tras escándalos contables (Enron, WorldCom) que afectaron a miles de inversionistas.</td></tr>
<tr><td><b>Autores</b></td><td>Senador <b>Paul Sarbanes</b> y Representante <b>Michael Oxley</b> — de ahí el nombre Sarbanes-Oxley.</td></tr>
<tr><td><b>Aplicación a Bancolombia</b></td><td>El Banco cotiza en la NYSE (Bolsa de Nueva York) como <b>ADR</b> (American Depositary Receipt) y presenta el <b>reporte anual 20F</b>. Por eso debe certificar sus controles SOX cada año ante auditorías internas y externas.</td></tr>
<tr><td><b>Alcance interno</b></td><td>Aplica a todos los cambios de TI — sin excepción — que afecten sistemas en el ambiente de producción.</td></tr>
</tbody></table>

<h3 class="section-title">¿Qué NO es un cambio TI?</h3>
<div class="callout warn"><div class="callout-title"><i data-lucide="alert-triangle"></i>NO se debe crear una CRQ para</div><p>• <b>Autorizaciones de accesos</b> — se gestionan por un proceso diferente (IAM).<br>• <b>Parametrizaciones funcionales</b> — cambios que hace el negocio, no el área de TI.<br>• <b>Pedidos del catálogo Helix</b> — son solicitudes de servicio (Service Request), no cambios de TI.<br>• Actividades que no impactan el ambiente de producción.</p></div>

<h3 class="section-title">Definiciones clave ampliadas</h3>
<table class="tbl"><thead><tr><th>Concepto</th><th>Definición</th></tr></thead><tbody>
<tr><td><b>Cambio Automático</b></td><td>Se genera y ejecuta desde <b>Azure DevOps o Solman</b> mediante Pipelines automáticos con integración nativa a Helix. Aprox. el 52-53% del total de cambios mensuales.</td></tr>
<tr><td><b>Cambio Manual</b></td><td>NO se ejecuta desde herramientas de integración automática. Ejemplo típico: cambios en infraestructura On Premise.</td></tr>
<tr><td><b>Afectación</b></td><td>Interrupción y/o degradación en la disponibilidad de Aplicaciones o Componentes TI. Incluye lentitud e intermitencia — no solo caídas totales.</td></tr>
</tbody></table>

<h3 class="section-title">¿Cuándo ejecutar el proceso?</h3>
<div class="callout rule"><div class="callout-title">El proceso de Gestión de Cambios aplica cuando</div><p>1. Una solución de software cumple el <b>DoD</b> (Definition of Done) y está lista para pasar a producción.<br>2. Se implementa infraestructura nueva o se modifica la existente en el ambiente de producción.<br>3. Existe posibilidad de <b>afectación</b> sobre servicios o componentes de TI en producción.</p></div>

<h3 class="section-title">Ciclo de vida del proceso — 4 etapas</h3>
<table class="tbl"><thead><tr><th>Etapa</th><th>Descripción</th></tr></thead><tbody>
<tr><td><b>1. Registro y Clasificación</b></td><td>Se crea la CRQ en Helix con todos los campos requeridos: tipo, CI, fecha, descripción, plan de rollback, encuesta de riesgos (excepto Estándar).</td></tr>
<tr><td><b>2. Evaluación y Aprobación</b></td><td>El Aprobador revisa y da el visto bueno formal — <b>este es el control SOX</b>. Los cambios programados adicionalmente pasan por el Consejo de Cambios.</td></tr>
<tr><td><b>3. Implementación</b></td><td>Se ejecuta el cambio en producción según el plan definido en la CRQ. Hay registro de cada acción.</td></tr>
<tr><td><b>4. Validación y Cierre</b></td><td>Se confirma si el cambio fue exitoso, fallido o con problemas. Se documenta el resultado y se cierra la CRQ — <b>control operativo</b> (detectivo).</td></tr>
</tbody></table>
<div class="callout data"><div class="callout-title">Transversal a todas las etapas</div><p>Seguimiento, medición y mejora continua aplican en todo el ciclo, no solo al final. El proceso genera entre <b>5,000 y 6,000 cambios mensuales</b>.</p></div>

<h3 class="section-title">Estados de una CRQ en Hilix</h3>
<p class="body-p">Toda CRQ pasa por estos estados en Hilix — conocerlos es clave para el coordinador y para el Consejo:</p>
<table class="tbl"><thead><tr><th>Estado</th><th>Qué significa</th></tr></thead><tbody>
<tr><td><b>Borrador</b></td><td>La CRQ fue creada pero aún no tiene todos los campos completos ni aprobaciones.</td></tr>
<tr><td><b>Programado para aprobación</b></td><td>Está lista para que el aprobador la revise y dé el visto bueno (control SOX).</td></tr>
<tr><td><b>Programado</b></td><td>Aprobada y lista para ejecutar en la fecha y ventana definida.</td></tr>
<tr><td><b>Implementación en curso</b></td><td>El cambio se está ejecutando activamente en producción.</td></tr>
<tr><td><b>Terminado</b></td><td>La ejecución finalizó. Pendiente de cierre formal con resultado documentado.</td></tr>
<tr><td><b>CERRADO</b></td><td>Estado final — control operativo completado. La CRQ queda archivada.</td></tr>
</tbody></table>
<div class="callout key"><div class="callout-title">BullSolver — caso de éxito en integración automática</div><p>BullSolver es el proceso de <b>parchado</b> (patching) que ejemplifica la integración automática exitosa con Hilix: crea la CRQ, ejecuta el parche y cierra el cambio de forma 100% automática, sin intervención humana. Es el estándar que se busca replicar en otros procesos de parchado.</p></div>

<h3 class="section-title">Niveles de aprobación — Cambios Manuales</h3>
<table class="tbl"><thead><tr><th>Tipo de cambio</th><th>Quién aprueba</th></tr></thead><tbody>
<tr><td><b>Estándar</b></td><td>Equipo de Producto (plantilla precertificada, exento de encuesta de riesgos).</td></tr>
<tr><td><b>Ágil</b></td><td>Equipo de Producto.</td></tr>
<tr><td><b>Programado</b></td><td>Equipo de Producto + <b>Consejo de Cambios</b>.</td></tr>
<tr><td><b>Emergencia</b></td><td>Equipo de Producto + <b>GIOTI</b> (aprobación en paralelo con la ejecución).</td></tr>
</tbody></table>

<h3 class="section-title">Niveles de aprobación — Cambios Automáticos SW Negocio</h3>
<table class="tbl"><thead><tr><th>Tipo / Riesgo</th><th>Quién aprueba</th></tr></thead><tbody>
<tr><td><b>Ágil — riesgo bajo</b></td><td>Equipo de Producto.</td></tr>
<tr><td><b>Ágil — riesgo medio</b></td><td>Líder Técnico del EVC o Líder de Línea.</td></tr>
<tr><td><b>Programado</b></td><td>Líder Técnico del EVC + Consejo de Cambios.</td></tr>
<tr><td><b>Emergencia</b></td><td>Equipo de Producto + GIOTI.</td></tr>
</tbody></table>

<h3 class="section-title">Lineamientos de fechas de restricción (Quincena)</h3>
<div class="callout warn"><div class="callout-title"><i data-lucide="alert-triangle"></i>No ejecutar cambios con afectación durante</div><p>• <b>1 día hábil ANTES</b> de la quincena (días de pago: 15 y último día del mes).<br>• <b>El día de la quincena</b>.<br>• <b>1 día hábil DESPUÉS</b> de la quincena.<br>Esta restricción aplica a cambios <b>ágiles y programados</b>. <b>NO aplica</b> para estándar, emergencia ni aliados.<br>Para ejecutar en fecha restringida: requiere aprobación explícita del <b>Director o Líder de Entorno</b>.</p></div>

<h3 class="section-title">Protocolo del Consejo de Cambios</h3>
<div class="callout rule"><div class="callout-title">Para Coordinadores — antes del Consejo</div><p>1. El cambio debe estar creado en Helix con todos los campos requeridos completos.<br>2. Debe contar con la aprobación del líder antes de llevarlo al Consejo.<br>3. Completar el campo <b>"Fecha Consejo"</b> con la sesión correcta (martes o jueves).<br>4. Completar el campo <b>"Gestión Consejo"</b>: <em>Recomendado</em> (sin necesidad de presencia física) o <em>Presencial</em> (debe asistir a la sesión).<br>5. El acta se genera los lunes y miércoles al mediodía — todos los cambios deben estar listos antes de ese corte.</p></div>

<h3 class="section-title">Glosario rápido</h3>
<div class="term-row"><span class="term-word">CRQ</span><span class="term-def">Change Request — solicitud de cambio registrada en Hilix.</span></div>
<div class="term-row"><span class="term-word">Circular 028</span><span class="term-def">Norma Superintendencia Financiera: aviso obligatorio con 8 días ante indisponibilidad ≥30 min.</span></div>
<div class="term-row"><span class="term-word">Afectación</span><span class="term-def">Interrupción, degradación, lentitud o intermitencia de un servicio o componente TI.</span></div>
<div class="term-row"><span class="term-word">GIOTI</span><span class="term-def">Ente que aprueba y valida cambios de emergencia.</span></div>
<div class="term-row"><span class="term-word">Control SOX</span><span class="term-def">Aprobación formal del cambio antes de producción — requisito regulatorio.</span></div>

<h3 class="section-title">Presentación del módulo</h3>
<div class="btn-row" style="margin-bottom:12px"><button class="btn btn-outline btn-sm" onclick="openPdf(this,'pdf-inc','docs/04_Gestion_de_incidentes_TI.pdf')"><i data-lucide="file-text"></i> Ver presentación</button></div>
<iframe id="pdf-inc" src="docs/04_Gestion_de_incidentes_TI.pdf" width="100%" height="560" style="display:none;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px" title="Gestión de Incidentes y Problemas TI"></iframe>
<h3 class="section-title">Incidente vs. Problema — diferencias clave</h3>
<table class="tbl"><thead><tr><th></th><th>Incidente</th><th>Problema</th></tr></thead><tbody>
<tr><td><b>Actúa sobre</b></td><td>El síntoma</td><td>La causa raíz</td></tr>
<tr><td><b>Propósito</b></td><td>Restablecer el servicio lo antes posible</td><td>Reducir la recurrencia</td></tr>
<tr><td><b>Enfoque</b></td><td>Reactivo</td><td>Reactivo y proactivo</td></tr>
<tr><td><b>Prioriza</b></td><td>Continuidad del negocio</td><td>Estabilizar y mejorar continuamente</td></tr>
</tbody></table>

<h3 class="section-title">Registro y clasificación — campos clave</h3>
<table class="tbl"><thead><tr><th>Campo</th><th>Para qué sirve</th></tr></thead><tbody>
<tr><td><b>Impacto y Urgencia</b></td><td>Calculan automáticamente la <b>prioridad</b> del ticket. Se puede ajustar pero siempre con justificación.</td></tr>
<tr><td><b>Tipo de incidencia</b></td><td>Solo "Evento de infraestructura" es un evento; <b>cualquier otra opción = incidente</b>.</td></tr>
<tr><td><b>CI (Elemento de config.)</b></td><td>El servicio o aplicación afectada. Trae automáticamente el campo "Servicio" relacionado.</td></tr>
<tr><td><b>Categoría operacional</b></td><td>Qué actividad se hizo para resolver. Hasta 3 niveles (Tier).</td></tr>
<tr><td><b>Categoría de resolución</b></td><td>Obligatoria solo al resolver el incidente.</td></tr>
</tbody></table>

<h3 class="section-title">ANS (Acuerdos de Nivel de Servicio)</h3>
<table class="tbl"><thead><tr><th>Tipo</th><th>Criticidad</th><th>ANS</th></tr></thead><tbody>
<tr><td rowspan="3"><b>Incidentes infraestructura</b></td><td>Crítico</td><td><b>4 horas</b></td></tr>
<tr><td>Medio</td><td><b>10 horas</b></td></tr>
<tr><td>Bajo</td><td><b>18 horas</b></td></tr>
<tr><td><b>Problemas</b></td><td>Todas las criticidades</td><td><b>40 días corridos</b> (~60 días calendario)</td></tr>
</tbody></table>

<h3 class="section-title">La calidad de la causa raíz</h3>
<div class="callout rule"><div class="callout-title">Los 3 criterios de calidad</div><p><b>Accionable:</b> existe algo concreto que puedo hacer para corregirla.<br><b>Prevenible:</b> actuar sobre ella evita que el incidente vuelva a ocurrir.<br><b>Verificable:</b> puedo comprobar (logs, configuración) que esa causa es real.</p></div>
<table class="tbl"><thead><tr><th>Causa raíz CORRECTA ✔</th><th>Causa raíz INCORRECTA ✘</th></tr></thead><tbody>
<tr><td>Error en script que reinició el servicio fuera de ventana</td><td>Se reinició el servidor</td></tr>
<tr><td>Configuración incorrecta que causó consumo de memoria</td><td>Hubo un error</td></tr>
<tr><td>Certificado expiró por falta de monitoreo</td><td>El servicio se cayó</td></tr>
</tbody></table>
<div class="callout warn"><div class="callout-title"><i data-lucide="alert-triangle"></i>Error muy común</div><p>Nunca borrar la pregunta de causa raíz al cerrar un incidente. Si no se conoce: responder "no se ha identificado la causa raíz" y <b>crear inmediatamente un caso problema</b>.</p></div>

<h3 class="section-title">Garantías, grupos y reglas clave</h3>
<div class="callout key"><div class="callout-title">Ventana de garantía</div><p><b>5 días corridos</b> desde la resolución. La reapertura la gestiona únicamente <b>Mateo</b> (mesa de servicio). Pasado ese plazo, se debe crear un incidente nuevo.</p></div>
<div class="callout rule"><div class="callout-title">Grupos de soporte</div><p>Todo grupo debe tener <b>MÁS de un integrante</b>. Con uno solo, si esa persona no está disponible, el incidente queda huérfano.</p></div>

<h3 class="section-title">Plan de acción real vs. mejora continua</h3>
<table class="tbl"><thead><tr><th>Plan de acción VÁLIDO ✔</th><th>NO es plan de acción ✘</th></tr></thead><tbody>
<tr><td>Implementar automatización en el aprovisionamiento</td><td>Actualizar la documentación del proceso</td></tr>
<tr><td>Configurar conexión segura (SSL/TLS)</td><td>Crear un checklist</td></tr>
<tr><td>Cargar versión actualizada del componente</td><td>Reunirnos para encontrar la causa raíz</td></tr>
</tbody></table>

<h3 class="section-title">Definición formal y propósito del proceso</h3>
<div class="callout key"><div class="callout-title">¿Qué es un incidente?</div><p>"Es una <b>interrupción del servicio</b> que puede llegar a afectar la actividad de las operaciones de la empresa y que debe resolverse con urgencia." El propósito del proceso es garantizar la <b>recuperación del servicio en el menor tiempo posible</b>, minimizando el impacto negativo en el negocio y en los clientes.</p></div>
<div class="callout rule"><div class="callout-title">¿Qué buscamos lograr con la gestión de incidentes?</div><p>• Minimizar el impacto sobre el negocio y el cliente.<br>• Reducir los tiempos de indisponibilidad.<br>• Aumentar la satisfacción del cliente mediante atención oportuna.<br>• Cumplir los SLA definidos (ANS).<br>• Facilitar el seguimiento y cierre formal de cada ticket.</p></div>

<h3 class="section-title">Ciclo de vida completo — 5 etapas</h3>
<table class="tbl"><thead><tr><th>Etapa</th><th>Descripción</th></tr></thead><tbody>
<tr><td><b>1. Registro y Clasificación</b></td><td>Se crea el ticket con todos los campos obligatorios: resumen, descripción, impacto, urgencia, tipo de incidencia, CI, servicio, categorías. La <b>prioridad = impacto + urgencia</b> (se puede ajustar con justificación).</td></tr>
<tr><td><b>2. Análisis</b></td><td>El grupo de soporte investiga. Se documentan TODAS las acciones en la pestaña <b>"Actividad"</b> del ticket — no en comentarios informales.</td></tr>
<tr><td><b>3. Resolución</b></td><td>Se implementa la solución. Se documenta la causa raíz (debe ser Accionable + Prevenible + Verificable). Se completa la categoría de resolución.</td></tr>
<tr><td><b>4. Verificación y Cierre</b></td><td>Notificación automática al cliente. Comienza el periodo de garantía de <b>5 días corridos</b>. El cliente puede solicitar reapertura durante ese periodo (solo vía Mateo — mesa de servicio).</td></tr>
<tr><td><b>5. Medir, informar y mejorar</b></td><td>Revisión mensual de incidentes del periodo para identificar patrones y postular casos a Gestión de Problemas (control BCOT110104C005).</td></tr>
</tbody></table>

<h3 class="section-title">Relaciones obligatorias del ticket</h3>
<div class="callout rule"><div class="callout-title">¿Qué debes relacionar en el incidente?</div><p>• La <b>CRQ</b> (cambio) que pudo haber causado el incidente.<br>• El <b>cambio que lo ocasionó</b> si se identifica, para análisis de causa raíz.<br>• La <b>WO</b> (Work Order) de las tareas de trabajo asociadas al diagnóstico o solución.<br>• Los <b>errores conocidos (PKE)</b> vigentes que pueden ser la causa — evita investigar desde cero.</p></div>

<h3 class="section-title">¿Qué pasa si no gestionamos correctamente los incidentes?</h3>
<table class="tbl"><thead><tr><th>Consecuencia</th><th>Por qué ocurre</th></tr></thead><tbody>
<tr><td>Mayor tiempo de indisponibilidad</td><td>Falta de coordinación, priorización inadecuada o escalamientos tardíos.</td></tr>
<tr><td>Afectación a usuarios y negocio</td><td>Sin asignación oportuna ni grupos con más de un integrante disponible.</td></tr>
<tr><td>Incumplimiento de ANS</td><td>Tickets sin actualizar, sin asignación o mal clasificados.</td></tr>
<tr><td>Impacto financiero y reputacional</td><td>Penalizaciones contractuales y pérdida de confianza del cliente.</td></tr>
</tbody></table>
<div class="callout data"><div class="callout-title">Control BCOT110104C005 — Revisión proactiva mensual</div><p>Mensualmente, el Equipo dueño de Producto <b>revisará los incidentes atendidos en el periodo</b> con el objetivo de identificar proactivamente problemas potenciales — antes de que se conviertan en recurrencia crónica.</p></div>

<h3 class="section-title">Presentación del módulo</h3>
<div class="btn-row" style="margin-bottom:12px"><button class="btn btn-outline btn-sm" onclick="openPdf(this,'pdf-prob','docs/05_Evolucionando_Gestion_Problemas.pdf')"><i data-lucide="file-text"></i> Ver presentación</button></div>

<h3 class="section-title">Las 4 fases de Gartner</h3>
<table class="tbl"><thead><tr><th>Fase</th><th>Objetivo</th></tr></thead><tbody>
<tr><td><b>1. Identificación</b></td><td>Saber dónde buscar problemas y cuáles son elegibles para crear un caso problema.</td></tr>
<tr><td><b>2. Mitigación</b></td><td>Reducir el impacto de incidentes por errores ya conocidos — aquí se enfoca la actualización con PKE.</td></tr>
<tr><td><b>3. Resolución</b></td><td>Comprender el problema y las posibles soluciones para proceder de la mejor manera.</td></tr>
<tr><td><b>4. Optimización</b></td><td>Evaluación continua de la mejora y el impacto de la práctica de gestión de problemas.</td></tr>
</tbody></table>

<h3 class="section-title">Problema, Error Conocido y Workaround</h3>
<table class="tbl"><thead><tr><th>Concepto</th><th>Definición</th></tr></thead><tbody>
<tr><td><b>Problema</b></td><td>Causa o causa potencial de uno o más incidentes.</td></tr>
<tr><td><b>Error conocido (PKE)</b></td><td>Problema ya analizado, con causa raíz documentada + workaround. Aún sin solución definitiva.</td></tr>
<tr><td><b>Workaround</b></td><td>Solución alternativa o temporal que reduce el impacto mientras no existe solución completa.</td></tr>
</tbody></table>
<div class="callout key"><div class="callout-title">¿Se puede cerrar un problema solo con workaround?</div><p>SÍ. Si el workaround es efectivo, puede convertirse en la forma permanente — especialmente cuando la aplicación está próxima a jubilarse o no es rentable implementar una solución definitiva.</p></div>

<h3 class="section-title">El nuevo flujo del PKE</h3>
<div class="callout rule"><div class="callout-title">¿Cómo se crea un PKE?</div><p>1. Tener el caso problema bien documentado (causa raíz y resolución completas).<br>2. Cambiar estado a "Terminado" → motivo: <b>"Error conocido"</b>.<br>3. Hilix genera automáticamente un artículo con ID <b>PKE</b>, heredando toda la documentación del caso problema.</p></div>
<div class="callout warn"><div class="callout-title"><i data-lucide="alert-triangle"></i>PKE ≠ NKW</div><p><b>PKE:</b> nace de un caso problema cerrado — hereda su documentación.<br><b>NKW:</b> plantilla independiente del módulo Knowledge de Hilix.<br>Ambos pueden aparecer en el panel de recursos de un ticket, pero NO son lo mismo.</p></div>

<h3 class="section-title">Gestión reactiva vs. proactiva</h3>
<table class="tbl"><thead><tr><th>Camino</th><th>Cuándo aplica</th></tr></thead><tbody>
<tr><td><b>Reactivo</b></td><td>Se actúa cuando ya se está "corchado" con incidentes repetitivos o de alto impacto.</td></tr>
<tr><td><b>Proactivo</b></td><td>Revisión mensual obligatoria del equipo: detectar patrones ANTES de que se conviertan en recurrencia.</td></tr>
</tbody></table>
<div class="callout data"><div class="callout-title">Módulo Gestión Proactiva en Hilix</div><p>Usa <b>IA</b> para agrupar incidentes en <b>mapas de calor</b>. Muestra patrones, tendencias y permite crear casos problema directamente desde el mapa. Tan bueno como la calidad de la información que se le da.</p></div>

<h3 class="section-title">Lineamientos del proceso</h3>
<table class="tbl"><thead><tr><th>Lineamiento</th><th>Qué exige</th></tr></thead><tbody>
<tr><td>Incidente con más de <b>20 días</b> abierto</td><td>Se debe crear el caso problema automáticamente.</td></tr>
<tr><td>Plan de acción = "encontrar la causa raíz"</td><td>Señal de que no hay causa raíz — el proceso crea el caso problema.</td></tr>
<tr><td>Incidente muy repetitivo (3-4 veces/semana)</td><td>El proceso crea directamente el caso problema si el equipo no lo hizo.</td></tr>
</tbody></table>

<h3 class="section-title">Cifras del proceso</h3>
<table class="tbl"><thead><tr><th>Indicador</th><th>Dato</th></tr></thead><tbody>
<tr><td>Problemas creados en total</td><td>~750</td></tr>
<tr><td>Cumplimiento acumulado</td><td><b>84.9%</b> (meta: 60%)</td></tr>
</tbody></table>

<h3 class="section-title">Fases Gartner — descripción detallada</h3>
<table class="tbl"><thead><tr><th>Fase</th><th>Actividades clave</th></tr></thead><tbody>
<tr><td><b>Trabajo Previo (Base)</b></td><td>Definir términos, roles y responsabilidades del proceso. Establecer relación con otros procesos (incidentes, cambios, CMDB). Definir métricas e indicadores de éxito.</td></tr>
<tr><td><b>Fase 1: Identificación</b></td><td>Saber dónde buscar (mapas de calor, incidentes repetitivos, incidentes &gt;20 días). Identificar y seleccionar cuáles son elegibles como caso problema. Registrar el caso en Helix correctamente.</td></tr>
<tr><td><b>Fase 2: Mitigación</b></td><td>Reducir el impacto de incidentes causados por errores ya conocidos. Aplicar workarounds disponibles. Documentar el PKE para que otros equipos lo consulten y resuelvan más rápido.</td></tr>
<tr><td><b>Fase 3: Resolución</b></td><td>Comprender en profundidad el problema mediante técnicas de análisis de causa raíz. Evaluar posibles soluciones y elegir la mejor opción (implementación definitiva, workaround permanente, o cierre sin acción si no aplica).</td></tr>
<tr><td><b>Fase 4: Optimización</b></td><td>Evaluar y mejorar el impacto de la práctica de gestión de problemas a nivel organizacional. Ajustar métricas, procesos y herramientas basado en los resultados obtenidos.</td></tr>
</tbody></table>

<h3 class="section-title">Estados del PKE en Helix</h3>
<table class="tbl"><thead><tr><th>Estado</th><th>Significado</th></tr></thead><tbody>
<tr><td><b>Asignado</b></td><td>El PKE fue creado automáticamente y está pendiente de revisión por el equipo.</td></tr>
<tr><td><b>Planificado para corrección</b></td><td>Existe una solución planificada en proceso de implementación.</td></tr>
<tr><td><b>Asignado a proveedor</b></td><td>La solución definitiva depende de un tercero o proveedor externo.</td></tr>
<tr><td><b>Ninguna acción planificada</b></td><td>Se decidió no implementar solución (ej. aplicación próxima a jubilarse, no es rentable).</td></tr>
<tr><td><b>Corregido</b></td><td>La causa raíz fue eliminada con una solución definitiva implementada.</td></tr>
<tr><td><b>Cerrado</b></td><td>El PKE fue cerrado formalmente (con o sin solución definitiva).</td></tr>
<tr><td><b>Cancelado</b></td><td>El PKE se canceló por no ser relevante o por error en la creación.</td></tr>
</tbody></table>

<h3 class="section-title">¿Cuándo postular un incidente a caso problema?</h3>
<div class="callout rule"><div class="callout-title">Gestión reactiva — postular a problema cuando</div><p>• Se ha aplicado una <b>solución temporal</b> pero no hay causa raíz identificada.<br>• Hay <b>repetitividad</b> del incidente (3-4 veces/semana o recurrencia sistemática mensual).<br>• El incidente tiene <b>impacto importante</b> en el negocio, clientes o disponibilidad de servicios críticos.<br>• Existe alguna otra <b>razón argumentada</b> válida por el equipo.<br>• El incidente lleva <b>más de 20 días abierto</b> — obligatorio, el proceso lo crea automáticamente.</p></div>

<h3 class="section-title">Principales causas de incidentes — datos reales</h3>
<table class="tbl"><thead><tr><th>Causa identificada</th><th>Nº de casos</th></tr></thead><tbody>
<tr><td><b>Fallas de Proveedor</b></td><td>42 casos</td></tr>
<tr><td><b>Ejecución de CRQ (cambios)</b></td><td>32 casos</td></tr>
<tr><td><b>Nequi</b></td><td>15 casos</td></tr>
</tbody></table>
<div class="callout data"><div class="callout-title">Herramienta: Gestión Proactiva — ITSM Insights</div><p>Workspace en Helix que usa <b>IA para agrupar incidentes en mapas de calor</b>, detectar patrones y tendencias antes de que escalen. Permite crear casos problema directamente desde el mapa. La calidad del análisis depende directamente de la calidad de los datos cargados en los tickets.</p></div>

<h3 class="section-title">ITSM Insights vs. Correlación de Incidentes — dos herramientas distintas</h3>
<table class="tbl"><thead><tr><th></th><th>Gestión Proactiva (ITSM Insights)</th><th>Correlación de Incidentes</th></tr></thead><tbody>
<tr><td><b>Configuración</b></td><td>Requiere configuración previa por el equipo — se definen rangos de fechas y filtros.</td><td>Viene preconfigurada por defecto. Sin configuración inicial.</td></tr>
<tr><td><b>Tiempo</b></td><td>Analiza periodos históricos definidos por el equipo (mes anterior, año, etc.).</td><td>Muestra agrupaciones y tendencias <b>en tiempo real</b>.</td></tr>
<tr><td><b>Para qué sirve</b></td><td>Detectar patrones periódicos para crear casos problema proactivamente.</td><td>Identificar correlaciones de incidentes activos y posibles incidentes graves en curso.</td></tr>
<tr><td><b>Resultado</b></td><td>Mapas de calor exportables, compartibles, con opción de crear caso problema desde el mapa.</td><td>Bloques de incidentes agrupados por similitud de resumen o CI en tiempo real.</td></tr>
</tbody></table>
<div class="callout warn"><div class="callout-title"><i data-lucide="alert-triangle"></i>La calidad del análisis depende de la calidad del registro</div><p>Si los campos del ticket (CI, categoría operacional, resumen) se llenan con cualquier valor, la IA no puede agrupar correctamente. <b>Un ticket mal documentado contamina el mapa de calor de todo el equipo.</b></p></div>

<h3 class="section-title">Hallazgos — qué hacen mal los equipos</h3>
<div class="callout warn"><div class="callout-title"><i data-lucide="alert-triangle"></i>Problemas comunes identificados en el proceso</div><p>• Se documenta <b>qué pasó</b> pero no el <b>por qué real</b> — sin definiciones claras de causa raíz.<br>• La causa raíz describe el síntoma, no la causa subyacente.<br>• La mayoría de los casos problema los <b>crea el proceso automáticamente</b>, no los equipos proactivamente.<br>• El problema de fondo suele estar en la <b>disciplina operativa y la ejecución</b>, no en la tecnología.<br>• Equipos que no realizan la revisión mensual de incidentes (control BCOT110104C005).</p></div>

<h3 class="section-title">Evolución del proceso — niveles de madurez</h3>
<table class="tbl"><thead><tr><th>Nivel de madurez</th><th>Características</th></tr></thead><tbody>
<tr><td><b>Inicial / En desarrollo</b></td><td>El proceso existe pero se ejecuta de forma reactiva y sin criterios claros de elegibilidad.</td></tr>
<tr><td><b>Estandarizado</b></td><td>Hay criterios definidos, pero el cumplimiento es inconsistente entre equipos.</td></tr>
<tr><td><b>Gestionado</b> ← <em>aquí está Bancolombia</em></td><td>Se mide, monitorea y corrige sistemáticamente. 84.9% de cumplimiento (meta: 60%).</td></tr>
<tr><td><b>Optimizado</b></td><td>Mejora continua con IA, métricas predictivas y gestión proactiva consolidada.</td></tr>
</tbody></table>
<h3 class="section-title">Caso de éxito — SAF (Administración de Factoring)</h3>
<p class="body-p">Equipo que estuvo en el <b>top de incidentes durante 2 años consecutivos</b>. Lejos de ignorarlo, documentaron su estrategia y lograron resultados sobresalientes:</p>
<table class="tbl"><thead><tr><th>Acción implementada</th><th>Resultado</th></tr></thead><tbody>
<tr><td>Reforzar la calidad de los pasos a producción del nuevo CORE</td><td>Calidad del 95-97% en implementaciones grandes</td></tr>
<tr><td>Mesas de triaje diarias con diagnóstico en dos niveles</td><td>Menos incidentes "escapados" y mejor cumplimiento de ANS</td></tr>
<tr><td>Creación proactiva de casos problema (sin importar criticidad)</td><td>Identificación de causa raíz y reducción de reincidencias</td></tr>
<tr><td>Ventanas de restricción propias para pasos a producción</td><td>Menor número de incidentes por ejecución de CRQ</td></tr>
<tr><td>Validaciones más rigurosas con responsabilidad directa en aprobaciones</td><td>El aprobador revisa objetivamente, no aprueba por cumplir el rol</td></tr>
</tbody></table>
<div class="callout key"><div class="callout-title">Lección del caso SAF</div><p>No esperaron a que el proceso los obligara — tomaron la iniciativa. La clave: disciplina operativa, documentación correcta y <b>no tener miedo de crear casos problema</b>. Los casos problema no son una sanción, son el instrumento para mejorar.</p></div>

<h3 class="section-title">Consecuencias de no gestionar los problemas</h3>
<table class="tbl"><thead><tr><th>Consecuencia</th><th>Impacto en el negocio</th></tr></thead><tbody>
<tr><td>Reincidencia de fallas</td><td>Los mismos incidentes vuelven a ocurrir — costos operativos crecientes y mesas de servicio saturadas.</td></tr>
<tr><td>Mayor carga para soporte</td><td>Los equipos atienden lo mismo repetidamente sin resolver la raíz del problema.</td></tr>
<tr><td>Riesgo para la disponibilidad</td><td>Sin causa raíz resuelta, cualquier incidente puede derivar en una caída mayor o más prolongada.</td></tr>
<tr><td>Impacto reputacional</td><td>Los clientes perciben inestabilidad y falta de confiabilidad en los servicios del Banco.</td></tr>
</tbody></table>

<h3 class="section-title">Glosario rápido</h3>
<div class="term-row"><span class="term-word">PKE</span><span class="term-def">Artículo de Error Conocido creado desde un caso problema con causa temporal.</span></div>

<h3 class="section-title">¿Qué es y por qué existe el proceso?</h3>
<p class="body-p">Habilitar y Mantener Soluciones define las <b>buenas prácticas para ejecutar el ciclo de vida de desarrollo</b> en la organización. Garantiza un estándar único que protege la calidad y el cumplimiento regulatorio.</p>
<div class="callout rule"><div class="callout-title">¿Por qué es un proceso SOX?</div><p>Hace parte de la certificación de la <b>Ley SOX</b>, requisito para que el Grupo opere y cotice en la Bolsa de Nueva York. Aplica a todos los cambios de software — desde el incidente más pequeño hasta el proyecto más grande.</p></div>
<div class="callout warn"><div class="callout-title"><i data-lucide="alert-triangle"></i>Excepción importante</div><p>El proceso <b>NO aplica a aplicaciones SaaS</b> — no están dentro de la infraestructura del Banco.</p></div>

<h3 class="section-title">Las 5 etapas del proceso</h3>
<table class="tbl"><thead><tr><th>Etapa</th><th>En qué consiste</th></tr></thead><tbody>
<tr><td><b>1. Analizar y arquitectar</b></td><td>Se recibe la necesidad y se define el diseño de arquitectura de alto nivel. Participan: arquitecto, diseñador de ciberseguridad, analista de integración.</td></tr>
<tr><td><b>2. Preparar</b></td><td>Refinamientos con el PO, análisis de seguridad, diseño técnico, plan de pruebas (Test Plan).</td></tr>
<tr><td><b>3. Implementar</b></td><td><b>El corazón del proceso:</b> se codifica, se garantiza la calidad y se ejecutan los primeros controles SOX.</td></tr>
<tr><td><b>4. Desplegar</b></td><td>Preparación e instalación en producción mediante uno de los 3 tipos de despliegue autorizados.</td></tr>
<tr><td><b>5. Estabilizar</b></td><td>Seguimiento post-producción, conectado con incidentes y gestión de vulnerabilidades.</td></tr>
</tbody></table>

<h3 class="section-title">Los 5 pilares DevOps y sus controles</h3>
<table class="tbl"><thead><tr><th>Pilar</th><th>Qué cubre</th></tr></thead><tbody>
<tr><td><b>Continuous Integration</b></td><td>Pipeline que compila, analiza y publica artefactos automáticamente.</td></tr>
<tr><td><b>Continuous Testing</b></td><td>Pruebas unitarias y análisis estático de código dentro del pipeline.</td></tr>
<tr><td><b>Despliegue Continuo</b></td><td>Automatización de despliegues a los diferentes ambientes.</td></tr>
<tr><td><b>Release Management</b></td><td>Cómo se promueven los cambios entre ambientes.</td></tr>
<tr><td><b>Configuration Management</b></td><td>Rastreo de cambios: repositorios, branching, dependencias y versiones.</td></tr>
</tbody></table>
<div class="callout rule"><div class="callout-title">Pull Request — políticas obligatorias</div><p>• Mínimo <b>un aprobador</b> responsable de revisar todo el cambio.<br>• Pipeline de CI ejecutado exitosamente.<br>• Work items permitidos: historia de usuario, habilitador, incidente.<br>• Todos los comentarios del PR deben quedar resueltos antes del merge.</p></div>

<h3 class="section-title">Pirámide de pruebas</h3>
<table class="tbl"><thead><tr><th>Nivel</th><th>Tipo</th><th>Herramientas</th></tr></thead><tbody>
<tr><td><b>Base (mayor cobertura)</b></td><td>Pruebas unitarias</td><td>JUnit (Java), PyTest (Python). Medidas en Sonar.</td></tr>
<tr><td><b>Media</b></td><td>Pruebas de aceptación funcional</td><td>Serenity, RestAssured, Playwright, Robot Framework.</td></tr>
<tr><td><b>Media</b></td><td>Pruebas de performance modulares</td><td>JMeter (herramienta oficial).</td></tr>
<tr><td><b>Cúspide</b></td><td>Pruebas End-to-End (E2E)</td><td>Serenity BDD, JMeter + SiteSpeed, Appium (mobile).</td></tr>
</tbody></table>

<h3 class="section-title">Los 3 tipos de despliegue — Controles SOX</h3>
<table class="tbl"><thead><tr><th>Tipo</th><th>Herramienta</th><th>Descripción</th></tr></thead><tbody>
<tr><td><b>Manual (Git LFS)</b></td><td>Azure DevOps</td><td>Cambios manuales ejecutados por persona con altos privilegios. El instalador descarga el artefacto <b>SOLO</b> desde el correo automático de Azure DevOps.</td></tr>
<tr><td><b>Automático (CI/CD)</b></td><td>Azure DevOps</td><td>Despliegue 100% automático sin intervención humana.</td></tr>
<tr><td><b>SolMan</b></td><td>SolMan — Charm</td><td>Despliegue automatizado para SAP mediante documento Charm asociado a la CRQ.</td></tr>
</tbody></table>
<div class="callout warn"><div class="callout-title"><i data-lucide="alert-triangle"></i>Regla estricta — despliegue manual</div><p>El instalador <b>NUNCA</b> debe recibir instrucciones por correo personal, Teams, OneDrive ni adjunto directo en la CRQ. Solo desde el correo automático de Azure DevOps. Esto mitiga el riesgo de fraude interno y ha causado incumplimientos SOX.</p></div>

<h3 class="section-title">El DoD y la encuesta de riesgos</h3>
<div class="callout key"><div class="callout-title">Definition of Done (DoD)</div><p>Centraliza toda la evidencia en Azure DevOps. Requiere: Test Plan, documentación, encuesta de riesgos, y <b>aprobación PERSONAL del Dueño de Producto</b> — nunca delegada.</p></div>
<table class="tbl"><thead><tr><th>Nivel de riesgo</th><th>Tipo de CRQ</th><th>Quién aprueba</th></tr></thead><tbody>
<tr><td>Bajo</td><td>Ágil</td><td>Líder de línea de conocimiento.</td></tr>
<tr><td>Medio</td><td>Ágil (más análisis)</td><td>Líder técnico de EBC.</td></tr>
<tr><td>Alto</td><td>Programada</td><td>Consejo de Cambios + Líder técnico de EBC.</td></tr>
</tbody></table>
<div class="callout rule"><div class="callout-title">¿Quiénes pueden hacer la aprobación técnica (Criedo C)?</div><p>Solo 3 roles pueden realizar la aprobación técnica del paso a producción, determinados por el nivel de riesgo:<br>• <b>Líder técnico de EBC</b><br>• <b>Líder de línea de conocimiento (LLK)</b><br>• <b>Ingeniero de software autorizado</b><br>Esta aprobación es el control SOX que queda en la trazabilidad del pipeline — los entes regulatorios la verifican.</p></div>

<h3 class="section-title">DevSecOps — Escaneos de seguridad por fase</h3>
<p class="body-p">La seguridad se integra en el pipeline en dos momentos clave, con escaneos distintos según la naturaleza de la fase:</p>
<table class="tbl"><thead><tr><th>Fase del pipeline</th><th>Tipo de escaneo</th><th>Qué revisa</th></tr></thead><tbody>
<tr><td rowspan="3"><b>DevBill — CI<br>(Integración Continua)</b></td><td>SAST código e IaC</td><td>Vulnerabilidades en el código fuente y en la infraestructura como código.</td></tr>
<tr><td>Secret scanning</td><td>Credenciales o secretos expuestos inadvertidamente en el código.</td></tr>
<tr><td>Dependency scanning</td><td>Vulnerabilidades en las dependencias y librerías externas del proyecto.</td></tr>
<tr><td rowspan="3"><b>Release</b></td><td>DAST</td><td>Análisis dinámico — evalúa la aplicación en ejecución, no el código estático.</td></tr>
<tr><td>Container scanning</td><td>Vulnerabilidades en las imágenes Docker utilizadas.</td></tr>
<tr><td>Kubernetes manifests</td><td>Configuraciones inseguras en los manifests de despliegue.</td></tr>
</tbody></table>
<div class="callout data"><div class="callout-title">Mutation Testing — solo para Java</div><p>Técnica que <b>modifica el código fuente deliberadamente</b> para verificar que las pruebas unitarias lo detecten. Si la prueba no "mata" la mutación, la cobertura es insuficiente. Solo aplica para proyectos en <b>Java</b>, usando la librería <b>PIT</b>.</p></div>

<h3 class="section-title">BoolTracker — Gestión centralizada de vulnerabilidades</h3>
<p class="body-p">BoolTracker es la <b>plataforma central de gestión de vulnerabilidades (DevSecOps)</b> donde se consolidan todos los hallazgos de los escaneos del pipeline.</p>
<table class="tbl"><thead><tr><th>Elemento</th><th>Detalle</th></tr></thead><tbody>
<tr><td><b>Propósito</b></td><td>Centralizar, priorizar y hacer seguimiento a todas las vulnerabilidades de seguridad encontradas.</td></tr>
<tr><td><b>Modelo de priorización</b></td><td>Clasifica vulnerabilidades por criticidad para determinar urgencia de remediación.</td></tr>
<tr><td><b>Modelo de apetito/tolerancia</b></td><td>Define cuánto riesgo es aceptable y por cuánto tiempo según la criticidad.</td></tr>
<tr><td><b>Vulnerabilidad crítica</b></td><td>Máximo <b>45 días</b> para remediar — requiere aprobación de EBC, CD y líder funcional para aceptar el riesgo en ese plazo.</td></tr>
<tr><td><b>Aceptación de riesgo</b></td><td>Proceso formal cuando no se puede remediar en el plazo. Requiere aprobadores según criticidad.</td></tr>
</tbody></table>

<h3 class="section-title">Supervisión regulatoria — quién vigila el proceso</h3>
<p class="body-p">El proceso HyMS tiene ojos de todos los entes regulatorios — internos y externos:</p>
<table class="tbl"><thead><tr><th>Ente</th><th>Tipo</th><th>Ciclos/año</th><th>Qué revisa</th></tr></thead><tbody>
<tr><td><b>Auditoría Interna</b></td><td>Interno</td><td>2</td><td>Muestras de cambios de todos los tamaños. Verifica CRQ, DoD, Test Plan, aprobaciones y backlog del equipo.</td></tr>
<tr><td><b>PricewaterhouseCoopers (PWC)</b></td><td>Externo (revisoría fiscal)</td><td>2</td><td>Revisa diseño del control + operatividad real. Puede presentarse <b>sin previo aviso</b> y va directamente a las plataformas.</td></tr>
<tr><td><b>Superintendencia Financiera</b></td><td>Regulador</td><td>Variable</td><td>Visitas y requerimientos institucionales sobre controles SOX y cumplimiento normativo.</td></tr>
</tbody></table>
<div class="callout warn"><div class="callout-title"><i data-lucide="alert-triangle"></i>Cada ingeniero es protagonista de este proceso</div><p>Si PWC llega y revisa un cambio de cualquier tamaño — hasta el más pequeño — verifica que tenga CRQ, DoD, aprobación técnica, Test Plan y esté en el repositorio de código autorizado. <b>No existe el cambio "tan chiquito que no importa".</b></p></div>

<h3 class="section-title">Glosario rápido</h3>
