<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16233F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VSTI">
<title>Estudio · Certificación Procesos Críticos VSTI</title>
<style>
:root{
  --bg:#F4F4F1; --paper:#FFFFFF; --ink:#1B1F23; --soft:#5B5F63;
  --line:#E3E2DD; --navy:#16233F; --brass:#A9843F; --brass-bg:#E9DCC0;
  --good:#2F6F4E; --good-bg:#E7F1EA; --bad:#A83232; --bad-bg:#F6E7E5;
  --radius:6px; --shadow:0 1px 4px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;outline:none}

/* Layout */
#app{min-height:calc(100vh - 60px);padding:20px 16px 80px;max-width:720px;margin:0 auto}
#nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--paper);border-top:1px solid var(--line);display:flex;z-index:100}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--soft);background:none;transition:color .15s}
.nav-btn.active{color:var(--navy)}
.nav-btn svg{width:22px;height:22px;display:block;margin:0 auto 2px}

/* Cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-sm{padding:16px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:var(--radius);font-size:15px;font-weight:600;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn-primary{background:var(--navy);color:#fff}
.btn-brass{background:var(--brass);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-sm{padding:8px 16px;font-size:13.5px}
.btn-full{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* Module pill */
.mod-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;color:#fff;font-weight:600}

/* Callouts */
.callout{border-left:3px solid;padding:12px 16px;border-radius:0 4px 4px 0;margin:12px 0}
.callout.key{border-color:var(--brass);background:#fdf8ef}
.callout.warn{border-color:var(--bad);background:var(--bad-bg)}
.callout.rule{border-color:var(--navy);background:#eef1f7}
.callout.data{border-color:var(--good);background:var(--good-bg)}
.callout-title{font-weight:700;font-size:13px;margin-bottom:4px}
.callout.key .callout-title{color:var(--brass)}
.callout.warn .callout-title{color:var(--bad)}
.callout.rule .callout-title{color:var(--navy)}
.callout.data .callout-title{color:var(--good)}
.callout p{font-size:14.5px;line-height:1.6;color:var(--ink)}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin:12px 0;overflow:auto;display:block}
.tbl th{background:var(--navy);color:#fff;padding:8px 12px;text-align:left;font-weight:600;font-size:13px}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:nth-child(even) td{background:#fafaf8}

/* Section headers */
.section-title{font-size:20px;font-weight:700;color:var(--navy);margin:20px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.lesson-title{font-size:17px;font-weight:700;color:var(--navy);margin:16px 0 8px}
.body-p{font-size:15px;line-height:1.65;color:var(--ink);margin-bottom:10px}
.term-row{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}
.term-word{font-weight:700;min-width:120px;font-size:14px;color:var(--navy)}
.term-def{font-size:14px;line-height:1.5;color:var(--soft)}

/* Module cards grid */
.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.mod-grid{grid-template-columns:1fr}}
.mod-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:transform .15s, box-shadow .15s;box-shadow:var(--shadow);border-top:3px solid}
.mod-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.mod-icon{font-size:24px;margin-bottom:8px}
.mod-name{font-size:14px;font-weight:700;color:var(--navy);line-height:1.3}
.mod-meta{font-size:12px;color:var(--soft);margin-top:6px}
.prog-bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .4s}

/* Flashcard styles */
.fc-shell{display:flex;flex-direction:column;min-height:60vh}
.fc-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:32px;text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:220px;cursor:pointer;box-shadow:var(--shadow);transition:box-shadow .15s}
.fc-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12)}
.fc-front{font-size:18px;line-height:1.5;color:var(--navy);font-weight:600}
.fc-back{font-size:16px;line-height:1.6;color:var(--ink);margin-top:0}
.fc-hint{font-size:12px;color:var(--soft);margin-top:16px}
.fc-divider{width:40px;height:2px;background:var(--line);margin:16px auto}
.rating-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}
.rating-btn{padding:14px 8px;border-radius:var(--radius);font-size:13.5px;font-weight:600;border:1.5px solid;transition:all .15s}
.rating-again{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.rating-hard{border-color:var(--brass);color:var(--brass);background:#fdf8ef}
.rating-easy{border-color:var(--good);color:var(--good);background:var(--good-bg)}
.rating-btn:hover{filter:brightness(.92)}
.fc-counter{text-align:center;font-size:13px;color:var(--soft);margin-bottom:12px}

/* Quiz styles (from existing simulacro) */
.qtext{font-size:19px;line-height:1.45;color:var(--navy);margin:0 0 20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);border-radius:5px;padding:13px 15px;cursor:pointer;background:var(--paper);transition:border-color .12s}
.opt:hover:not(.locked){border-color:var(--navy)}
.opt .mark{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--soft)}
.opt .otext{font-size:15px;line-height:1.45;padding-top:2px}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.correct .mark{border-color:var(--good);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .mark{border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.5}
.opt.locked{cursor:default}
.explain-box{display:none;margin-top:16px;padding:14px 18px;border-left:3px solid var(--line);background:#fafaf8;font-size:14px;line-height:1.6}
.explain-box.show{display:block}
.explain-box.ok{border-left-color:var(--good)}
.explain-box.bad{border-left-color:var(--bad)}
.verdict{font-weight:700;display:block;margin-bottom:3px}
.explain-box.ok .verdict{color:var(--good)}
.explain-box.bad .verdict{color:var(--bad)}

/* Progress bar quiz */
.prog-track{height:3px;background:var(--line);border-radius:2px;margin-bottom:20px;overflow:hidden}
.prog-fill-quiz{height:100%;background:var(--brass);transition:width .3s}

/* Radar */
.radar-wrap{display:flex;justify-content:center;margin:16px 0}

/* Home stats */
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat-box{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-size:26px;font-weight:700;color:var(--navy)}
.stat-label{font-size:11px;color:var(--soft);margin-top:2px;line-height:1.3}

/* Setup */
.form-group{margin-bottom:20px}
.form-label{font-size:13px;color:var(--soft);margin-bottom:8px;display:block}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:var(--radius);font-size:15px;font-family:inherit;background:var(--paper);color:var(--ink)}
.form-input:focus{outline:none;border-color:var(--brass)}

/* Utility */
.hidden{display:none!important}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1.5px solid var(--line);background:var(--paper);padding:8px 16px;border-radius:20px;font-size:13.5px;cursor:pointer;color:var(--ink);transition:all .15s}
.chip:hover{border-color:var(--brass)}
.chip.active{border-color:var(--brass);background:var(--brass-bg);font-weight:600}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.topbar h2{font-size:20px;font-weight:700;color:var(--navy)}
.back-btn{background:none;font-size:14px;color:var(--soft);display:flex;align-items:center;gap:4px;padding:6px 0}
.back-btn:hover{color:var(--navy)}
.badge{display:inline-block;background:var(--brass);color:#fff;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700}
.badge.new{background:var(--good)}
.badge.due{background:var(--bad)}
.empty-state{text-align:center;padding:40px 20px;color:var(--soft)}
.empty-state svg{opacity:.3;margin-bottom:12px}

/* Match exercises */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.match-item{padding:11px 10px;border:2px solid var(--line);border-radius:var(--radius);font-size:13.5px;line-height:1.4;cursor:pointer;background:var(--paper);text-align:center;transition:all .15s;-webkit-tap-highlight-color:transparent}
.match-item:hover{border-color:#aaa}
.match-item.selected{border-color:var(--brass);background:var(--brass-bg);font-weight:600}
.match-item.correct{border-color:var(--good);background:var(--good-bg);color:var(--good);font-weight:600;cursor:default}
.match-item.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.match-item.used{opacity:.35;cursor:default;pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.match-score{text-align:center;font-size:14px;color:var(--soft);margin:8px 0}
.match-score b{color:var(--navy);font-size:18px}
.ex-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ex-dots{display:flex;gap:6px}
.ex-dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.ex-dot.done{background:var(--good)}
.ex-dot.cur{background:var(--brass)}

/* Video embed */
.video-wrap{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--radius);background:#000;margin:12px 0}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;border-radius:var(--radius)}
.video-note{font-size:12px;color:var(--soft);text-align:center;margin-top:6px;line-height:1.5}

/* PWA install banner */
.pwa-banner{background:var(--navy);color:#fff;padding:12px 16px;border-radius:var(--radius);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.pwa-banner p{font-size:13px;line-height:1.4;flex:1}
.pwa-banner button{flex:0 0 auto;background:#fff;color:var(--navy);border:none;border-radius:4px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer}

/* Lucide icons */
[data-lucide]{display:inline-block;width:1em;height:1em;vertical-align:-0.15em;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-btn [data-lucide]{width:22px;height:22px;display:block;margin:0 auto 2px;vertical-align:unset}
.mod-icon [data-lucide]{width:28px;height:28px;vertical-align:middle}
.mod-pill [data-lucide]{width:13px;height:13px;vertical-align:-2px}
.rating-btn [data-lucide]{width:15px;height:15px;vertical-align:-2px}
.verdict [data-lucide]{width:14px;height:14px;vertical-align:-2px}
.back-btn [data-lucide]{width:14px;height:14px;vertical-align:-1px;margin-right:2px}
.btn [data-lucide]{width:15px;height:15px;vertical-align:-2px}
.callout-title [data-lucide]{margin-right:5px;vertical-align:-3px;width:15px;height:15px}

/* Exam history */
.exam-item{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s}
.exam-item:hover{border-color:var(--navy)}
.exam-score{font-size:22px;font-weight:700;color:var(--navy);flex-shrink:0}
.exam-score.pass{color:var(--good)}
.exam-score.fail{color:var(--bad)}
.exam-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.exam-badge.pass{background:var(--good-bg);color:var(--good)}
.exam-badge.fail{background:var(--bad-bg);color:var(--bad)}
/* Question review */
.qr-item{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.qr-item.ok{border-left:4px solid var(--good)}
.qr-item.bad{border-left:4px solid var(--bad)}
.qr-opt{padding:6px 10px;border-radius:6px;font-size:13px;margin-top:4px;display:flex;align-items:center;gap:8px}
.qr-opt.correct{background:var(--good-bg);color:var(--good);font-weight:600}
.qr-opt.wrong{background:var(--bad-bg);color:var(--bad)}
.qr-opt.neutral{color:var(--soft)}
.qr-explain{font-size:12px;color:var(--soft);margin-top:8px;padding-top:8px;border-top:1px solid var(--line);line-height:1.5}
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

<div id="app"></div>

<nav id="nav">
  <button class="nav-btn" id="nb-home" onclick="go('home')">
    <i data-lucide="home"></i>
    Inicio
  </button>
  <button class="nav-btn" id="nb-modules" onclick="go('modules')">
    <i data-lucide="layout-grid"></i>
    Módulos
  </button>
  <button class="nav-btn" id="nb-cards" onclick="go('cards','all')">
    <i data-lucide="layers"></i>
    Flashcards
  </button>
  <button class="nav-btn" id="nb-quiz" onclick="go('quiz','all')">
    <i data-lucide="clipboard-check"></i>
    Examen
  </button>
  <button class="nav-btn" id="nb-history" onclick="go('history')">
    <i data-lucide="history"></i>
    Historial
  </button>
</nav>

<script>
function icon(name) { return `<i data-lucide="${name}"></i>`; }
function initIcons() { if (typeof lucide !== 'undefined') lucide.createIcons(); }

function openPdf(btn, id, src) {
  if (window.innerWidth < 768 || ('ontouchstart' in window && window.innerWidth < 1024)) {
    window.open(src, '_blank');
    return;
  }
  var f = document.getElementById(id);
  var open = f.style.display === 'block';
  f.style.display = open ? 'none' : 'block';
  btn.innerHTML = open ? `${icon('file-text')} Ver presentación` : `${icon('x')} Cerrar presentación`;
  initIcons();
}

/* ============================================================
   DATOS — Módulos
   ============================================================ */
const M = {
  mo:  {name:'Modelo Operativo',              short:'Mod. Operativo',    color:'#A9843F', icon:'🏛️', li:'landmark'},
  cfg: {name:'Gestión de la Configuración',   short:'Configuración',     color:'#3E7487', icon:'⚙️', li:'settings'},
  cam: {name:'Gestión de Cambios',            short:'Cambios',           color:'#A0552B', icon:'🔄', li:'refresh-cw'},
  inc: {name:'Gestión de Incidentes',         short:'Incidentes',        color:'#A6322C', icon:'🚨', li:'alert-circle'},
  prob:{name:'Gestión de Problemas',          short:'Problemas',         color:'#4F6E45', icon:'🧩', li:'puzzle'},
  hym: {name:'Habilitar y Mantener Sol.',     short:'Hab. y Mantener',   color:'#3A4A73', icon:'🛠️', li:'wrench'},
};
const MOD_KEYS = Object.keys(M);

/* ============================================================
   DATOS — Flashcards (72 tarjetas: 12 × 6 módulos)
   ============================================================ */
const FC = [
// ── MÓDULO 1: Modelo Operativo (18 tarjetas) ────────────────
{id:'mo-1',  mod:'mo', f:'¿Cuál es la definición oficial de modelo operativo según Bancolombia?', b:'"La manera en que coordinamos áreas, procesos y funciones para entregar valor a nuestros clientes y a la organización."'},
{id:'mo-2',  mod:'mo', f:'¿Cuáles son los 4 pilares del modelo operativo?', b:'Personas · Procesos · Servicios · Tecnología'},
{id:'mo-3',  mod:'mo', f:'¿Qué representa el ciclo PHVA en el modelo operativo?', b:'Planear, Hacer, Verificar, Actuar. El modelo NO es fijo: debe evolucionar y adaptarse constantemente.'},
{id:'mo-4',  mod:'mo', f:'¿Cuál es el modelo operativo actual de Bancolombia y hacia cuál transiciona?', b:'Hoy: Federal–State–Local. Aspiración: Hub and Spoke (centrado en plataformas).'},
{id:'mo-5',  mod:'mo', f:'¿Qué hace el nivel Federal?', b:'Provee lineamientos, prácticas, capacidades y procesos. Son los Centros de Excelencia (gobierno normativo).'},
{id:'mo-6',  mod:'mo', f:'¿Qué hace el nivel State?', b:'Habilita productos, estandariza la operación y entrega capacidades listas para que el Local consuma.'},
{id:'mo-7',  mod:'mo', f:'¿Qué hace el nivel Local?', b:'Ejecuta y consume servicios con alta autonomía, generando el máximo valor de cara al cliente.'},
{id:'mo-8',  mod:'mo', f:'¿El modelo centralizado da alta o baja alineación con el negocio?', b:'BAJA alineación con el negocio (a cambio de ALTO control).'},
{id:'mo-9',  mod:'mo', f:'¿El modelo distribuido da alta o baja capacidad de control?', b:'BAJA capacidad de control (genera caos, aunque logra alta alineación con el producto).'},
{id:'mo-10', mod:'mo', f:'¿Qué modelo operativo pone el producto o plataforma en el centro?', b:'Hub and Spoke — muy centralizado en plataformas; entrega capacidades para que otros equipos construyan sobre ellas.'},
{id:'mo-11', mod:'mo', f:'¿Son lo mismo el modelo operativo y la estructura organizacional?', b:'NO. La estructura tiene mucho que ver con el modelo, pero no son lo mismo.'},
{id:'mo-12', mod:'mo', f:'¿Cuántas personas deben certificarse en los procesos críticos?', b:'Aproximadamente 2,534 personas entre las dos vicepresidencias de tecnología.'},
{id:'mo-13', mod:'mo', f:'¿Qué son los CDEs en la estructura del modelo operativo?', b:'Equipos transversales de soporte cruzado: CDE Infraestructura & Operación · CDE DevExp · CDE Arquitectura Empresarial. Dan soporte a todos los niveles y entornos.'},
{id:'mo-14', mod:'mo', f:'¿Qué aporta COBIT 5 al MOTI de Bancolombia?', b:'Gobierno corporativo de TI: define quién decide, cómo se controla y cómo se rinden cuentas sobre los procesos de TI.'},
{id:'mo-15', mod:'mo', f:'¿Qué aporta ITIL 4 al MOTI de Bancolombia?', b:'Gestión de servicios de TI: mejores prácticas para diseñar, entregar y mejorar continuamente los servicios tecnológicos.'},
{id:'mo-16', mod:'mo', f:'¿Qué significa EVC en el contexto del modelo operativo?', b:'Equipo de Valor para el Cliente — células del nivel Local con soporte E2E a sus productos y clientes.'},
{id:'mo-17', mod:'mo', f:'¿Qué ofrece el State a los equipos Local?', b:'Capacidades listas para consumir: estandarización, automatización, habilitación de productos y garantía del cumplimiento de lineamientos.'},
{id:'mo-18', mod:'mo', f:'¿Cuál es la regla de oro del cumplimiento del proceso?', b:'"Cumplir el proceso es lo que asegura que el valor no sea un evento de una sola vez, sino una constante." El MO promueve evolución ordenada bajo el ciclo PHVA.'},

// ── MÓDULO 2: Gestión de la Configuración ───────────────────
{id:'cfg-1',  mod:'cfg', f:'¿Qué es un Elemento de Configuración (CI)?', b:'Cualquier componente que requiera ser gestionado para habilitar un servicio de TI (servidores, aplicaciones, bases de datos, etc.).'},
{id:'cfg-2',  mod:'cfg', f:'¿Qué es la CMDB?', b:'Configuration Management Data Base — repositorio central y autoritativo de todos los CIs, sus atributos y las relaciones entre ellos.'},
{id:'cfg-3',  mod:'cfg', f:'¿Cuál es el atributo obligatorio que debe tener todo CI en la CMDB?', b:'El App Code (código de la aplicación) — identifica el responsable de cada componente.'},
{id:'cfg-4',  mod:'cfg', f:'¿Cuántos elementos de configuración tiene la CMDB actualmente?', b:'Aproximadamente 250,000 de diferentes tipologías.'},
{id:'cfg-5',  mod:'cfg', f:'¿Cuál es la jerarquía de la CMDB, de arriba hacia abajo?', b:'Servicio → Aplicaciones → Transacciones → Componentes técnicos'},
{id:'cfg-6',  mod:'cfg', f:'¿Cuál es la herramienta ITCM oficial del Banco?', b:'BMC Helix, conocida internamente como "Hilix".'},
{id:'cfg-7',  mod:'cfg', f:'¿Puede ciberseguridad escanear un componente que no está en la CMDB?', b:'NO. La CMDB es el insumo oficial y autoritativo para el escaneo — si no está registrado, no se escanea.'},
{id:'cfg-8',  mod:'cfg', f:'¿Con qué frecuencia se valida la CMDB en ambientes on-premise?', b:'Trimestralmente, con los dueños de las aplicaciones y los dueños de clase.'},
{id:'cfg-9',  mod:'cfg', f:'¿Cómo se garantiza la actualización de la CMDB en nube?', b:'Mediante el tag obligatorio de App Code en todos los despliegues — se carga automáticamente 3 veces al día.'},
{id:'cfg-10', mod:'cfg', f:'¿Quién puede actualizar la información de un CI en Hilix?', b:'Solo los dueños de ese tipo de componente (segregación de funciones).'},
{id:'cfg-11', mod:'cfg', f:'¿La CMDB es una herramienta de monitoreo?', b:'NO. Es para inventario y relacionamiento. El monitoreo lo hacen otras herramientas.'},
{id:'cfg-12', mod:'cfg', f:'¿Qué consecuencia puede tener crear un CRQ con el CI incorrecto?', b:'No se identifica correctamente el impacto del cambio, lo que puede derivar en un incidente en producción.'},
{id:'cfg-13', mod:'cfg', f:'¿Qué evalúan los reportes de Power BI del proceso de configuración?', b:'Completitud y exactitud de los CIs: permiten identificar qué tan bien documentados y actualizados están los elementos en la CMDB.'},
{id:'cfg-14', mod:'cfg', f:'¿Quién tiene acceso a la API de la CMDB?', b:'Solo los dueños de clase — garantiza segregación de funciones. Permite integraciones con otros sistemas del Banco.'},
{id:'cfg-15', mod:'cfg', f:'¿Qué es un "dueño de clase" en la CMDB?', b:'El responsable de una tipología completa de componentes en la CMDB (ej. todos los servidores x86). Es quien certifica y actualiza esa clase.'},
{id:'cfg-16', mod:'cfg', f:'¿Cuál es la relación de la CMDB con el proceso de ciberseguridad?', b:'Ciberseguridad NO escanea ningún componente que no esté registrado en la CMDB. Sin CI, no hay escaneo de vulnerabilidades.'},
{id:'cfg-17', mod:'cfg', f:'¿Cuántas ofertas tiene el catálogo de Helix de la CMDB?', b:'2 ofertas: aplicaciones de negocio y aplicaciones de soporte.'},
{id:'cfg-18', mod:'cfg', f:'¿Cuáles son las 4 políticas clave del proceso de Gestión de la Configuración?', b:'1. Responsabilidad compartida e integridad. 2. CMDB como fuente oficial. 3. Certificación periódica. 4. Todo ticket debe tener CI activo relacionado.'},

// ── MÓDULO 3: Gestión de Cambios ────────────────────────────
{id:'cam-1',  mod:'cam', f:'¿Cuáles son los 4 tipos de cambio TI?', b:'Ágil · Estándar · Programado · Emergencia (aplica tanto a cambios manuales como automáticos)'},
{id:'cam-2',  mod:'cam', f:'¿Qué tipo de cambio NO requiere encuesta de riesgos?', b:'El cambio ESTÁNDAR — ya está certificado como libre de indisponibilidad por la plataforma.'},
{id:'cam-3',  mod:'cam', f:'¿Qué tipo de cambio se puede ejecutar y legalizar (registrar) después?', b:'El cambio de EMERGENCIA (y los cambios de aliados notificados tardíamente).'},
{id:'cam-4',  mod:'cam', f:'¿Qué exige la Circular 028?', b:'Avisar a los clientes con mínimo 8 días calendario de anticipación ante cualquier indisponibilidad ≥30 min en servicios de cara al cliente.'},
{id:'cam-5',  mod:'cam', f:'¿Con cuántos días de anticipación hay que presentar al Consejo un cambio con Circular 028?', b:'15 días de anticipación.'},
{id:'cam-6',  mod:'cam', f:'¿Qué días y a qué hora sesiona el Consejo de Cambios?', b:'Martes y jueves a las 9:00 a.m.'},
{id:'cam-7',  mod:'cam', f:'¿Cuáles son el control SOX y el control operativo en Gestión de Cambios?', b:'Control SOX = aprobación formal del cambio (antes de producción). Control operativo = cierre y validación del cambio ejecutado.'},
{id:'cam-8',  mod:'cam', f:'¿Quién da la aprobación formal (control SOX) en Hilix?', b:'El Aprobador — el único rol que tiene los tres permisos: coordinador, gestor y aprobador.'},
{id:'cam-9',  mod:'cam', f:'¿Se puede modificar manualmente un cambio automático en Hilix?', b:'NUNCA, excepto los cambios Git LFS. El resto se maneja 100% a través de la integración automática con Azure DevOps/SolMan.'},
{id:'cam-10', mod:'cam', f:'¿Qué hacer si un cambio automático no se cierra correctamente en Hilix?', b:'Crear un ticket de soporte al equipo de Procesos TI DevEx — NUNCA modificarlo manualmente.'},
{id:'cam-11', mod:'cam', f:'En una fecha de restricción, ¿quién debe aprobar para ejecutar un cambio ágil?', b:'El Director o Líder de Entorno (el cargo más alto del equipo).'},
{id:'cam-12', mod:'cam', f:'¿Qué incumplimiento representa crear un cambio manual paralelo a un cambio automático de bajo riesgo?', b:'Es un incumplimiento del proceso. Si el riesgo ya es bajo/ágil automático, el nivel de aprobación definido ya es el correcto — el Consejo no reemplaza esa responsabilidad.'},
{id:'cam-13', mod:'cam', f:'¿Cuántos cambios mensuales genera el proceso de Gestión de Cambios?', b:'Entre 5,000 y 6,000 cambios mensuales. Aproximadamente el 52-53% son cambios automáticos.'},
{id:'cam-14', mod:'cam', f:'¿Qué evalúa la encuesta de riesgos para clasificar un cambio automático?', b:'4 factores: aplicación VIA/SOX, canal (impacto en clientes), transaccionalidad y malla (dependencias). Determina si el cambio es ágil o programado.'},
{id:'cam-15', mod:'cam', f:'¿Qué es una "afectación" en Gestión de Cambios?', b:'Interrupción y/o degradación (lentitud, intermitencia) en la disponibilidad de Aplicaciones o Componentes TI. No es solo caída total.'},
{id:'cam-16', mod:'cam', f:'¿Cuándo debe estar listo un cambio para incluirse en el Acta del Consejo?', b:'Antes del mediodía del lunes (para el Consejo del martes) o del miércoles (para el Consejo del jueves). Debe estar creado Y aprobado por el líder.'},
{id:'cam-17', mod:'cam', f:'¿Cuál es el propósito del plan de devolución (rollback)?', b:'Definir cómo y en cuánto tiempo se puede revertir el cambio si algo sale mal durante la implementación. Obligatorio para cambios programados.'},
{id:'cam-18', mod:'cam', f:'¿Qué actividades NO son cambios TI?', b:'• Autorizaciones de accesos (IAM). • Parametrizaciones funcionales del negocio. • Pedidos del catálogo Helix (son solicitudes de servicio). • Actividades que no impactan producción.'},

// ── MÓDULO 4: Gestión de Incidentes ─────────────────────────
{id:'inc-1',  mod:'inc', f:'¿Cuál es la diferencia principal entre incidente y problema?', b:'Incidente: actúa sobre el síntoma, urgente, reactivo → restablecer el servicio. Problema: actúa sobre la causa raíz, reduce recurrencia.'},
{id:'inc-2',  mod:'inc', f:'¿Qué campos calculan automáticamente la prioridad de un ticket?', b:'El Impacto y la Urgencia.'},
{id:'inc-3',  mod:'inc', f:'¿Cuál es el ANS para un incidente crítico de infraestructura?', b:'4 horas.'},
{id:'inc-4',  mod:'inc', f:'¿Cuál es el ANS para un incidente medio de infraestructura?', b:'10 horas.'},
{id:'inc-5',  mod:'inc', f:'¿Cuál es el ANS para los casos problema (cualquier criticidad)?', b:'40 días corridos (aproximadamente 60 días calendario).'},
{id:'inc-6',  mod:'inc', f:'¿Cuáles son los 3 criterios de calidad de una causa raíz?', b:'Accionable (se puede corregir) · Prevenible (evita que se repita) · Verificable (se puede comprobar)'},
{id:'inc-7',  mod:'inc', f:'¿Cuál es la ventana de garantía para reabrir un ticket y quién la gestiona?', b:'5 días corridos desde la resolución, gestionada únicamente a través de Mateo (mesa de servicio).'},
{id:'inc-8',  mod:'inc', f:'¿Qué campo diferencia un incidente de un evento de infraestructura?', b:'El campo "Tipo de incidencia" — solo la opción "Evento de infraestructura" es un evento; cualquier otra opción es un incidente.'},
{id:'inc-9',  mod:'inc', f:'¿Por qué todo grupo de soporte debe tener más de un integrante?', b:'Para evitar que los incidentes queden huérfanos cuando el único integrante está de vacaciones o incapacitado.'},
{id:'inc-10', mod:'inc', f:'¿Qué es el HADA?', b:'Análisis de la Afectación de un incidente: qué pasó, por qué, RQs involucrados, planes de acción y línea de tiempo.'},
{id:'inc-11', mod:'inc', f:'¿Un plan de acción real es igual a mejora continua? ¿Cuál es la diferencia?', b:'NO. Plan de acción real: implementación técnica que ELIMINA la causa raíz. Mejora continua: documentación, checklists, reuniones (válido pero no evita la recurrencia directamente).'},
{id:'inc-12', mod:'inc', f:'Si "reinicié el servidor" ¿es una causa raíz de calidad?', b:'NO. Es solo el síntoma. Una causa raíz responde POR QUÉ pasó: ej. "Error en script automatizado que reinició el servicio fuera de ventana".'},
{id:'inc-13', mod:'inc', f:'¿Cuál es el ANS para un incidente crítico de la dirección Transformación y Soporte?', b:'8 horas en horario hábil (no 24/7). A diferencia de infraestructura: crítico 4h 24/7; Transformación: crítico 8h hábiles, medio 3 días, bajo 5 días.'},
{id:'inc-14', mod:'inc', f:'¿Cuándo se envía la notificación de escalamiento por ANS?', b:'Al 50% del ANS: notifica a los miembros del grupo. Al 75% del ANS: escala a los gerentes/directivos. Ambas son automáticas desde Hilix.'},
{id:'inc-15', mod:'inc', f:'¿Cuáles son los dos buzones clave del proceso de incidentes?', b:'• BancolombiaTSM: notificaciones automáticas de tickets al equipo. • procesosti1: comunicaciones del equipo de proceso para gestión.'},
{id:'inc-16', mod:'inc', f:'¿Cuál es la meta de cumplimiento de ANS para incidentes?', b:'90.5% (comparado con 60% para problemas y 80% para eventos — la más alta de las tres).'},
{id:'inc-17', mod:'inc', f:'¿En qué pestaña de Hilix se registran todas las acciones del análisis de un incidente?', b:'En la pestaña "Actividad" — es el registro cronológico de todo lo que se hizo. Fundamental para la calidad del ticket y el seguimiento.'},
{id:'inc-18', mod:'inc', f:'¿Cuál es el control BCOT110104C005?', b:'La revisión mensual obligatoria de los incidentes del periodo, realizada por el Equipo Dueño de Producto, para identificar patrones y postular casos a Gestión de Problemas.'},

// ── MÓDULO 5: Gestión de Problemas ──────────────────────────
{id:'prob-1',  mod:'prob', f:'¿Cuáles son las 4 fases de Gartner para gestión de problemas?', b:'Identificación → Mitigación → Resolución → Optimización'},
{id:'prob-2',  mod:'prob', f:'¿Qué es un error conocido (PKE)?', b:'Un problema ya analizado, con causa raíz documentada y una solución temporal (workaround), pero que no ha sido resuelto definitivamente.'},
{id:'prob-3',  mod:'prob', f:'¿Qué es un workaround?', b:'Solución alternativa o temporal que reduce el impacto de un incidente/problema mientras no existe una solución definitiva.'},
{id:'prob-4',  mod:'prob', f:'¿Cuándo se genera automáticamente un PKE en Hilix?', b:'Al pasar un caso problema a estado "Terminado" con el motivo de estatus "Error conocido".'},
{id:'prob-5',  mod:'prob', f:'¿Cuál es la diferencia entre PKE y NKW en Hilix?', b:'PKE nace de un caso problema resuelto (hereda su documentación). NKW es una plantilla independiente del módulo Knowledge — no deben confundirse.'},
{id:'prob-6',  mod:'prob', f:'¿Se puede cerrar un caso problema con solo un workaround, sin solución definitiva?', b:'SÍ. Si el workaround es efectivo, puede convertirse en la forma permanente (ej. aplicación próxima a jubilarse).'},
{id:'prob-7',  mod:'prob', f:'¿Cuánto es el cumplimiento acumulado del proceso de problemas?', b:'84.9% (con meta del 60%).'},
{id:'prob-8',  mod:'prob', f:'¿Cuántos días abierto debe tener un incidente para obligar la creación de un caso problema?', b:'Más de 20 días abierto.'},
{id:'prob-9',  mod:'prob', f:'¿Qué hace el módulo de Gestión Proactiva de Problemas en Hilix?', b:'Usa IA para agrupar incidentes en mapas de calor y detectar patrones recurrentes ANTES de que se conviertan en recurrencia.'},
{id:'prob-10', mod:'prob', f:'¿Cuándo es proactiva (no reactiva) la gestión de problemas?', b:'Cuando el equipo revisa periódicamente (idealmente mensual) sus incidentes para detectar patrones antes de que se repitan — sin esperar a "estar corchados".'},
{id:'prob-11', mod:'prob', f:'¿Qué significa RCA?', b:'Root Cause Analysis — análisis formal y riguroso de la causa raíz.'},
{id:'prob-12', mod:'prob', f:'¿Qué significa MTTR?', b:'Mean Time To Resolve — tiempo medio de resolución de un incidente. Reducirlo es uno de los beneficios principales del PKE.'},
{id:'prob-13', mod:'prob', f:'¿Cuántos problemas tiene Bancolombia acumulados y cuál es el cumplimiento?', b:'~750 problemas totales. Cumplimiento acumulado: 84.9% (muy por encima de la meta del 60%).'},
{id:'prob-14', mod:'prob', f:'¿En qué nivel de madurez se encuentra Bancolombia en gestión de problemas?', b:'Nivel "Gestionado" (tercer nivel): mide, monitorea y corrige sistemáticamente. Niveles: Inicial → Estandarizado → Gestionado → Optimizado.'},
{id:'prob-15', mod:'prob', f:'¿Qué es ITSM Insights en Hilix?', b:'Workspace de Gestión Proactiva de Problemas con IA para agrupar incidentes en mapas de calor y detectar patrones antes de que se conviertan en recurrencia.'},
{id:'prob-16', mod:'prob', f:'¿Cuál fue la principal causa de incidentes en el análisis de Canales Claves?', b:'1.º Fallas de proveedor (42 casos) · 2.º Ejecución de CRQ (32 casos) · 3.º Nequi (15 casos). Llevó a crear 8 casos problema.'},
{id:'prob-17', mod:'prob', f:'¿Cuáles son los 7 estados posibles de un PKE?', b:'Asignado · Planificado para corrección · Asignado al proveedor · Sin acción planificada · Corregido · Cerrado · Cancelado'},
{id:'prob-18', mod:'prob', f:'¿Qué es la técnica "invertir el problema"?', b:'Preguntar qué acciones harían que el problema EMPEORE, luego invertir esa lógica para encontrar soluciones — cambia la perspectiva y revela caminos que el enfoque directo no detecta.'},

// ── MÓDULO 6: Habilitar y Mantener Soluciones ───────────────
{id:'hym-1',  mod:'hym', f:'¿Cuáles son las 5 etapas del proceso Habilitar y Mantener Soluciones?', b:'1. Analizar y arquitectar · 2. Preparar · 3. Implementar (corazón) · 4. Desplegar · 5. Estabilizar'},
{id:'hym-2',  mod:'hym', f:'¿A qué tipo de aplicaciones NO aplica el proceso?', b:'Aplicaciones SaaS — no están dentro de la infraestructura del Banco y no se gestiona su código fuente.'},
{id:'hym-3',  mod:'hym', f:'¿Qué es el DoD (Definition of Done)?', b:'El insumo dentro de Azure DevOps que centraliza toda la evidencia y aprobaciones para certificar que una solución está lista para pasar a producción.'},
{id:'hym-4',  mod:'hym', f:'¿Quién debe aprobar el DoD y cómo?', b:'El Dueño de Producto (PO), de forma PERSONAL — nunca delegada a otra persona.'},
{id:'hym-5',  mod:'hym', f:'¿Cuáles son los 3 tipos de despliegue autorizados?', b:'Manual (Git LFS en Azure DevOps) · Automático (pipeline CI/CD) · SolMan (documento Charm para SAP)'},
{id:'hym-6',  mod:'hym', f:'¿Qué exige la Circular 029 en el proceso de desarrollo?', b:'Segregación de funciones: aprobaciones par. Un desarrollador NO puede desarrollar, probar y desplegar a producción por sí mismo — el Pull Request es ese control.'},
{id:'hym-7',  mod:'hym', f:'¿Los 3 tipos de despliegue qué representan desde el punto de vista regulatorio?', b:'Cada uno es en sí mismo un CONTROL SOX del proceso.'},
{id:'hym-8',  mod:'hym', f:'En un despliegue manual (Git LFS), ¿de dónde debe obtener el instalador el artefacto?', b:'ÚNICAMENTE del correo automático generado por Azure DevOps — nunca por correo personal, Teams, OneDrive ni adjunto en la CRQ.'},
{id:'hym-9',  mod:'hym', f:'¿Cuáles son los 5 pilares de DevOps?', b:'Continuous Integration · Continuous Testing · Despliegue Continuo · Release Management · Configuration Management'},
{id:'hym-10', mod:'hym', f:'¿Qué pruebas están en la base de la pirámide de testing y quién es responsable?', b:'Pruebas unitarias — a cargo del equipo de desarrollo. JUnit para Java, PyTest para Python. Medidas en Sonar.'},
{id:'hym-11', mod:'hym', f:'¿Qué es BoolTracker?', b:'La plataforma central de gestión de vulnerabilidades (DevSecOps) donde se consolidan todos los hallazgos de los escaneos de seguridad.'},
{id:'hym-12', mod:'hym', f:'¿Sin qué no se puede crear un repositorio ni desplegar a producción?', b:'Sin un elemento de configuración (CI) creado en la CMDB — es la puerta de entrada al proceso.'},
{id:'hym-13', mod:'hym', f:'¿Qué es el Mutation Testing y a qué lenguaje aplica?', b:'Técnica que modifica código fuente para verificar si las pruebas unitarias detectan el cambio. Solo aplica para Java, usando la librería PIT.'},
{id:'hym-14', mod:'hym', f:'¿Qué escaneos de seguridad se realizan en la fase DevBill (Integración Continua)?', b:'SAST de código fuente e IaC, secret scanning (secretos expuestos) y dependency scanning (vulnerabilidades en dependencias).'},
{id:'hym-15', mod:'hym', f:'¿Qué escaneos de seguridad se realizan en la fase de Release?', b:'DAST (análisis dinámico), container scanning (imágenes Docker) y escaneo de Kubernetes manifests.'},
{id:'hym-16', mod:'hym', f:'¿Cuántos días máximo se tienen para remediar una vulnerabilidad crítica?', b:'45 días (con modelo de aceptación de riesgo en BoolTracker, que requiere aprobación de EBC, CD y líder funcional).'},
{id:'hym-17', mod:'hym', f:'¿Quiénes pueden realizar la aprobación técnica del paso a producción?', b:'Líder técnico de EBC · Líder de línea de conocimiento · Ingeniero de software autorizado (según nivel de riesgo definido por la encuesta).'},
{id:'hym-18', mod:'hym', f:'¿Qué pasa si el pipeline de release no tiene el stage de CRQ aprobada?', b:'El pipeline de deploy PDN cancela y abandona automáticamente el release — es un control SOX automático que no puede esquivarse.'},
];

/* ============================================================
   DATOS — Banco de preguntas (23 preguntas × 6 módulos ≈ 138)
   ============================================================ */
const BANK = [
  // ─── MODELO OPERATIVO ───
  {mod:'mo',q:'Según la definición de Bancolombia, ¿qué es un modelo operativo?',o:['Un manual técnico de arquitectura de software','La manera en que coordinamos áreas, procesos y funciones para entregar valor a clientes y a la organización','El organigrama oficial de la Vicepresidencia de Tecnología','Un conjunto de reglas inmodificables de gobierno corporativo'],c:1,e:'Es la definición oficial de Bancolombia. Se compara con una hoja de ruta o un GPS que guía a la organización.'},
  {mod:'mo',q:'Un equipo Local considera saltarse un lineamiento del Federal para avanzar más rápido. ¿Cuál es la acción correcta?',o:['Saltarse el lineamiento porque el modelo no es una camisa de fuerza','Coordinar y evaluar el cambio con el Federal bajo el ciclo PHVA, nunca decidirlo unilateralmente','Escalar directamente a la Superintendencia Financiera','Ignorarlo, ya que el nivel Local tiene jerarquía absoluta'],c:1,e:'Que el modelo sea adaptable no significa actuar unilateralmente: toda excepción a un lineamiento Federal debe coordinarse y aprobarse.'},
  {mod:'mo',q:'¿Cuáles son los cuatro pilares del modelo operativo?',o:['Personas, procesos, servicios y tecnología','Presupuesto, riesgo, auditoría y cumplimiento','Cliente, producto, canal y marca','Federal, State, Local y Hub'],c:0,e:'Los cuatro pilares que soportan el modelo de operación son personas, procesos, servicios y tecnología.'},
  {mod:'mo',q:'¿Qué modelo operativo usa hoy Bancolombia, en transición hacia otro?',o:['Centralizado puro','Distribuido puro','Federal – State – Local, transicionando hacia Hub and Spoke','Hub and Spoke puro'],c:2,e:'Bancolombia opera hoy en Federal-State-Local, combinando elementos con una aspiración progresiva hacia Hub and Spoke.'},
  {mod:'mo',q:'¿Qué modelo genera alta capacidad de control pero baja alineación con el negocio?',o:['Centralizado','Distribuido','Federal-State-Local','Hub and Spoke'],c:0,e:'El modelo centralizado da mucho control, típico de organizaciones clásicas, pero con menor alineación al negocio.'},
  {mod:'mo',q:'¿Qué modelo genera alta alineación con el producto pero puede caer en caos y bajo control?',o:['Centralizado','Distribuido','Federal-State-Local','Hub and Spoke'],c:1,e:'El modelo distribuido, con equipos tecnológicos independientes, mejora la alineación al producto pero reduce el control.'},
  {mod:'mo',q:'En el modelo Hub and Spoke, ¿dónde está el centro de la conversación?',o:['En el cumplimiento normativo','En el producto / la plataforma','En el presupuesto anual','En la estructura jerárquica'],c:1,e:'El Hub and Spoke está muy centralizado en plataformas: entrega capacidades para que otros equipos construyan sobre ellas, con foco en el producto.'},
  {mod:'mo',q:'¿La estructura organizacional de Bancolombia es lo mismo que el modelo operativo?',o:['Sí, son sinónimos','No, la estructura tiene mucho que ver con el modelo pero no es el modelo operativo en sí','Solo son iguales en el nivel Federal','Sí, siempre que estén documentadas en el mismo sitio'],c:1,e:'Se insiste en la sesión: muchas veces se confunde el modelo operativo con la estructura, pero no son lo mismo.'},
  {mod:'mo',q:'¿Aproximadamente cuántas personas deben certificarse en el modelo operativo?',o:['Cerca de 250','Cerca de 2,534, entre las dos vicepresidencias','Solo los líderes técnicos','Únicamente el equipo de Modernización y Gobierno'],c:1,e:'Se mencionó una cifra aproximada de 2,534 personas entre las dos vicepresidencias de tecnología.'},
  {mod:'mo',q:'¿Qué ciclo explica por qué el modelo operativo debe evolucionar constantemente?',o:['El ciclo PHVA (Planear, Hacer, Verificar, Actuar)','El ciclo de vida del producto','El ciclo contable trimestral','El ciclo de aprobación de cambios'],c:0,e:'El modelo operativo hace alusión al ciclo PHVA: no es una entidad fija, sino que se evalúa y ajusta constantemente.'},
  // ─── GESTIÓN DE LA CONFIGURACIÓN ───
  {mod:'cfg',q:'¿Qué es un Elemento de Configuración (CI)?',o:['Un usuario con permisos de administrador en Hilix','Cualquier componente que requiera ser gestionado para habilitar un servicio de TI','Un tipo de incidente crítico','Una categoría de resolución de problemas'],c:1,e:'Un CI es cualquier componente gestionado para habilitar un servicio de TI: servidores, bases de datos, aplicaciones, etc.'},
  {mod:'cfg',q:'¿Qué atributo obligatorio identifica el código de la aplicación y su responsable en la CMDB?',o:['IP address','Service Tag','App Code','Ticket ID'],c:2,e:'El App Code es el atributo obligatorio que identifica el código de la aplicación y, a través de él, a su responsable.'},
  {mod:'cfg',q:'¿Puede ciberseguridad escanear un componente que no está en la CMDB?',o:['Sí, siempre y cuando el líder lo autorice','No, la CMDB es el insumo oficial y autoritativo para el escaneo','Sí, usando una herramienta alterna','Solo si el componente es crítico'],c:1,e:'Ciberseguridad no escanea ningún componente ausente en la CMDB, por eso debe ser un inventario autoritativo y completo.'},
  {mod:'cfg',q:'¿Cómo es la validación trimestral de la CMDB para componentes on-premise?',o:['Automática, tres veces al día','Manual, con los dueños de las aplicaciones y dueños de clase','No se valida','Solo ante una auditoría externa'],c:1,e:'La validación es semiautomática: automática en nube (vía tag) y manual/trimestral con los dueños en on-premise.'},
  {mod:'cfg',q:'Más allá del inventario, ¿qué es lo más valioso que aporta la CMDB?',o:['El color con que se pintan los tickets','Las relaciones y dependencias entre los componentes','La cantidad de licencias de software','El historial de contraseñas'],c:1,e:'Lo valioso de la CMDB no es solo listar componentes, sino mapear cómo se relacionan y dependen entre sí.'},
  {mod:'cfg',q:'¿Cuál es la jerarquía estructural típica de la CMDB, de arriba hacia abajo?',o:['Componente técnico → Transacción → Aplicación → Servicio','Servicio → Aplicaciones → Transacciones → Componentes técnicos','Usuario → Grupo → Aplicación → Servicio','Incidente → Problema → Cambio → Servicio'],c:1,e:'La jerarquía parte del Servicio, que se relaciona con Aplicaciones, que consumen Transacciones, soportadas por Componentes técnicos.'},
  {mod:'cfg',q:'¿Cuál es la herramienta ITCM oficial definida en el Banco?',o:['BMC Helix (Hilix)','Jira Service Desk','ServiceNow','Power BI'],c:0,e:'BMC Helix (conocida como Hilix) es la herramienta ITCM oficial para la gestión de los procesos.'},
  {mod:'cfg',q:'Un CRQ se crea sin CI asociado o con el CI incorrecto. ¿Qué consecuencia real puede tener?',o:['Ninguna, es solo un campo informativo','No se identifica correctamente el impacto, lo que puede derivar en un incidente en producción','Se cancela automáticamente el cambio','Mejora la velocidad del despliegue'],c:1,e:'Es uno de los ejemplos reales del proceso: sin el CI correcto no se identifica el impacto, aumentando el riesgo de incidentes.'},
  {mod:'cfg',q:'¿Quién puede actualizar la información de un CI en Hilix?',o:['Cualquier persona con acceso a Hilix','Solo los dueños de ese tipo de componente, por segregación de funciones','Solo el equipo de auditoría','Nadie, la CMDB es de solo lectura'],c:1,e:'Existe segregación de funciones: solo los dueños de cada tipo de componente pueden actualizarlo en Hilix.'},
  {mod:'cfg',q:'¿Aproximadamente cuántos elementos de configuración hay hoy en la CMDB del Banco?',o:['Cerca de 2,500','Cerca de 25,000','Cerca de 250,000','Cerca de 2.5 millones'],c:2,e:'Se mencionó una cifra aproximada de 250,000 elementos de configuración de distintas tipologías.'},
  // ─── GESTIÓN DE CAMBIOS ───
  {mod:'cam',q:'Un cambio va a generar indisponibilidad de cara al cliente por 45 minutos. ¿Qué exige la Circular 028?',o:['Nada, 45 minutos no es significativo','Avisar con 8 días calendario de anticipación y pasar por el Consejo con 15 días','Solo notificar internamente a arquitectura','Cancelar el cambio automáticamente'],c:1,e:'Si la indisponibilidad de cara al cliente es de 30 minutos o más, se activa la Circular 028.'},
  {mod:'cam',q:'¿Qué días de la semana se realiza el Consejo de Cambios?',o:['Lunes y viernes','Martes y jueves','Todos los días hábiles','Solo los miércoles'],c:1,e:'El Consejo sesiona los martes y jueves a las 9:00 a.m.'},
  {mod:'cam',q:'Un cambio automático quedó con riesgo bajo (ágil), pero el equipo igual crea un cambio manual para "ir tranquilos" al Consejo. ¿Es correcto?',o:['Sí, siempre es mejor ir al Consejo por precaución','No, es un incumplimiento: un cambio automático no debe generar un cambio manual paralelo','Sí, si el líder lo aprueba verbalmente','Depende del día de la semana'],c:1,e:'El nivel de aprobación definido por el riesgo ya es el correcto; crear un cambio manual paralelo es un incumplimiento del proceso.'},
  {mod:'cam',q:'¿Cuáles son los cuatro tipos de cambio?',o:['Crítico, alto, medio y bajo','Ágil, estándar, programado y emergencia','Manual, automático, híbrido y legado','SOX, operativo, regulatorio y técnico'],c:1,e:'Los cuatro tipos, tanto en manuales como en automáticos, son: ágil, estándar, programado y emergencia.'},
  {mod:'cam',q:'¿Cuál es la diferencia entre el control SOX y el control operativo en Gestión de Cambios?',o:['Son lo mismo','El SOX es la aprobación del cambio; el operativo es su cierre y validación','El SOX aplica solo a cambios manuales','El operativo lo hace la Superintendencia'],c:1,e:'El control SOX es la aprobación formal; el operativo es cerrar y validar el resultado del cambio ejecutado.'},
  {mod:'cam',q:'¿Qué tipo de cambio es el ÚNICO que no requiere diligenciar la encuesta de riesgos?',o:['Ágil','Estándar','Programado','Emergencia'],c:1,e:'Los cambios estándar ya están certificados como libres de indisponibilidad por cada plataforma, por eso están exentos.'},
  {mod:'cam',q:'¿Qué tipo de cambio se puede ejecutar primero y "legalizar" (crear el registro) después?',o:['Ágil','Estándar','Programado','Emergencia (y cambios de aliados notificados tarde)'],c:3,e:'Por la premura de resolver un incidente, las emergencias (y ciertos cambios de aliados) son la excepción que se puede legalizar después.'},
  {mod:'cam',q:'Si es absolutamente necesario ejecutar un cambio en una fecha de restricción, ¿quién debe aprobarlo adicionalmente?',o:['El mismo desarrollador que lo crea','El Director o Líder de Entorno (el cargo más alto del equipo)','La Superintendencia Financiera','No se requiere aprobación adicional'],c:1,e:'Se exige la aprobación del Director o Líder de Entorno para cambios ágiles/programados en fechas restringidas.'},
  {mod:'cam',q:'En Hilix, ¿qué rol tiene la capacidad de dar el visto bueno formal (control SOX)?',o:['El aprobador','El instalador','El auditor externo','El usuario final'],c:0,e:'El aprobador tiene los tres roles (coordinador, gestor y aprobador) y es quien da la aprobación formal del cambio.'},
  {mod:'cam',q:'Un cambio automático de software de negocio no se cerró correctamente. ¿Qué se debe hacer?',o:['Cambiar el estado manualmente en Hilix','Crear un ticket de soporte al equipo de Procesos TI DevEx para que lo cierren automáticamente','Ignorarlo, se cierra solo en 30 días','Crear un cambio manual duplicado'],c:1,e:'Nunca se debe intervenir manualmente un cambio automático; se solicita soporte al equipo de Procesos TI DevEx.'},
  // ─── GESTIÓN DE INCIDENTES ───
  {mod:'inc',q:'Al resolver un incidente, se documenta la causa raíz como "se reinició el servidor". ¿Es correcto?',o:['Sí, describe exactamente qué pasó','No, es apenas el síntoma; responde "qué pasó" pero no "por qué pasó"','Sí, si se documenta en el campo correcto','No aplica documentar causa raíz aquí'],c:1,e:'Una causa raíz correcta responde POR QUÉ pasó (ej. "error en script que reinició el servicio fuera de ventana").'},
  {mod:'inc',q:'¿Cuáles son los 3 criterios que debe cumplir una causa raíz de calidad?',o:['Rápida, económica y documentada','Accionable, prevenible y verificable','Aprobada, publicada y archivada','Técnica, funcional y regulatoria'],c:1,e:'Debe ser accionable (se puede corregir), prevenible (evita que se repita) y verificable (se puede comprobar).'},
  {mod:'inc',q:'Un usuario no está de acuerdo con la solución de su incidente, resuelto hace 3 días. ¿Qué debe hacer?',o:['Nada, ya no se puede hacer nada','Solicitar garantía y reapertura a través de Mateo, dentro de los 5 días corridos','Crear un caso problema directamente','Esperar 30 días para volver a reportar'],c:1,e:'La ventana de garantía es de 5 días corridos y la reapertura solo la gestiona Mateo (mesa de servicio).'},
  {mod:'inc',q:'¿Por qué todo grupo de soporte debe tener más de un integrante?',o:['Es un requisito estético de Hilix','Para evitar que un incidente quede huérfano si la única persona está de vacaciones o incapacitada','Porque lo exige la Circular 028','Para repartir el bono de cumplimiento de ANS'],c:1,e:'Con un solo integrante, si esa persona no está disponible, el incidente queda sin atención.'},
  {mod:'inc',q:'¿Cuál de las siguientes SÍ es un plan de acción válido para evitar la recurrencia?',o:['Actualizar la documentación del proceso','Implementar una automatización en el aprovisionamiento','Crear un checklist','Definir roles de atención de incidentes'],c:1,e:'Un plan de acción real elimina la causa raíz con implementación técnica; documentación y checklists son mejora continua.'},
  {mod:'inc',q:'¿Para qué sirve el campo "tipo de incidencia" en el ticket?',o:['Para calcular automáticamente el ANS','Para diferenciar un incidente de un evento de infraestructura','Para asignar el grupo de soporte','Para definir el elemento de configuración'],c:1,e:'Cualquier opción distinta a "Evento de infraestructura" en ese campo indica que se trata de un incidente.'},
  {mod:'inc',q:'¿Qué campos determinan automáticamente la prioridad de un ticket?',o:['Categoría operacional y de resolución','Impacto y urgencia','Elemento de configuración y servicio','Grupo de soporte y responsable'],c:1,e:'El impacto y la urgencia se combinan para calcular la prioridad del ticket.'},
  {mod:'inc',q:'¿Se puede cambiar la prioridad calculada de un ticket?',o:['No, nunca','Sí, siempre y cuando se justifique el cambio','Sí, sin ninguna justificación','Solo lo puede hacer un auditor externo'],c:1,e:'Se puede cambiar, pero debe justificarse siempre — cambiarla sin razón puede generar una glosa de auditoría.'},
  {mod:'inc',q:'¿Cuál es el ANS para un incidente crítico de infraestructura?',o:['1 hora','4 horas','10 horas','18 horas'],c:1,e:'Para infraestructura: críticos 4 horas, medios 10 horas, bajos 18 horas.'},
  {mod:'inc',q:'¿Cuál es el ANS para los problemas, sin importar su criticidad?',o:['10 días hábiles','20 días hábiles','40 días corridos (aprox. 60 días calendario)','No tienen ANS definido'],c:2,e:'Los problemas (críticos, medios y bajos) manejan un ANS de 40 días corridos, aproximadamente 60 días calendario.'},
  // ─── GESTIÓN DE PROBLEMAS ───
  {mod:'prob',q:'¿Qué es un error conocido (Known Error / PKE)?',o:['Un incidente que nunca se pudo resolver','Un problema ya analizado, con causa raíz documentada y una solución temporal (workaround)','Un tipo de vulnerabilidad crítica en BoolTracker','Un cambio rechazado por el Consejo'],c:1,e:'Combina causa raíz documentada + solución temporal, aunque aún no exista una solución definitiva.'},
  {mod:'prob',q:'¿Cuándo se genera automáticamente un artículo PKE en Hilix?',o:['Al crear cualquier incidente nuevo','Al pasar un caso problema a estado "Terminado" con motivo "Error conocido"','Automáticamente cada lunes','Cuando un incidente supera los 60 días abierto'],c:1,e:'El PKE nace al cerrar un caso problema con causa temporal, heredando su documentación.'},
  {mod:'prob',q:'¿Cuál es la diferencia entre gestión reactiva y proactiva de problemas?',o:['No hay diferencia','La reactiva espera estar "corchado"; la proactiva revisa periódicamente para detectar patrones antes de la recurrencia','La proactiva solo aplica a incidentes críticos','La reactiva la hace el proceso, la proactiva la Superintendencia'],c:1,e:'La meta es migrar hacia la revisión periódica (proactiva), apoyada en mapas de calor con IA.'},
  {mod:'prob',q:'¿Se puede cerrar un caso problema únicamente con un workaround, sin solución definitiva?',o:['No, siempre se requiere solución definitiva','Sí, si el workaround es efectivo puede convertirse en la forma permanente','Solo con aprobación de la Superintendencia','No, violaría la Ley SOX'],c:1,e:'Es válido especialmente cuando no es rentable implementar una solución definitiva (ej. app próxima a jubilarse).'},
  {mod:'prob',q:'¿Cuáles son las 4 fases de Gartner para la gestión de problemas?',o:['Planear, hacer, verificar, actuar','Identificación, mitigación, resolución, optimización','Registro, análisis, cierre, auditoría','Diseño, desarrollo, pruebas, despliegue'],c:1,e:'Gartner propone: identificación, mitigación (donde se enfoca la gestión de errores conocidos), resolución y optimización.'},
  {mod:'prob',q:'¿Cuál era la meta de cumplimiento del proceso de problemas?',o:['30%','60% (con un cumplimiento real de 84.9%)','90%','100%'],c:1,e:'La meta era 60%, con un cumplimiento acumulado real reportado de 84.9%.'},
  {mod:'prob',q:'Según el lineamiento del proceso, si un incidente lleva abierto más de cierto número de días, se debe crear caso problema. ¿Cuántos días?',o:['5 días','20 días','60 días','100 días'],c:1,e:'El lineamiento indica: incidente con más de 20 días abierto debe generar un caso problema.'},
  {mod:'prob',q:'¿Cuál es la diferencia entre el PKE y el artículo "error conocido" (NKW) del módulo Knowledge?',o:['Son exactamente lo mismo','El PKE nace de un caso problema resuelto; el NKW es una plantilla independiente del módulo Knowledge','El NKW solo aplica a incidentes críticos','El PKE lo crea la Superintendencia'],c:1,e:'Tienen orígenes distintos, aunque ambos pueden aparecer relacionados en el panel de recursos de un ticket.'},
  {mod:'prob',q:'¿Qué hace el módulo de Gestión Proactiva de Problemas en Hilix?',o:['Cierra automáticamente los incidentes vencidos','Agrupa incidentes con IA en mapas de calor para identificar patrones recurrentes','Calcula el bono trimestral del equipo','Reemplaza la necesidad de crear casos problema'],c:1,e:'Usa IA para agrupar incidentes por patrones y mostrarlos en mapas de calor, ayudando a crear casos problema proactivamente.'},
  {mod:'prob',q:'Una causa raíz de calidad debe responder principalmente...',o:['Qué pasó','Por qué pasó','Quién lo causó','Cuándo se resolverá'],c:1,e:'El énfasis constante del proceso es que la causa raíz explique el "por qué", no solo describir el síntoma ("qué pasó").'},
  // ─── HABILITAR Y MANTENER SOLUCIONES ───
  {mod:'hym',q:'¿Cuáles son las 5 etapas del proceso Habilitar y Mantener Soluciones?',o:['Planear, ejecutar, verificar, actuar y cerrar','Analizar y arquitectar, preparar, implementar, desplegar y estabilizar','Diseñar, codificar, probar, aprobar y monitorear','Federal, State, Local, Hub y Spoke'],c:1,e:'Las 5 etapas son: analizar/arquitectar, preparar, implementar (el corazón), desplegar y estabilizar.'},
  {mod:'hym',q:'¿Por qué es obligatorio el Pull Request antes de integrar código a una rama protegida?',o:['Es una recomendación opcional','Garantiza la segregación de funciones exigida por la Circular 029','Solo sirve para métricas de productividad','Es exclusivo de aplicaciones SaaS'],c:1,e:'La Circular 029 exige aprobaciones par: un desarrollador no puede desplegar solo lo que él mismo construyó.'},
  {mod:'hym',q:'En un despliegue manual (Git LFS), ¿de dónde debe obtener el instalador el artefacto y la documentación?',o:['De cualquier medio: correo personal, Teams o OneDrive compartido','Únicamente del correo automático generado por Azure DevOps','Directamente adjunto en la CRQ','Se lo pasa verbalmente el coordinador'],c:1,e:'Regla estricta: nunca instalar algo recibido fuera del correo automático de Azure DevOps — mitiga el riesgo de fraude interno.'},
  {mod:'hym',q:'Una solución obtiene nivel de riesgo ALTO en la encuesta de riesgos. ¿Qué implica?',o:['Se cancela automáticamente el despliegue','La herramienta obliga a generar una CRQ programada que debe pasar por el Consejo de Cambios','Se puede desplegar igual de forma ágil','Solo requiere aprobación del líder de línea de conocimiento'],c:1,e:'Riesgo alto obliga a CRQ programada, con doble validación: Consejo de Cambios + líder técnico de EBC.'},
  {mod:'hym',q:'¿Quién debe aprobar personalmente el Definition of Done (DoD) antes de pasar a producción?',o:['Cualquier integrante, incluso delegando la aprobación','El dueño de producto, de forma personal, nunca delegada','Solo el equipo de auditoría','El instalador que ejecuta el despliegue'],c:1,e:'La aprobación del DoD debe ser personal del dueño de producto — no se puede delegar.'},
  {mod:'hym',q:'En la pirámide de pruebas del Banco, ¿dónde se concentra la MAYOR cobertura?',o:['En la cúspide, con pruebas end-to-end','En la base, con pruebas unitarias','En el nivel medio, con pruebas de integración','No hay diferencia de cobertura entre niveles'],c:1,e:'La base de la pirámide (pruebas unitarias) es la más grande, buscando una cobertura superior y bases sólidas de código.'},
  {mod:'hym',q:'¿Qué framework de pruebas unitarias se usa para proyectos en Java?',o:['PyTest','JUnit','Playwright','Robot Framework'],c:1,e:'JUnit es el framework definido para pruebas unitarias en Java; PyTest se usa para Python.'},
  {mod:'hym',q:'¿Cuál es la herramienta oficial del Banco para pruebas de performance?',o:['Selenium','Postman','JMeter','SiteSpeed en solitario'],c:2,e:'JMeter es la herramienta oficial de performance en la compañía (a veces complementada con SiteSpeed).'},
  {mod:'hym',q:'En la estrategia de ramas GitFlow del Banco, ¿qué se requiere siempre para integrar una rama a otra?',o:['Un Pull Request aprobado','Un correo al líder técnico','Nada, se puede hacer push directo','Una aprobación verbal del PO'],c:0,e:'Cada integración (feature→develop→release) requiere un Pull Request; no se permite push directo a ramas protegidas.'},
  {mod:'hym',q:'Los 3 tipos de despliegue (manual, automático y SolMan), ¿qué representan en sí mismos?',o:['Simples preferencias técnicas de cada equipo','Controles SOX','Tareas opcionales de documentación','Un tipo de prueba de performance'],c:1,e:'Cada uno de los 3 tipos de despliegue es, en sí mismo, un control SOX del proceso.'},
  // ─── MODELO OPERATIVO — preguntas adicionales ───
  {mod:'mo',q:'¿Cómo se define una Plataforma en el contexto del Modelo Operativo de Ingeniería de TI?',o:['Un servidor de alta disponibilidad con redundancia geográfica','Un framework de metodologías ágiles','Un conjunto de APIs y microservicios del núcleo bancario','Una base digital integral de Componentes Tecnológicos que habilita la automatización de Procesos de Negocio y la exposición de Servicios de Aplicación'],c:3,e:'La plataforma surge de la convergencia de Negocio + Proceso + Tecnología, y es la base del modelo de Ingeniería de Plataformas.'},
  {mod:'mo',q:'Según el Gobierno del Modelo Operativo, ¿qué papel cumplen las métricas de los procesos de TI?',o:['Calcular el bono trimestral de los equipos','Medir exclusivamente la satisfacción del cliente externo','Definir el presupuesto anual de infraestructura','Ser el termómetro para "Verificar" si la operación funciona y señalar dónde "Actuar" para evolucionar'],c:3,e:'Las métricas son la evidencia objetiva que alimenta las fases Verificar y Actuar del ciclo PHVA.'},
  {mod:'mo',q:'¿Cuál principio expresa correctamente el enfoque del MO hacia los procesos de TI?',o:['Los procesos son estructuras rígidas que no deben cambiar sin auditoría','Los procesos son opcionales si el equipo tiene las capacidades correctas','Los procesos aplican solo a Federal y State, no al Local','Los procesos no son "camisas de fuerza": pueden evolucionar, pero de forma ordenada mediante el ciclo PHVA'],c:3,e:'El MO promueve la adaptabilidad de los procesos, pero exige que cualquier evolución sea ordenada y gobernada.'},
  {mod:'mo',q:'En el Modelo Operativo de Ingeniería de Plataformas, ¿cuál es la ecuación que genera una Plataforma?',o:['Federal + State + Local','Planear + Hacer + Verificar + Actuar','Personas + Procesos + Servicios','Negocio + Proceso + Tecnología = Plataforma'],c:3,e:'Una plataforma digital es la convergencia de los tres elementos: Negocio, Proceso y Tecnología.'},
  {mod:'mo',q:'¿Cuál describe mejor la relación entre modelo operativo y estructura organizacional?',o:['Son sinónimos — describen lo mismo con términos distintos','Solo son iguales cuando la estructura está en el mismo documento','La estructura define cómo se ejecutan los procesos; el modelo define los organigramas','Están relacionados pero no son lo mismo: la estructura tiene mucho que ver con el modelo, pero no es el modelo en sí'],c:3,e:'Se insiste en esta distinción: muchos confunden el organigrama con el modelo operativo, pero no son lo mismo.'},
  // ─── MODELO OPERATIVO — casos de uso y contexto ───
  {mod:'mo',q:'Un equipo Local lleva semanas esperando que el State automatice un componente que necesita urgentemente. ¿Qué debe hacer?',o:['Esperar indefinidamente al State sin actuar','Construir su propia solución ignorando los lineamientos','Coordinar con State un despliegue manual controlado y levantar solicitud de mejora','Escalar directamente a la Superintendencia Financiera'],c:2,e:'La acción correcta combina cubrir la necesidad inmediata (despliegue manual controlado bajo lineamientos) y mejorar el proceso mediante solicitud formal de mejora al State.'},
  {mod:'mo',q:'¿Cuál es la prioridad diaria de los equipos de tecnología según el modelo operativo?',o:['Desplegar el máximo número de features posibles','Garantizar que la tecnología sea una plataforma robusta y estable para los equipos internos','Reducir el presupuesto de TI al mínimo posible','Preparar informes para el Comité Directivo'],c:1,e:'El propósito del área de tecnología es ser una plataforma confiable que habilite a los equipos internos y, a través de ellos, a los clientes del negocio.'},
  {mod:'mo',q:'El State detecta que 3 equipos Local están construyendo de forma independiente exactamente la misma solución. ¿Qué debe hacer el State?',o:['Dejar que cada Local construya su versión para fomentar la innovación','Cancelar todos los proyectos y esperar un lineamiento Federal','Centralizar la solución y exponerla como servicio de plataforma para que todos la consuman','Delegar la decisión a los propios equipos Local'],c:2,e:'El rol del State es precisamente evitar duplicación: centraliza soluciones comunes y las expone como servicios estándar reutilizables para todos los equipos Local.'},
  {mod:'mo',q:'¿Qué aporta COBIT 5 específicamente al MOTI de Bancolombia?',o:['Metodología de desarrollo ágil y sprints','Gobierno corporativo: define quién decide, cómo se controla y cómo se rinden cuentas','Mejores prácticas para entregar servicios TI de calidad','Marco de ciberseguridad y gestión de riesgos'],c:1,e:'COBIT 5 aporta el gobierno: la estructura de decisión y control sobre TI. ITIL 4 aporta la operación y mejora de servicios.'},
  {mod:'mo',q:'¿Qué aporta ITIL 4 al MOTI de Bancolombia?',o:['Gobierno corporativo: quién decide y cómo se rinden cuentas','Normas de auditoría interna y externa','Mejores prácticas para diseñar, entregar y mejorar continuamente los servicios de TI','Metodología de gestión de proyectos tipo PMBOK'],c:2,e:'ITIL 4 aporta la capa de gestión de servicios: cómo diseñar, operar y mejorar los servicios que consume el negocio.'},
  {mod:'mo',q:'¿Qué son los CDEs (Centros de Excelencia transversales) en la estructura del MO?',o:['Los directores de área de cada vicepresidencia','Equipos especializados transversales que dan soporte a todos los entornos (Infra & Operación, DevExp, Arquitectura)','Los equipos del nivel Federal que emiten lineamientos','Los clientes internos del nivel Local'],c:1,e:'Los CDEs son transversales: sirven a todos los niveles y entornos simultáneamente, no pertenecen a un entorno específico.'},
  {mod:'mo',q:'¿Qué significa que "cumplir el proceso asegura que el valor no sea un evento de una sola vez"?',o:['Que los procesos deben documentarse en cada iteración','Que la consistencia en la ejecución hace el valor sostenible y repetible, no un pico aislado','Que el valor solo se genera cuando Federal lo autoriza','Que el proceso garantiza el bono de desempeño trimestral'],c:1,e:'El proceso es el mecanismo que convierte el valor en algo repetible y sostenible. Sin proceso, el valor es accidental y efímero.'},
  {mod:'mo',q:'¿Qué significa EVC en el nivel Local del modelo operativo?',o:['Estándares de Validación de Configuración','Equipos externos de auditoría de tecnología','Equipo de Valor para el Cliente — célula con soporte E2E a sus productos y clientes','Líderes de los Centros de Excelencia Federal'],c:2,e:'Los EVC (Equipos de Valor para el Cliente) son las células del nivel Local con responsabilidad integral de extremo a extremo sobre sus productos y servicios.'},
  // ─── GESTIÓN DE LA CONFIGURACIÓN — preguntas adicionales ───
  {mod:'cfg',q:'¿Qué consecuencia tiene un Incidente registrado con un CI incorrecto o sin CI asociado?',o:['El incidente se cancela automáticamente en Hilix','El ANS del incidente se duplica','Las dependencias no se identifican y el incidente puede quedar subestimado','El CI queda marcado para revisión trimestral'],c:2,e:'Sin el CI correcto no se conocen las dependencias del componente afectado y el impacto real del incidente puede quedar subestimado.'},
  {mod:'cfg',q:'¿La CMDB puede utilizarse como herramienta de monitoreo en tiempo real de los componentes?',o:['Sí, es su función principal','Sí, complementa a Dynatrace en el monitoreo activo','Solo para aplicaciones VIA críticas','No — es para inventario y relacionamiento; el monitoreo lo hacen otras herramientas especializadas'],c:3,e:'La CMDB no monitorea: registra, relaciona y gobierna la información de los CIs.'},
  {mod:'cfg',q:'¿Qué proceso de TI necesita la CMDB para identificar aplicaciones VIA y garantizar la recuperación ante contingencias?',o:['Gestión de Cambios','Gestión de Incidentes','Gestión de Problemas','Gestión de la Continuidad de negocio'],c:3,e:'La Continuidad de negocio usa la CMDB para identificar los componentes vitales (VIA) y sus responsables ante una contingencia.'},
  {mod:'cfg',q:'¿Con qué frecuencia la nube carga automáticamente los componentes en la CMDB a través del tag App Code?',o:['Una vez al día','Dos veces al día','Tres veces al día','Una vez por semana'],c:2,e:'La actualización automática vía App Code se realiza tres veces al día para componentes en entornos cloud.'},
  {mod:'cfg',q:'Si un CI tiene el App Code incorrecto, ¿cuál es el impacto directo en el proceso de Gestión de Cambios?',o:['El cambio se cancela automáticamente','El App Code no afecta los cambios, solo los escaneos','El CI queda marcado automáticamente para revisión','No se identifica el equipo responsable ni el impacto real del cambio'],c:3,e:'El App Code vincula el CI con su responsable; un código incorrecto rompe esa cadena y el impacto del cambio queda sin dimensionar.'},
  // ─── GESTIÓN DE LA CONFIGURACIÓN — políticas y gobierno ───
  {mod:'cfg',q:'¿Cuáles son las 4 políticas clave del proceso de Gestión de la Configuración?',o:['Planear, hacer, verificar, actuar','Responsabilidad compartida, CMDB como fuente oficial, certificación periódica, todo ticket debe tener CI activo','Registrar, clasificar, resolver, cerrar','Descubrir, documentar, validar, actualizar'],c:1,e:'Las 4 políticas son los pilares de gobierno: todos son responsables, la CMDB es LA referencia, certificación trimestral, y todo ticket debe relacionar un CI activo.'},
  {mod:'cfg',q:'¿Para qué sirven los reportes de Power BI en el proceso de Gestión de la Configuración?',o:['Para aprobar cambios en la CMDB','Para monitorear en tiempo real los componentes de producción','Para medir la completitud y exactitud de los CIs en la CMDB','Para gestionar las solicitudes de nuevos CIs'],c:2,e:'Power BI entrega dashboards de seguimiento y métricas del proceso: qué tan completa y exacta está la información de la CMDB en cada momento.'},
  {mod:'cfg',q:'¿Qué consecuencia directa tiene que un CI no tenga responsable asignado en la CMDB?',o:['El CI queda marcado automáticamente como "obsoleto"','Si hay un incidente con ese componente, nadie sabe a quién escalar — el ticket queda huérfano y el ANS corre','El CI se elimina automáticamente después de 30 días','Se envía una alerta al Federal para gestión'],c:1,e:'La cadena responsable → CI → incidente → resolución depende del responsable. Sin él, el incidente queda sin atención y el ANS sigue corriendo.'},
  {mod:'cfg',q:'¿Qué son las "Aplicaciones VIA" en el contexto de la CMDB?',o:['Aplicaciones en proceso de desarrollo activo','Aplicaciones con muy bajo uso y candidatas a retiro','Aplicaciones vitales para la continuidad del negocio, identificadas con ese atributo en la CMDB','Aplicaciones de uso exclusivo del área de auditoría'],c:2,e:'Las aplicaciones VIA (vitales para el negocio) se identifican en la CMDB para garantizar su recuperación ante contingencias. Las usa el proceso de Continuidad de negocio.'},
  {mod:'cfg',q:'¿Cuál de las siguientes es una práctica INCORRECTA en la gestión de la CMDB?',o:['Actualizar la CMDB inmediatamente después de un cambio de sistema operativo','Relacionar todos los CIs asociados a una aplicación entre sí','Asumir que los CIs on-premise se actualizan solos igual que los de nube','Certificar trimestralmente los CIs como dueño de clase'],c:2,e:'En nube la actualización es automática (3 veces/día via App Code), pero on-premise requiere certificación manual trimestral. No se actualiza solo.'},
  {mod:'cfg',q:'¿Cuál de los siguientes roles tiene acceso a la API de la CMDB?',o:['Todos los usuarios con acceso a Hilix','Solo los analistas del proceso de Gestión de la Configuración','Cualquier equipo de desarrollo que lo solicite por correo','Solo los dueños de clase de cada tipología de componente'],c:3,e:'La API de la CMDB está disponible exclusivamente para los dueños de clase — garantiza segregación de funciones en las integraciones.'},
  {mod:'cfg',q:'¿Por qué la CMDB es considerada el "cerebro de la operación de TI"?',o:['Porque reemplaza a los sistemas de monitoreo en tiempo real','Porque es la fuente oficial y autoritativa de todos los componentes, sus responsables y sus relaciones','Porque la administran directamente los líderes de tecnología','Porque genera automáticamente los cambios de configuración sin intervención humana'],c:1,e:'La CMDB conecta todo: componentes, responsables, servicios, cambios, incidentes y vulnerabilidades. Sin ella, la operación de TI pierde visibilidad y trazabilidad.'},
  {mod:'cfg',q:'¿Qué es el Portal de Configuración en el ecosistema Helix?',o:['La herramienta principal de la CMDB para todos los usuarios','Una interfaz para consultar y gestionar CIs — en proceso de construcción para el ciclo de certificación','El módulo de monitoreo en tiempo real de componentes','El sistema de tickets de soporte para incidentes de la CMDB'],c:1,e:'El Portal de Configuración es el módulo en construcción que facilitará la certificación y documentación de CIs de forma más amigable para los dueños.'},
  // ─── GESTIÓN DE CAMBIOS — preguntas adicionales ───
  {mod:'cam',q:'Según el Protocolo del Coordinador para el Consejo de Cambios TI, ¿cuál es la primera información que debe poder responder?',o:['¿Cuántos CIs están en la CMDB para este cambio?','¿Cuál es el nivel de riesgo de la encuesta?','¿Cuántos usuarios internos tiene la aplicación?','Describir claramente el Cambio que se ejecutará (Mantenimiento, Parchado, Actualización, etc.)'],c:3,e:'Lo primero es tener claridad total sobre la naturaleza del cambio antes de presentarlo al Consejo.'},
  {mod:'cam',q:'¿Cuál de los siguientes casos NO se clasifica como un Cambio TI?',o:['Adición de un servidor a la infraestructura en producción','Modificación del código fuente de una aplicación','Eliminación de una base de datos productiva','Autorización de accesos y parametrización funcional realizada por el usuario'],c:3,e:'Según las definiciones, accesos, permisos y parametrizaciones funcionales por el usuario no son Cambios TI.'},
  {mod:'cam',q:'Un cambio ejecutado directamente en una Plataforma On Premise sin herramientas como Azure DevOps o Solman se clasifica como:',o:['Cambio Automático','Cambio de Emergencia','Cambio Estándar','Cambio Manual'],c:3,e:'Los cambios que no pasan por herramientas de integración son Cambios Manuales, independientemente de su riesgo.'},
  {mod:'cam',q:'¿Cuál es el propósito del Plan de Devolución que debe tener todo coordinador de un cambio?',o:['Documentar quién aprobó el cambio en el Consejo','Notificar a los clientes sobre la afectación prevista','Registrar el costo del cambio y el ROI esperado','Definir cómo y en cuánto tiempo se puede revertir el cambio si algo sale mal'],c:3,e:'El Plan de Devolución es la estrategia de rollback: garantiza que si el cambio falla, se puede regresar al estado anterior de forma controlada.'},
  {mod:'cam',q:'¿Cuál es la definición de una "Afectación" en el proceso de Gestión de Cambios TI?',o:['Un cambio rechazado por el Consejo de Cambios','Una queja formal del cliente por indisponibilidad','Un incidente generado durante una CRQ','Interrupción y/o degradación (lentitud, intermitencia) en la disponibilidad de Aplicaciones o Componentes TI'],c:3,e:'Una afectación es cualquier degradación del servicio, desde lentitud hasta interrupción total, causada por un cambio.'},
  // ─── GESTIÓN DE CAMBIOS TI — ciclo y casos de uso ───
  {mod:'cam',q:'BullSolver es un caso de éxito en el proceso de cambios. ¿Qué lo hace exitoso?',o:['Que implementa cambios directamente sin pasar por el Consejo','Que integra automáticamente con Hilix para crear y cerrar los cambios sin intervención manual','Que permite modificar cambios automáticos en Hilix cuando hay urgencia','Que es un tipo de cambio estándar que no requiere encuesta'],c:1,e:'BullSolver (parchado) es un caso exitoso porque está plenamente integrado con Hilix: crea, ejecuta y cierra los cambios automáticamente, sin intervención humana.'},
  {mod:'cam',q:'Del total de cambios mensuales (5,000-6,000), ¿qué porcentaje aproximado son automáticos?',o:['Cerca del 10-15%','Cerca del 30-35%','Cerca del 52-53%','Cerca del 80-90%'],c:2,e:'Aproximadamente la mitad de todos los cambios mensuales son automáticos — integrados vía Azure DevOps o SolMan directamente con Hilix.'},
  {mod:'cam',q:'¿Qué ocurre cuando la encuesta de riesgos arroja nivel ALTO para un cambio automático de software?',o:['El cambio se cancela automáticamente','La herramienta obliga a generar una CRQ ágil aprobada por el líder técnico','La herramienta obliga a generar una CRQ programada que debe pasar por el Consejo de Cambios','El cambio puede ejecutarse igual pero queda como observación'],c:2,e:'Riesgo alto implica CRQ programada con doble validación: Consejo de Cambios + líder técnico de EBC — el nivel más alto de control del proceso.'},
  {mod:'cam',q:'¿Quiénes participan en la aprobación de un cambio de emergencia?',o:['Solo el aprobador del Equipo de Producto','El Aprobador del Equipo de Producto y el Consejo en sesión extraordinaria','El Aprobador del Equipo de Producto y GIOTI (en paralelo con la ejecución)','Solo GIOTI puede aprobar cambios de emergencia'],c:2,e:'La emergencia es el único tipo donde la aprobación va en paralelo con la ejecución. GIOTI y el Aprobador del Equipo de Producto actúan simultáneamente.'},
  {mod:'cam',q:'¿Cuáles son los estados del ciclo de vida de una CRQ, en orden?',o:['Registrado → Aprobado → Ejecutado → Cerrado','Borrador → Programado para aprobación → Programado → Implementación en curso → Terminado → CERRADO','Abierto → En análisis → En ejecución → Validado → Cerrado','Solicitado → Revisado → Autorizado → Desplegado → Archivado'],c:1,e:'El ciclo de vida oficial en Hilix: Borrador → Programado para aprobación → Programado → Implementación en curso → Terminado → CERRADO.'},
  {mod:'cam',q:'¿Qué debe completar el coordinador en el campo "Gestión Consejo" al preparar un cambio programado?',o:['El número de usuarios afectados por el cambio','Si el cambio se presentará como "Recomendado" (sin presencia) o "Presencial" (debe asistir a la sesión)','El monto económico del riesgo del cambio','El nombre del sistema que recibirá el cambio'],c:1,e:'El campo "Gestión Consejo" define la modalidad: Recomendado (el Consejo lo aprueba sin presencia física del coordinador) o Presencial (debe asistir a la sesión).'},
  {mod:'cam',q:'¿Cuándo genera el equipo de procesos el Acta del Consejo de Cambios?',o:['El mismo día del Consejo (martes/jueves) en la mañana','Los lunes y miércoles al mediodía — todos los cambios deben estar listos ANTES de ese corte','Al final de cada mes como resumen de cambios aprobados','Una vez que el cambio se cierra exitosamente en Hilix'],c:1,e:'El Acta se genera los lunes y miércoles al mediodía. Los cambios deben estar creados Y aprobados por el líder antes de ese corte para quedar en el Acta.'},
